[package]
name = "silent-disco-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
base64 = "=0.22.1"
jni = "=0.21.1"
serde_json = "=1.0.145"
silent-disco-core = { path = "../silent-disco-core", features = ["quic"] }
uniffi = "=0.31.0"

[features]
# Lets listeners join plaintext v3 hosts. Off in production: Android builds
# this crate without features, so it joins v4 only (phase 4, owner decision
# 2026-11-13). Tests and lab tooling enable it.
legacy-v3 = []

[lints]
workspace = true

[dev-dependencies]
p256 = { version = "=0.13.2", features = ["ecdsa", "pkcs8"] }

# These suites join plaintext v3 hosts end to end, which only `legacy-v3`
# builds may do. CI runs them through `--all-features`.
[[test]]
name = "host_transport"
required-features = ["legacy-v3"]

[[test]]
name = "host_transport_multi_listener"
required-features = ["legacy-v3"]

[[test]]
name = "listener_transport"
required-features = ["legacy-v3"]
