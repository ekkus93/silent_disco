name: Validate Desktop Block 20 UDP faults

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/desktop-block20-faults.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: desktop-block20-fault-validation
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.1"
  TRACKING_ISSUE: "45"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact master input
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Capture input and publish start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "BLOCK20_FAULT_INPUT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          gh issue comment "${TRACKING_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
            --body "Desktop Block 20 UDP loss/reorder validation started in Actions run ${GITHUB_RUN_ID} against direct-master input $(git rev-parse HEAD). No branch or PR is involved."

      - name: Install pinned Rust
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy --component rustfmt
          rustup default "${RUST_VERSION}"

      - name: Run strict fault-injection gates
        run: |
          set -o pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all 2>&1 | tee /tmp/block20-fault-format.log
          bash scripts/check-source-file-line-counts.sh 2>&1 | tee /tmp/block20-fault-lines.log
          cargo clippy --manifest-path rust/Cargo.toml -p silent-disco-core \
            --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/block20-fault-clippy.log
          cargo test --manifest-path rust/Cargo.toml -p silent-disco-core \
            transport::virtual_fault_tests -- --nocapture 2>&1 | tee /tmp/block20-fault-tests.log
          cargo test --manifest-path rust/Cargo.toml -p silent-disco-core \
            transport -- --nocapture 2>&1 | tee /tmp/block20-transport-tests.log

      - name: Commit validated faults and clean temporary machinery
        run: |
          set -euo pipefail
          git rm .github/workflows/desktop-block20-faults.yml
          git rm --ignore-unmatch .github/workflows/desktop-block20-retry.yml
          git rm --ignore-unmatch .github/desktop-block20-lint-repair.py
          git add rust/silent-disco-core/src/transport
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Validate virtual UDP fault injection (Desktop Block 20)"
          remote_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test "${remote_sha}" = "$(git rev-parse HEAD^)"
          git push origin HEAD:master
          echo "BLOCK20_FAULT_COMMIT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Publish success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${TRACKING_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
            --body "Desktop Block 20 deterministic virtual UDP loss/reorder gates passed in Actions run ${GITHUB_RUN_ID}. Commit ${BLOCK20_FAULT_COMMIT} was pushed directly to master; send accounting remains independent from receive-side fault injection."

      - name: Publish compact failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Desktop Block 20 UDP loss/reorder validation failed in Actions run ${GITHUB_RUN_ID} against ${BLOCK20_FAULT_INPUT}. Block 20 remains incomplete."
            echo
            echo '```text'
            tail -100 /tmp/block20-fault-format.log 2>/dev/null || true
            tail -100 /tmp/block20-fault-lines.log 2>/dev/null || true
            tail -180 /tmp/block20-fault-clippy.log 2>/dev/null || true
            tail -180 /tmp/block20-fault-tests.log 2>/dev/null || true
            tail -180 /tmp/block20-transport-tests.log 2>/dev/null || true
            echo '```'
          } > /tmp/block20-fault-failure.md
          gh issue comment "${TRACKING_ISSUE}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/block20-fault-failure.md
