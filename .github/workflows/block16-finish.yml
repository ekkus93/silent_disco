name: Finish Desktop Block 16

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Rebase patch generator on current master
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/block16_finish_patch.py")
          text = path.read_text()

          start_marker = '''replace_once(
              "desktop/src-tauri/src/platform/effect_runner.rs",'''
          end_marker = '''replace_once(
              "desktop/src-tauri/src/app_state.rs",'''
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''replace_once(
              "desktop/src-tauri/src/platform/effect_runner.rs",
              """    pub(crate) fn start(
                  inbox: DesktopPlatformEffectInbox,
                  dispatcher: DesktopPlatformEffectDispatcher,
                  handle: CoreActorHandle,
                  paths: DesktopProfilePaths,
              ) -> Result<Self, CoreError> {
                  let capability_handle = handle.clone();
                  let runner = Self::start_with_components(
                      inbox,
                      dispatcher,
                      Arc::new(handle),
                      Arc::new(DesktopPlatformAdapters::new(paths)),
                  )?;
                  if let Err(primary) = publish_desktop_capabilities(&capability_handle) {
                      return match runner.shutdown() {
                          Ok(()) => Err(primary),
                          Err(cleanup) => Err(append_startup_cleanup(primary, &cleanup)),
                      };
                  }
                  Ok(runner)
              }
          """,
              """    pub(crate) fn start(
                  inbox: DesktopPlatformEffectInbox,
                  dispatcher: DesktopPlatformEffectDispatcher,
                  handle: CoreActorHandle,
                  paths: DesktopProfilePaths,
              ) -> Result<(Self, CoreSnapshot), CoreError> {
                  let capability_handle = handle.clone();
                  let runner = Self::start_with_components(
                      inbox,
                      dispatcher,
                      Arc::new(handle),
                      Arc::new(DesktopPlatformAdapters::new(paths)),
                  )?;
                  let snapshot = match publish_desktop_capabilities(&capability_handle) {
                      Ok(snapshot) => snapshot,
                      Err(primary) => {
                          return match runner.shutdown() {
                              Ok(()) => Err(primary),
                              Err(cleanup) => Err(append_startup_cleanup(primary, &cleanup)),
                          };
                      }
                  };
                  Ok((runner, snapshot))
              }
          """,
          )
          '''
          text = text[:start] + replacement + text[end:]

          old_import_call = '''replace_once(
              "desktop/src-tauri/src/app_state.rs",
              "use crate::platform::identity::{",
              """use crate::platform::file_picker::SelectedSourceRegistry;
          use crate::platform::identity::{""",
          )'''
          new_import_call = '''replace_once(
              "desktop/src-tauri/src/app_state.rs",
              """use crate::platform::effect_runner::{
              DesktopCoreObserver, DesktopPlatformEffectDispatcher, DesktopPlatformEffectRunner,
          };
          use crate::platform::identity::{""",
              """use crate::platform::effect_runner::{
              DesktopCoreObserver, DesktopPlatformEffectDispatcher, DesktopPlatformEffectRunner,
          };
          use crate::platform::file_picker::SelectedSourceRegistry;
          use crate::platform::identity::{""",
          )'''
          if text.count(old_import_call) != 1:
              raise SystemExit("expected one app-state import patch call")
          text = text.replace(old_import_call, new_import_call, 1)

          old_assertion = '''    assert!(source
                  .descriptor()
                  .display_name
                  .is_char_boundary(source.descriptor().display_name.len()));'''
          new_assertion = '''    assert!(source.descriptor().display_name.ends_with('界'));'''
          if text.count(old_assertion) != 1:
              raise SystemExit("expected one Unicode-boundary assertion")
          path.write_text(text.replace(old_assertion, new_assertion, 1))
          PY

      - name: Apply complete Block 16 closure
        run: python scripts/block16_finish_patch.py

      - name: Format desktop Rust
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all

      - name: Check desktop Rust
        run: |
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --all-features
          cargo check --manifest-path desktop/src-tauri/Cargo.toml --all-features

      - name: Stage validated source artifact
        run: |
          mkdir -p block16-patch/desktop/src-tauri/src/platform
          mkdir -p block16-patch/desktop/src-tauri/src
          cp desktop/src-tauri/src/platform/capabilities.rs block16-patch/desktop/src-tauri/src/platform/
          cp desktop/src-tauri/src/platform/effect_runner.rs block16-patch/desktop/src-tauri/src/platform/
          cp desktop/src-tauri/src/platform/capability_tests.rs block16-patch/desktop/src-tauri/src/platform/
          cp desktop/src-tauri/src/platform/file_picker.rs block16-patch/desktop/src-tauri/src/platform/
          cp desktop/src-tauri/src/platform/file_picker_tests.rs block16-patch/desktop/src-tauri/src/platform/
          cp desktop/src-tauri/src/app_state.rs block16-patch/desktop/src-tauri/src/

      - name: Upload validated source artifact
        uses: actions/upload-artifact@v4
        with:
          name: block16-complete-source-patch
          path: block16-patch
          if-no-files-found: error
          retention-days: 1
