name: Desktop Block 23 source snapshot

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: >-
      github.event.issue.number == 45 &&
      github.event.comment.body == '/apply-desktop-block23-tauri-clippy-adapter-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Wire deterministic adapter and restore snapshot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          invocation_old = "python3 .github/block23-storage-runner-adapt.py\n"
          invocation_new = invocation_old + "python3 .github/block23-tauri-clippy-adapt.py\n"
          for name in (
              ".github/block23-validation.sh",
              ".github/workflows/desktop-block23-diagnostics.yml",
              ".github/workflows/desktop-block23-frontend-diagnostics.yml",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              count = text.count(invocation_old)
              if count != 1:
                  raise SystemExit(f"{name}: expected one adapter invocation anchor, found {count}")
              path.write_text(text.replace(invocation_old, invocation_new, 1), encoding="utf-8")

          validation = Path(".github/block23-validation.sh")
          text = validation.read_text(encoding="utf-8")
          cleanup_old = "  .github/block23-storage-runner-adapt.py \\\n"
          cleanup_new = cleanup_old + "  .github/block23-tauri-clippy-adapt.py \\\n"
          if text.count(cleanup_old) != 1:
              raise SystemExit("validation cleanup anchor is not unique")
          text = text.replace(cleanup_old, cleanup_new, 1)
          allowed_old = "    '.github/block23-storage-runner-adapt.py',\n"
          allowed_new = allowed_old + "    '.github/block23-tauri-clippy-adapt.py',\n"
          if text.count(allowed_old) != 1:
              raise SystemExit("validation allowed-path anchor is not unique")
          text = text.replace(allowed_old, allowed_new, 1)
          validation.write_text(text, encoding="utf-8")

          Path(".github/workflows/desktop-block23-tauri-clippy-diagnostic.yml").unlink()
          snapshot = base64.b64decode("").decode("utf-8")
          Path(".github/workflows/desktop-block23-source-snapshot.yml").write_text(snapshot, encoding="utf-8")
          PY
          git diff --check
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Wire Block 23 Tauri clippy adapter"
          remote_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test "$remote_sha" = "$(git rev-parse HEAD^)"
          git push origin HEAD:master
          gh issue comment 45 --repo "$GITHUB_REPOSITORY" --body "Applied deterministic Block 23 Tauri clippy adapter wiring in commit $(git rev-parse HEAD)."
