name: Desktop Block 23 source snapshot

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  snapshot:
    if: >-
      github.event.issue.number == 45 &&
      github.event.comment.body == '/snapshot-desktop-block23-v2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply current Block 23 payload
        run: |
          cat .github/apply-block23.py.part-* | base64 --decode | gzip --decompress > .github/apply-block23.py
          python3 .github/block23-adapt.py
          python3 .github/block23-client-adapt.py
          mkdir -p desktop/dist
          printf '%s\n' '<!doctype html><html><body></body></html>' > desktop/dist/index.html
          python3 .github/apply-block23.py
          rm .github/apply-block23.py
          python3 .github/block23-storage-runner-adapt.py
      - name: Package relevant generated sources
        run: |
          tar -czf /tmp/block23-generated-sources.tar.gz \
            desktop/src-tauri/src/host_session_dto.rs \
            desktop/src-tauri/src/platform/host_transport.rs \
            desktop/src-tauri/src/platform/host_transport_events.rs \
            desktop/src-tauri/src/platform/network_error.rs \
            desktop/src-tauri/src/platform/storage_effect_runner.rs \
            desktop/src/App.test.tsx \
            desktop/src/screens/HostSessionScreen.tsx \
            desktop/src/screens/HostSessionScreen.test.tsx \
            desktop/src/screens/ListenerDetailScreen.tsx \
            desktop/src/core/generated/desktop-bindings.ts
      - uses: actions/upload-artifact@v4
        with:
          name: block23-generated-sources
          path: /tmp/block23-generated-sources.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Announce snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 45 --repo "$GITHUB_REPOSITORY" \
            --body "Desktop Block 23 generated-source snapshot published by Actions run $GITHUB_RUN_ID against $(git rev-parse HEAD). No implementation changes were committed."
