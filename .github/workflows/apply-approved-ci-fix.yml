name: Apply approved CI source fix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-approved-ci-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply approved source corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str, expected: int = 1) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old!r}")
              path.write_text(text.replace(old, new))

          rust = Path("rust/silent-disco-ffi/src/android_database_abi.rs")
          replace_exact(
              rust,
              "fn delete_trusted_device(\n    handle: i64,\n    device_id: DeviceId,\n) -> Result<bool, AndroidDatabaseStatus> {",
              "fn delete_trusted_device(\n    handle: i64,\n    device_id: &DeviceId,\n) -> Result<bool, AndroidDatabaseStatus> {",
          )
          replace_exact(rust, ".delete_trusted_device(&device_id)", ".delete_trusted_device(device_id)")
          replace_exact(
              rust,
              ".and_then(|device_id| delete_trusted_device(handle, device_id));",
              ".and_then(|device_id| delete_trusted_device(handle, &device_id));",
          )
          replace_exact(
              rust,
              "delete_trusted_device(handle, device.device_id.clone()),",
              "delete_trusted_device(handle, &device.device_id),",
          )
          replace_exact(
              rust,
              "pub extern \"system\" fn Java_com_ekkus_silentdisco_core_rust_RustDatabaseBridge_nativeDatabaseCachedTrustedDeviceId(\n    mut env: JNIEnv<'_>,",
              "pub extern \"system\" fn Java_com_ekkus_silentdisco_core_rust_RustDatabaseBridge_nativeDatabaseCachedTrustedDeviceId(\n    env: JNIEnv<'_>,",
          )
          replace_exact(
              rust,
              "pub extern \"system\" fn Java_com_ekkus_silentdisco_core_rust_RustDatabaseBridge_nativeDatabaseCachedTrustedDisplayName(\n    mut env: JNIEnv<'_>,",
              "pub extern \"system\" fn Java_com_ekkus_silentdisco_core_rust_RustDatabaseBridge_nativeDatabaseCachedTrustedDisplayName(\n    env: JNIEnv<'_>,",
          )

          dashboard = Path("app/src/main/java/com/ekkus/silentdisco/feature/host/HostDashboardScreen.kt")
          replace_exact(
              dashboard,
              "internal enum class HostDashboardTab(val title: String)",
              "enum class HostDashboardTab(val title: String)",
          )

          trusted = Path("app/src/main/java/com/ekkus/silentdisco/feature/settings/TrustedDevicesScreen.kt")
          replace_exact(trusted, "import androidx.compose.foundation.layout.weight\n", "")
          PY

      - name: Format Rust source with pinned toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          cd rust
          cargo +1.97.1 fmt --all

      - name: Verify intended changes
        shell: bash
        run: |
          set -euo pipefail
          grep -F "enum class HostDashboardTab" app/src/main/java/com/ekkus/silentdisco/feature/host/HostDashboardScreen.kt
          ! grep -F "import androidx.compose.foundation.layout.weight" app/src/main/java/com/ekkus/silentdisco/feature/settings/TrustedDevicesScreen.kt
          grep -F "device_id: &DeviceId" rust/silent-disco-ffi/src/android_database_abi.rs
          cd rust
          cargo +1.97.1 fmt --all -- --check

      - name: Commit source fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-approved-ci-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix CI source validation failures"
          git push origin HEAD:master
