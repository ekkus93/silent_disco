name: Block 9 connected diagnostic

on:
  push:
    branches:
      - agent/fix-block9-trust-storage-state

permissions:
  contents: write

concurrency:
  group: block9-connected-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-block9-trust-storage-state
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Run each Android instrumentation class separately
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set +e
            mkdir -p block9-connected-logs
            overall=0
            classes=(
              com.ekkus.silentdisco.core.rust.RustCoreBridgeInstrumentedTest
              com.ekkus.silentdisco.core.rust.RustSyncEstimatorInstrumentedTest
              com.ekkus.silentdisco.core.transport.BleDiscoveryServiceInstrumentedTest
              com.ekkus.silentdisco.platform.persistence.AndroidRustDomainStoreInstrumentedTest
            )
            for class_name in "${classes[@]}"; do
              log_name="${class_name//./_}.log"
              ./gradlew connectedDebugAndroidTest \
                -Pandroid.testInstrumentationRunnerArguments.class="${class_name}" \
                --stacktrace --console=plain \
                > "block9-connected-logs/${log_name}" 2>&1
              status=$?
              printf '%s=%s\n' "${class_name}" "${status}" \
                | tee -a block9-connected-statuses.txt
              if [ "${status}" -ne 0 ]; then
                overall=1
              fi
            done
            echo "${overall}" > block9-connected.status
            exit 0

      - name: Commit diagnostics and remove temporary workflow
        if: always()
        shell: bash
        run: |
          mkdir -p .validation/block9-connected
          if [ -d block9-connected-logs ]; then
            cp block9-connected-logs/*.log .validation/block9-connected/ 2>/dev/null || true
          fi
          if [ -f block9-connected-statuses.txt ]; then
            cp block9-connected-statuses.txt .validation/block9-connected/statuses.txt
          else
            printf 'instrumentation_action=125\n' > .validation/block9-connected/statuses.txt
          fi
          status="$(cat block9-connected.status 2>/dev/null || printf '125')"
          printf 'status=%s\nrun_id=%s\nhead_sha=%s\n' \
            "${status}" "${GITHUB_RUN_ID}" "${GITHUB_SHA}" \
            > .validation/block9-connected/result.txt
          rm -f .github/workflows/block9-connected-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .validation/block9-connected \
            .github/workflows/block9-connected-diagnostic.yml
          git commit -m "Record isolated Block 9 connected test diagnostics"
          git push origin HEAD:agent/fix-block9-trust-storage-state
          exit "${status}"
