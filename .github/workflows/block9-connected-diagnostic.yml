name: Block 9 connected diagnostic

on:
  push:
    branches:
      - agent/fix-block9-trust-storage-state

permissions:
  contents: write

concurrency:
  group: block9-connected-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-block9-trust-storage-state
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Run migration-checksum instrumentation test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set +e
            ./gradlew connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.ekkus.silentdisco.platform.persistence.AndroidRustDomainStoreInstrumentedTest#migrationChecksumFailureProducesFatalVisibleStorageState \
              --stacktrace --console=plain \
              > block9-connected.log 2>&1
            status=$?
            echo "${status}" > block9-connected.status
            exit 0

      - name: Commit diagnostics and remove temporary workflow
        if: always()
        shell: bash
        run: |
          mkdir -p .validation/block9-connected
          cp block9-connected.log .validation/block9-connected/migration-checksum.log 2>/dev/null || true
          status="$(cat block9-connected.status 2>/dev/null || printf '125')"
          printf 'migration_checksum_test=%s\nrun_id=%s\nhead_sha=%s\n' \
            "${status}" "${GITHUB_RUN_ID}" "${GITHUB_SHA}" \
            > .validation/block9-connected/statuses.txt
          rm -f .github/workflows/block9-connected-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .validation/block9-connected \
            .github/workflows/block9-connected-diagnostic.yml
          git commit -m "Record migration-checksum connected test diagnostics"
          git push origin HEAD:agent/fix-block9-trust-storage-state
          exit "${status}"
