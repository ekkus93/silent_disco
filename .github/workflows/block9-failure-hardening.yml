name: Block 9 Failure Hardening

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  harden-validate-commit:
    if: github.event.pull_request.head.ref == 'agent/rust-storage-block9'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-storage-block9
          fetch-depth: 0
      - name: Apply guarded failure hardening
        run: python .github/scripts/harden_block9_android_failures.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Validate hardened Android persistence paths
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            assembleDebug \
            assembleDebugAndroidTest \
            test \
            lintDebug \
            --stacktrace \
            --console=plain \
            2>&1 | tee block9-failure-hardening.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block9-failure-hardening
          path: |
            block9-failure-hardening.log
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 1
      - name: Ensure patch hygiene
        run: git diff --check
      - name: Remove hardening helpers
        run: |
          rm .github/scripts/harden_block9_android_failures.py
          rm .github/workflows/block9-failure-hardening.yml
      - name: Commit validated hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden Android persistence failure visibility'
          git push origin HEAD:agent/rust-storage-block9
