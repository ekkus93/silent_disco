name: Repository cleanup audit record

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: read

jobs:
  audit:
    if: github.event.head_commit.message == 'Record repository cleanup audit'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record branches and open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mkdir -p .repository-audit
          printf 'branch\tsha\trelation_to_master\n' > .repository-audit/branches.tsv
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [ "$branch" = "HEAD" ] && continue
            sha="$(git rev-parse "$ref")"
            if [ "$branch" = "master" ]; then
              relation=master
            elif git merge-base --is-ancestor "$ref" origin/master; then
              relation=merged_into_master
            elif git merge-base --is-ancestor origin/master "$ref"; then
              relation=ahead_of_master
            else
              relation=diverged_from_master
            fi
            printf '%s\t%s\t%s\n' "$branch" "$sha" "$relation" >> .repository-audit/branches.tsv
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin | sort)
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" > .repository-audit/open-prs.json
          jq -r '.[] | [.number, .draft, .head.ref, .base.ref, .mergeable_state, .title] | @tsv' \
            .repository-audit/open-prs.json > .repository-audit/open-prs.tsv

      - name: Commit audit inventory and remove workflow
        run: |
          rm .github/workflows/repository-cleanup-audit-record.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record temporary repository cleanup inventory"
          git push origin HEAD:master
