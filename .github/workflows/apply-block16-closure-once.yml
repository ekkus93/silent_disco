name: Apply Desktop Block 16 acceptance closure once

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/apply-block16-closure-once.yml"

permissions:
  contents: write

concurrency:
  group: apply-desktop-block16-closure-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy pinned validated closure source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin b0062b05bc4f14a822eaa5f7784f579ed58a7c1f
          git checkout FETCH_HEAD -- \
            desktop/src-tauri/src/app_state.rs \
            desktop/src-tauri/src/platform/capabilities.rs \
            desktop/src-tauri/src/platform/capability_tests.rs \
            desktop/src-tauri/src/platform/effect_runner.rs \
            desktop/src-tauri/src/platform/file_picker.rs \
            desktop/src-tauri/src/platform/file_picker_tests.rs
          python - <<'PY'
          from pathlib import Path

          path = Path("desktop/src-tauri/src/app_state.rs")
          text = path.read_text()
          old = '''        assert!(
                      response
                          .snapshot
                          .capabilities
                          .audio_source_selection_available
                  );
          '''
          new = '''        assert!(response.snapshot.capabilities.audio_source_selection_available);
          '''
          if text.count(old) != 1:
              raise SystemExit("expected multiline capability assertion was not found exactly once")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit closure and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src-tauri/src
          git rm .github/workflows/apply-block16-closure-once.yml
          git commit -m "Close Desktop Block 16 acceptance gaps"
          git push origin HEAD:master
