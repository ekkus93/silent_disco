# Installed before this trigger commit so the push event can start the workflow.
name: Guard Desktop Block 14

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "scripts/apply-block14-desktop-host-setup.py"
      - ".github/workflows/run-block14-desktop-host-setup.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: guarded-desktop-block14
  cancel-in-progress: false

env:
  NODE_VERSION: "22.16.0"
  RUST_VERSION: "1.97.1"

jobs:
  implement-and-validate:
    name: Implement and validate Desktop Block 14
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Announce guarded run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 45 --repo "${GITHUB_REPOSITORY}" --body \
            "Desktop Block 14 guarded implementation started in Actions run ${GITHUB_RUN_ID}. Production changes will be committed only after all validation gates pass."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy --component rustfmt
          rustup default "${RUST_VERSION}"

      - name: Install Linux and Android dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Apply Block 14 production slice
        run: python scripts/apply-block14-desktop-host-setup.py

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Prepare generated bindings and canonical formatting
        run: |
          mkdir -p desktop/dist
          printf '<!doctype html><title>Silent Disco guarded validation</title>\n' > desktop/dist/index.html
          cd desktop
          npm run bindings:generate
          npm run format
          cd ../rust
          cargo fmt --all
          cd ../desktop/src-tauri
          cargo fmt --all
          cd ../..
          git add -A

      - name: Enforce tracked source line limit
        run: bash scripts/check-source-file-line-counts.sh

      - name: Validate shared Rust
        shell: bash
        run: |
          set -o pipefail
          cd rust
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee ../block14-shared-rust-clippy.log
          cargo test --workspace --all-features 2>&1 | tee ../block14-shared-rust-tests.log

      - name: Validate desktop frontend
        shell: bash
        run: |
          set -o pipefail
          cd desktop
          npm run bindings:check
          npm run format:check
          npm run lint
          npm run typecheck
          npm test -- --run 2>&1 | tee ../block14-frontend-tests.log
          npm run build

      - name: Validate desktop backend
        shell: bash
        run: |
          set -o pipefail
          cd desktop/src-tauri
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee ../../block14-desktop-rust-clippy.log
          cargo test --all-features 2>&1 | tee ../../block14-desktop-rust-tests.log
          cargo check --all-features

      - name: Validate Android integration
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace --console=plain \
            2>&1 | tee block14-android-validation.log

      - name: Verify production diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check --cached
          test ! -e scripts/apply-block14-desktop-host-setup.py
          test ! -e .github/workflows/run-block14-desktop-host-setup.yml
          test -f desktop/src/screens/HostSetupScreen.tsx
          test -f desktop/src/screens/HostSetupScreen.test.tsx
          git status --short

      - name: Commit validated Block 14
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement desktop Block 14 host setup"
          git push origin HEAD:master
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Publish success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh issue comment 45 --repo "${GITHUB_REPOSITORY}" --body \
            "Desktop Block 14 guarded validation passed in Actions run ${GITHUB_RUN_ID}. Validated commit: ${COMMIT_SHA}. Shared Rust formatting/Clippy/tests, desktop bindings/format/lint/typecheck/tests/build, desktop Rust formatting/Clippy/tests/check, source line limit, and Android assemble/unit-tests/lint all passed."

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-block14-diagnostics
          path: |
            block14-*.log
            desktop/src/core/generated/desktop-bindings.ts
            desktop/dist/
          if-no-files-found: warn
          retention-days: 3

      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 45 --repo "${GITHUB_REPOSITORY}" --body \
            "Desktop Block 14 guarded implementation failed in Actions run ${GITHUB_RUN_ID}. No production Block 14 commit was pushed. Inspect the failed step and uploaded diagnostics before retrying."
