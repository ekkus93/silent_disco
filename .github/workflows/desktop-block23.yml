name: Desktop Block 23 listener management

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: desktop-block23-validation
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.1"
  NODE_VERSION: "22.16.0"
  TRACKING_ISSUE: "45"

jobs:
  validate:
    if: >-
      github.event.issue.number == 45 &&
      github.event.comment.body == '/run-desktop-block23'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Capture exact input and announce
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "BLOCK23_INPUT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Desktop Block 23 guarded implementation started in Actions run $GITHUB_RUN_ID against direct-master input $(git rev-parse HEAD). No branch or PR is involved."

      - name: Inspect pre-ownership generated state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/block23-validation.sh')
          content = path.read_text(encoding='utf-8')
          needle = "python3 .github/apply-block23.py\nrm .github/apply-block23.py\n"
          replacement = '''python3 - <<'PATCHPY'
          import base64
          from pathlib import Path

          patch_path = Path('.github/apply-block23.py')
          patch = patch_path.read_text(encoding='utf-8')
          old = base64.b64decode('').decode('utf-8')
          new = base64.b64decode('').decode('utf-8')
          if patch.count(old) != 1:
              raise SystemExit('stale bindings anchor was not unique')
          patch = patch.replace(old, new)
          marker = '# Patch network ownership and clock propagation.'
          if patch.count(marker) != 1:
              raise SystemExit('ownership marker was not unique')
          patch_path.write_text(patch.split(marker, 1)[0], encoding='utf-8')
          PATCHPY
          python3 .github/apply-block23.py
          echo '=== GENERATED HOST TRANSPORT ==='
          nl -ba desktop/src-tauri/src/platform/host_transport.rs
          echo '=== CURRENT NETWORK OWNERSHIP REGION ==='
          nl -ba desktop/src-tauri/src/platform/network.rs | sed -n '1,390p'
          exit 1
          '''
          if content.count(needle) != 1:
              raise SystemExit('validator execution anchor was not unique')
          path.write_text(content.replace(needle, replacement), encoding='utf-8')
          PY

      - name: Apply, validate, document, and publish Block 23
        run: bash .github/block23-validation.sh

      - name: Publish success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Desktop Block 23 passed in Actions run $GITHUB_RUN_ID and committed $BLOCK23_COMMIT directly to master. Delivery-first approval/rejection/removal, trusted-device persistence, listener detail UI, full Rust/desktop/Linux/Android/ABI/instrumentation gates, evidence, and cleanup all passed."

      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Desktop Block 23 validation failed in Actions run $GITHUB_RUN_ID against $BLOCK23_INPUT. No implementation or completion evidence was committed; continue directly on master from the first failed command."
