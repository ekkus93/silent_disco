name: Desktop Block 23 listener management

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: desktop-block23-validation
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.1"
  NODE_VERSION: "22.16.0"
  TRACKING_ISSUE: "45"
  VALIDATION_LAYOUT: "dependency-first"

jobs:
  validate:
    if: >-
      github.event.issue.number == 45 &&
      github.event.comment.body == '/run-desktop-block23'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Capture exact input and announce
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "BLOCK23_INPUT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Desktop Block 23 guarded implementation started in Actions run $GITHUB_RUN_ID against direct-master input $(git rev-parse HEAD). No branch or PR is involved."

      - name: Prepare current-layout implementation payload
        run: |
          cat .github/apply-block23.py.part-* | base64 --decode | gzip --decompress > .github/apply-block23.py
          python3 .github/block23-adapt.py
          python3 .github/block23-client-adapt.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/block23-validation.sh')
          content = path.read_text(encoding='utf-8')
          old_cleanup = '''  .github/block23-adapt.py \\
            .github/block23-validation.sh \\
          '''
          new_cleanup = '''  .github/block23-adapt.py \\
            .github/block23-client-adapt.py \\
            .github/block23-inspect-payload.py \\
            .github/block23-validation.sh \\
          '''
          if content.count(old_cleanup) != 1:
              raise SystemExit('validator cleanup adapter anchor was not unique')
          content = content.replace(old_cleanup, new_cleanup, 1)
          old_allowed = "    '.github/block23-adapt.py',\n    '.github/block23-validation.sh',"
          new_allowed = "    '.github/block23-adapt.py',\n    '.github/block23-client-adapt.py',\n    '.github/block23-inspect-payload.py',\n    '.github/block23-validation.sh',"
          if content.count(old_allowed) != 1:
              raise SystemExit('validator allowed-path adapter anchor was not unique')
          path.write_text(content.replace(old_allowed, new_allowed, 1), encoding='utf-8')
          PY

      - name: Apply, validate, document, and publish Block 23
        run: bash .github/block23-validation.sh

      - name: Publish success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Desktop Block 23 passed in Actions run $GITHUB_RUN_ID and committed $BLOCK23_COMMIT directly to master. Delivery-first approval/rejection/removal, trusted-device persistence, listener detail UI, full Rust/desktop/Linux/Android/ABI/instrumentation gates, evidence, and cleanup all passed."

      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Desktop Block 23 validation failed in Actions run $GITHUB_RUN_ID against $BLOCK23_INPUT. No implementation or completion evidence was committed; continue directly on master from the first failed command."
