name: Guard Desktop Block 13 Authority Cleanup

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "scripts/apply-block13-authority-cleanup.py"
      - ".github/workflows/run-block13-authority-cleanup.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: guarded-desktop-block13-authority
  cancel-in-progress: false

env:
  NODE_VERSION: "22.16.0"
  RUST_VERSION: "1.97.1"
  CARGO_NET_RETRY: "5"

jobs:
  implement-and-validate:
    name: Implement and validate Block 13 authority cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Announce guarded run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 45 --repo "${GITHUB_REPOSITORY}" --body \
            "Desktop Block 13 authority cleanup started in Actions run ${GITHUB_RUN_ID}. Production and completion-record changes will be committed only after every shared Rust, Android, and desktop regression gate passes."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy --component rustfmt
          rustup default "${RUST_VERSION}"

      - name: Install Linux and Android dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Apply Block 13 authority cleanup
        run: |
          python scripts/apply-block13-authority-cleanup.py
          git add -A
          git diff --check --cached

      - name: Enforce tracked source line limit
        run: bash scripts/check-source-file-line-counts.sh

      - name: Validate shared Rust
        shell: bash
        run: |
          set -o pipefail
          cd rust
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings \
            2>&1 | tee ../block13-authority-shared-rust-clippy.log
          cargo test --workspace --all-features \
            2>&1 | tee ../block13-authority-shared-rust-tests.log

      - name: Validate Android authority integration
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace --console=plain \
            2>&1 | tee block13-authority-android-validation.log

      - name: Validate desktop frontend regression
        shell: bash
        run: |
          set -o pipefail
          mkdir -p desktop/dist
          printf '<!doctype html><title>Silent Disco guarded validation</title>\n' > desktop/dist/index.html
          cd desktop
          npm ci
          npm run bindings:check
          npm run format:check
          npm run lint
          npm run typecheck
          npm test -- --run 2>&1 | tee ../block13-authority-desktop-tests.log
          npm run build

      - name: Validate desktop backend regression
        shell: bash
        run: |
          set -o pipefail
          cd desktop/src-tauri
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings \
            2>&1 | tee ../../block13-authority-desktop-rust-clippy.log
          cargo test --all-features \
            2>&1 | tee ../../block13-authority-desktop-rust-tests.log
          cargo check --all-features

      - name: Verify authority closure diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check --cached
          test ! -e scripts/apply-block13-authority-cleanup.py
          test ! -e .github/workflows/run-block13-authority-cleanup.yml
          test -f app/src/main/java/com/ekkus/silentdisco/app/HostPlaybackAuthority.kt
          test -f app/src/test/java/com/ekkus/silentdisco/app/HostPlaybackAuthorityTest.kt
          grep -q "transitionPlaybackState" app/src/main/java/com/ekkus/silentdisco/app/MainViewModelHostActions.kt
          grep -q "runAfterAuthoritativeHostPlaybackTransition" app/src/main/java/com/ekkus/silentdisco/app/MainViewModelHostActions.kt
          ! grep -R "manual-trust-" app/src/main/java
          ! grep -R "fun trustListener" app/src/main/java
          ! grep -R "trustRustListener" app/src/main/java
          ! grep -R "trustedListenerPersistenceMessage" app/src/main/java
          grep -q "Desktop Block 13 authority closure" memory.md
          git status --short

      - name: Commit validated Block 13 closure
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finish Desktop Block 13 authority cleanup"
          git push origin HEAD:master
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Publish success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh issue comment 45 --repo "${GITHUB_REPOSITORY}" --body \
            "Desktop Block 13 authority cleanup passed in Actions run ${GITHUB_RUN_ID} and committed ${COMMIT_SHA}. Android start/resume/pause/stop now await Rust-confirmed playback state before platform side effects; the manual trust bypass was removed. Source-size, shared Rust fmt/strict Clippy/tests, Android assemble/unit-tests/lint, desktop frontend, and desktop Rust gates all passed."

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-block13-authority-diagnostics
          path: |
            block13-authority-*.log
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 3

      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 45 --repo "${GITHUB_REPOSITORY}" --body \
            "Desktop Block 13 authority cleanup failed in Actions run ${GITHUB_RUN_ID}. No production authority-cleanup commit was pushed. Inspect the failed step and diagnostics before retrying."
