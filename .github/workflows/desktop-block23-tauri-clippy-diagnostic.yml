name: Desktop Block 23 Tauri clippy diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: desktop-block23-tauri-clippy-diagnostic
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.1"
  NODE_VERSION: "22.16.0"
  TRACKING_ISSUE: "45"

jobs:
  diagnose:
    if: >-
      github.event.issue.number == 45 &&
      github.event.comment.body == '/diagnose-desktop-block23-tauri-clippy-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Capture exact input
        run: echo "BLOCK23_INPUT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply current Block 23 generated tree
        run: |
          cat .github/apply-block23.py.part-* | base64 --decode | gzip --decompress > .github/apply-block23.py
          python3 .github/block23-adapt.py
          python3 .github/block23-client-adapt.py
          mkdir -p desktop/dist
          printf '%s\n' '<!doctype html><html><body></body></html>' > desktop/dist/index.html
          python3 .github/apply-block23.py
          rm .github/apply-block23.py
          python3 .github/block23-storage-runner-adapt.py

      - name: Install Rust and Linux dependencies
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy --component rustfmt
          rustup default "${RUST_VERSION}"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf time wget

      - name: Run exact Tauri clippy gate
        id: clippy
        continue-on-error: true
        working-directory: desktop/src-tauri
        run: |
          set -o pipefail
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/block23-tauri-clippy.log

      - name: Upload complete clippy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block23-tauri-clippy-log
          path: /tmp/block23-tauri-clippy.log
          if-no-files-found: error

      - name: Publish exact diagnostic excerpt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
        run: |
          {
            printf 'Desktop Block 23 Tauri clippy diagnostic completed in Actions run %s against exact input `%s`. Outcome: `%s`.\n\n' "$GITHUB_RUN_ID" "$BLOCK23_INPUT" "$CLIPPY_OUTCOME"
            printf '```text\n'
            if [[ -f /tmp/block23-tauri-clippy.log ]]; then
              tail -n 160 /tmp/block23-tauri-clippy.log
            else
              printf 'Clippy log was not produced.\n'
            fi
            printf '```\n'
          } > /tmp/block23-tauri-clippy-comment.md
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/block23-tauri-clippy-comment.md

      - name: Fail when clippy failed
        if: steps.clippy.outcome != 'success'
        run: exit 1
