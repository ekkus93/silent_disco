name: Record desktop Block 10 completion

on:
  push:
    branches:
      - ralph/desktop-block10
    paths:
      - "scripts/record-desktop-block10.py"
      - ".github/workflows/ralph-desktop-block10-record.yml"

permissions:
  contents: write

concurrency:
  group: ralph-desktop-block10-record
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ralph/desktop-block10
          fetch-depth: 0

      - name: Update TODOs and memory
        run: python3 scripts/record-desktop-block10.py

      - name: Verify focused documentation patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git status --porcelain | awk '{print $2}')"
          printf '%s\n' "${changed}"
          for expected in \
            docs/SILENT_DISCO_RUST_CORE_MIGRATION_TODO.md \
            docs/SILENT_DISCO_TAURI_DESKTOP_HOST_TODO.md \
            memory.md; do
            grep -qx "${expected}" <<<"${changed}"
          done

      - name: Commit completion record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ralph-desktop-block10-record.yml
          git rm scripts/record-desktop-block10.py
          git add docs/SILENT_DISCO_RUST_CORE_MIGRATION_TODO.md \
            docs/SILENT_DISCO_TAURI_DESKTOP_HOST_TODO.md memory.md
          git commit -m "Record desktop core ownership completion"
          git push origin HEAD:ralph/desktop-block10
