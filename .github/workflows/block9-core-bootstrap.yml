name: Block 9 Rust Import Bootstrap

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.ref == 'agent/rust-storage-block9'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-storage-block9
          fetch-depth: 0
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
      - name: Apply guarded core patch
        run: python .github/scripts/apply_block9_core.py
      - name: Repair generated core patch
        run: python .github/scripts/repair_block9_core.py
      - name: Update migration-count tests
        run: python .github/scripts/repair_block9_tests.py
      - name: Validate Rust
        id: validate
        shell: bash
        run: |
          set -o pipefail
          cd rust
          cargo fmt --all 2>&1 | tee ../block9-core-validation.log
          cargo fmt --all -- --check 2>&1 | tee -a ../block9-core-validation.log
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee -a ../block9-core-validation.log
          cargo test --workspace --all-features 2>&1 | tee -a ../block9-core-validation.log
      - name: Upload patched Rust diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block9-core-validation
          path: block9-core-validation.log
          if-no-files-found: warn
          retention-days: 1
      - name: Ensure patch hygiene
        run: git diff --check
      - name: Remove bootstrap files
        run: |
          rm .github/scripts/apply_block9_core.py
          rm .github/scripts/repair_block9_core.py
          rm .github/scripts/repair_block9_tests.py
          rm .github/workflows/block9-core-bootstrap.yml
          rm -f .github/block9-core-trigger*.txt
      - name: Commit validated core import
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add transactional Android legacy import backend'
          git push origin HEAD:agent/rust-storage-block9
