name: Finalize Desktop Block 16 PR from base

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - master

permissions:
  contents: write
  issues: write

concurrency:
  group: finalize-desktop-block16-pr-base
  cancel-in-progress: false

jobs:
  validate-and-finalize:
    if: github.event.pull_request.number == 47
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/desktop-block16-closure
          fetch-depth: 0

      - name: Record source revision
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Publish validation start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 45 --body "Desktop Block 16 PR finalization started: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} at source ${SOURCE_SHA}."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Load finalization script from master
        run: |
          git fetch origin master
          git show origin/master:scripts/finalize-desktop-block16-pr.sh > /tmp/finalize-desktop-block16-pr.sh

      - name: Validate and finalize Desktop Block 16
        run: bash /tmp/finalize-desktop-block16-pr.sh

      - name: Publish validation result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh issue comment 45 --body "Desktop Block 16 PR finalization ${JOB_STATUS}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
