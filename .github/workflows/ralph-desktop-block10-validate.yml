name: Ralph desktop Block 10 validation

on:
  push:
    branches:
      - ralph/desktop-block10
    paths:
      - ".github/workflows/ralph-desktop-block10-validate.yml"

permissions:
  contents: write

concurrency:
  group: ralph-desktop-block10-validation
  cancel-in-progress: true

jobs:
  format-generate-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ralph/desktop-block10
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install pinned Rust and Linux dependencies
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.1
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget

      - name: Apply audited repairs
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/repair-desktop-block10.py 2>&1 | tee block10-patch.log

      - name: Format and regenerate exact artifacts
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            cd desktop/src-tauri
            cargo fmt --all
            cargo generate-lockfile
            cd ..
            npm ci
            npm run bindings:generate
          } 2>&1 | tee block10-generate.log

      - name: Validate desktop Rust
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            mkdir -p desktop/dist
            printf '<!doctype html><title>Silent Disco Rust validation</title>\n' > desktop/dist/index.html
            cd desktop/src-tauri
            cargo fmt --all -- --check
            cargo clippy --all-targets --all-features -- -D warnings
            cargo test --all-features
            cargo check --all-features
          } 2>&1 | tee block10-rust.log

      - name: Validate desktop frontend
        working-directory: desktop
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            npm run bindings:check
            npm run format:check
            npm run lint
            npm run typecheck
            npm test -- --run
            npm run build
          } 2>&1 | tee ../block10-frontend.log

      - name: Validate repository invariants
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check-source-file-line-counts.sh 2>&1 | tee block10-source.log

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ralph-desktop-block10-validation
          path: |
            block10-*.log
            desktop/src-tauri/src/
            desktop/src-tauri/Cargo.lock
            desktop/src/core/generated/desktop-bindings.ts
          if-no-files-found: warn
          retention-days: 3

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ralph-desktop-block10-validate.yml
          git rm scripts/repair-desktop-block10.py
          git add desktop/src-tauri desktop/src/core/generated/desktop-bindings.ts
          git commit -m "Validate desktop core runtime ownership"
          git push origin HEAD:ralph/desktop-block10
