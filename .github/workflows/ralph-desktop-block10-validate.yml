name: Ralph desktop Block 10 validation

on:
  push:
    branches:
      - ralph/desktop-block10
    paths:
      - ".github/workflows/ralph-desktop-block10-validate.yml"

permissions:
  contents: write

jobs:
  format-generate-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ralph/desktop-block10
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget

      - name: Format and regenerate exact artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd desktop/src-tauri
          cargo fmt --all
          cargo generate-lockfile
          cd ..
          npm ci
          npm run bindings:generate

      - name: Validate desktop Rust
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop/dist
          printf '<!doctype html><title>Silent Disco Rust validation</title>\n' > desktop/dist/index.html
          cd desktop/src-tauri
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
          cargo check --all-features

      - name: Validate desktop frontend
        working-directory: desktop
        run: |
          npm run bindings:check
          npm run format:check
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Validate repository invariants
        run: bash scripts/check-source-file-line-counts.sh

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ralph-desktop-block10-validate.yml
          git add desktop/src-tauri desktop/src/core/generated/desktop-bindings.ts
          git commit -m "Validate desktop core runtime ownership"
          git push origin HEAD:ralph/desktop-block10
