name: Apply Desktop Block 23 frontend test fixes

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: desktop-block23-helper-writes
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.issue.number == 45 &&
      github.event.comment.body == '/apply-desktop-block23-frontend-test-fixes-v2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Extend the deterministic post-payload adapter
        run: |
          printf '%s' '' | base64 --decode >> .github/block23-storage-runner-adapt.py
          rm .github/workflows/desktop-block23-apply-frontend-test-fixes.yml
          git diff --check
      - name: Commit correction directly to master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/block23-storage-runner-adapt.py .github/workflows/desktop-block23-apply-frontend-test-fixes.yml
          git commit -m "Fix Block 23 frontend integration tests"
          git push origin HEAD:master
          gh issue comment 45 --repo "$GITHUB_REPOSITORY" --body "Applied deterministic Desktop Block 23 frontend integration-test fixes in commit $(git rev-parse HEAD)."
