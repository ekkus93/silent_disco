name: Validate Desktop Block 20 candidate

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/desktop-block20.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: desktop-block20-candidate
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.1"
  TRACKING_ISSUE: "45"
  PAYLOAD_SHA256: "2990dfc35d857a1e66d03c8b5be8aa265ea93dae3aa1f667c9dcd2568053a5db"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact master input
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Capture input
        run: echo "BLOCK20_INPUT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Publish start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${TRACKING_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
            --body "Desktop Block 20 focused candidate validation started in Actions run ${GITHUB_RUN_ID} against direct-master input ${BLOCK20_INPUT}. No branch or PR is involved."

      - name: Materialize checksum-verified candidate
        run: |
          set -euo pipefail
          cat .github/desktop-block20-source/part-*.b64 | base64 --decode > /tmp/block20.tar.gz
          echo "${PAYLOAD_SHA256}  /tmp/block20.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/block20.tar.gz
          grep -Fqx 'pub mod transport;' rust/silent-disco-core/src/lib.rs

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy --component rustfmt
          rustup default "${RUST_VERSION}"

      - name: Format candidate
        run: cargo fmt --manifest-path rust/Cargo.toml --all 2>&1 | tee /tmp/block20-format.log

      - name: Enforce source-size invariant
        run: bash scripts/check-source-file-line-counts.sh

      - name: Run focused strict transport gates
        id: focused
        run: |
          set -o pipefail
          cargo clippy --manifest-path rust/Cargo.toml -p silent-disco-core \
            --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/block20-clippy.log
          cargo test --manifest-path rust/Cargo.toml -p silent-disco-core \
            transport -- --nocapture 2>&1 | tee /tmp/block20-tests.log

      - name: Commit focused candidate directly to master
        run: |
          set -euo pipefail
          git rm .github/workflows/desktop-block20.yml
          git rm -r .github/desktop-block20-source
          git add rust/silent-disco-core/src/lib.rs rust/silent-disco-core/src/transport
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Implement shared transport runtime candidate (Desktop Block 20)"
          remote_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          parent_sha="$(git rev-parse HEAD^)"
          test "${remote_sha}" = "${parent_sha}"
          git push origin HEAD:master
          echo "BLOCK20_CANDIDATE=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Publish success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${TRACKING_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
            --body "Desktop Block 20 focused transport gates passed in Actions run ${GITHUB_RUN_ID}. Candidate ${BLOCK20_CANDIDATE} was committed directly to master; temporary payload and workflow files were removed."

      - name: Publish compact failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Desktop Block 20 focused candidate validation failed in Actions run ${GITHUB_RUN_ID} against ${BLOCK20_INPUT}. No source candidate was committed."
            echo
            echo '```text'
            tail -80 /tmp/block20-format.log 2>/dev/null || true
            tail -80 /tmp/block20-clippy.log 2>/dev/null || true
            tail -80 /tmp/block20-tests.log 2>/dev/null || true
            echo '```'
          } > /tmp/block20-failure.md
          gh issue comment "${TRACKING_ISSUE}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/block20-failure.md
