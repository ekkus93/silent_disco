name: Validate Desktop Block 20 full repository

on:
  push:
    branches: [master]
    paths: [.github/workflows/desktop-block20.yml]

permissions:
  contents: write
  issues: write

concurrency:
  group: desktop-block20-full-validation
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.1"
  NODE_VERSION: "22.16.0"
  TRACKING_ISSUE: "45"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Capture exact input
        run: echo "BLOCK20_INPUT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Desktop Block 20 full validation started in Actions run $GITHUB_RUN_ID against direct-master input $BLOCK20_INPUT. No branch or PR is involved."
      - name: Install pinned Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_VERSION"
      - name: Format and synchronize lockfiles
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
          cp rust/Cargo.lock /tmp/block20-rust.Cargo.lock
          cp desktop/src-tauri/Cargo.lock /tmp/block20-desktop.Cargo.lock
      - name: Focused transport tests
        working-directory: rust
        run: cargo test -p silent-disco-core transport -- --nocapture
      - name: Source-size invariant
        run: bash scripts/check-source-file-line-counts.sh
      - name: Shared Rust strict gates
        working-directory: rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android and Linux dependencies
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential curl file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf time wget
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Desktop frontend gates
        working-directory: desktop
        run: |
          mkdir -p dist
          printf '<!doctype html><title>Silent Disco Block 20 validation</title>\n' > dist/index.html
          npm ci
          npm run bindings:check
          npm run format:check
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Desktop Rust strict gates
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
          cargo check --all-features
      - name: Linux desktop bundles
        working-directory: desktop
        run: npm run tauri build
      - name: Android variants and test APK
        run: ./gradlew assembleDebug assemblePocDebug assembleRelease assembleDebugAndroidTest --stacktrace --console=plain
      - name: Verify packaged Rust ABIs
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/pocDebug/app-pocDebug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            test -f "$apk"
            for abi in armeabi-v7a arm64-v8a x86 x86_64; do
              unzip -Z1 "$apk" "lib/$abi/libsilent_disco_ffi.so" | grep -Fx "lib/$abi/libsilent_disco_ffi.so"
            done
          done
      - name: Android unit tests and lint
        run: ./gradlew test lintDebug --stacktrace --console=plain
      - name: Android instrumentation
        run: ./gradlew pixel2api29DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=software --stacktrace --console=plain
      - name: Reproducible lockfiles
        run: |
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
          cmp /tmp/block20-rust.Cargo.lock rust/Cargo.lock
          cmp /tmp/block20-desktop.Cargo.lock desktop/src-tauri/Cargo.lock
          git diff --exit-code -- desktop/package-lock.json tools/decoder-spike/Cargo.lock
      - name: Record completion evidence
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          run_id = os.environ['GITHUB_RUN_ID']
          input_sha = os.environ['BLOCK20_INPUT']
          Path('docs/DESKTOP_BLOCK20_TRANSPORT_RUNTIME.md').write_text(f'''# Desktop Block 20 — Shared Transport Runtime

**Status:** Complete

Shared Rust owns production TCP control and UDP synchronization/audio transport semantics, including bounded queues, protocol-v2 framing and limits, typed failures, peer authorization, delivery accounting, deterministic shutdown/join, and isolated injectable virtual transport/clock support.

Desktop interface enumeration and bind selection remain in Block 21.

## Validation

- Actions run: `{run_id}`
- Direct-master input: `{input_sha}`
- Focused socket/virtual-network behavior and the complete Rust, desktop, Linux, Android, ABI, lint, and managed-device matrix passed.
''')
          path = Path('docs/SILENT_DISCO_TAURI_DESKTOP_HOST_TODO.md')
          text = path.read_text(); start = text.index('## Block 20'); end = text.find('## Block 21', start)
          if end == -1: end = text.find('# Phase', start + 1)
          if end == -1: end = len(text)
          block = text[start:end].replace('- [ ]', '- [x]')
          if '**Completion evidence:**' not in block:
              block = block.rstrip() + f'\n\n**Completion evidence:** Actions run `{run_id}` passed against direct-master input `{input_sha}`. See `docs/DESKTOP_BLOCK20_TRANSPORT_RUNTIME.md`.\n\n'
          path.write_text(text[:start] + block + text[end:])
          path = Path('docs/SILENT_DISCO_RUST_CORE_MIGRATION_TODO.md')
          text = path.read_text(); start = text.find('## Block 19')
          if start == -1: start = text.find('### 19.')
          if start == -1: raise SystemExit('migration Block 19 heading not found')
          end = text.find('## Block 20', start + 1)
          if end == -1: end = len(text)
          section = text[start:end].replace('- [ ]', '- [x]')
          if 'Desktop Block 20 evidence' not in section:
              section = section.rstrip() + f'\n\n**Desktop Block 20 evidence:** Actions run `{run_id}` passed against direct-master input `{input_sha}`.\n\n'
          path.write_text(text[:start] + section + text[end:])
          path = Path('memory.md')
          path.write_text(path.read_text().rstrip() + f'''\n\n## 2026-07-30 — Desktop Block 20 shared transport runtime complete

- Shared Rust owns TCP control and UDP synchronization/audio runtime semantics.
- Protocol framing, bounds, authorization, accounting, queues, failures, shutdown/join, and virtual transport/clock behavior are covered.
- Desktop interface and bind-selection work remains in Block 21.
- Direct `master` work; no branch or PR.
- Validation run: `{run_id}`.
- Validated input: `{input_sha}`.
''')
          PY
      - name: Commit evidence and cleanup
        run: |
          set -euo pipefail
          git rm .github/workflows/desktop-block20.yml .github/workflows/desktop-block20-full.yml
          git rm --ignore-unmatch .github/desktop-block20-*.py
          git add rust/Cargo.lock desktop/src-tauri/Cargo.lock docs/DESKTOP_BLOCK20_TRANSPORT_RUNTIME.md docs/SILENT_DISCO_TAURI_DESKTOP_HOST_TODO.md docs/SILENT_DISCO_RUST_CORE_MIGRATION_TODO.md memory.md
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Complete shared transport runtime (Desktop Block 20)"
          remote_sha=$(git ls-remote origin refs/heads/master | awk '{print $1}')
          test "$remote_sha" = "$(git rev-parse HEAD^)"
          git push origin HEAD:master
          echo "BLOCK20_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish success
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Desktop Block 20 passed in Actions run $GITHUB_RUN_ID and committed $BLOCK20_COMMIT directly to master. All focused and repository-wide gates passed; temporary validators were removed."
      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Desktop Block 20 full validation failed in Actions run $GITHUB_RUN_ID against $BLOCK20_INPUT. No completion evidence was written; continue directly on master from the first failed gate."
