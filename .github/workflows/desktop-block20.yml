name: Validate Desktop Block 20 candidate

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/desktop-block20.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: desktop-block20-candidate
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.1"
  TRACKING_ISSUE: "45"
  PAYLOAD_SHA256: "8df02204f749d9f1c290583a1196f00776e67a1cf4a871f345d368140af43070"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact master input
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Capture input
        run: echo "BLOCK20_INPUT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Publish start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${TRACKING_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
            --body "Desktop Block 20 focused candidate validation started in Actions run ${GITHUB_RUN_ID} against direct-master input ${BLOCK20_INPUT}. No branch or PR is involved."

      - name: Materialize checksum-verified candidate
        run: |
          set -euo pipefail
          cat .github/desktop-block20-source/part-*.b64 | base64 --decode > /tmp/block20.tar.gz
          echo "${PAYLOAD_SHA256}  /tmp/block20.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/block20.tar.gz
          mv rust/silent-disco-core/src/transport/virtual.rs \
            rust/silent-disco-core/src/transport/virtual_transport.rs
          sed -i \
            -e 's/^mod virtual;$/mod virtual_transport;/' \
            -e 's/^pub use virtual::{/pub use virtual_transport::{/' \
            rust/silent-disco-core/src/transport/mod.rs
          python3 - <<'PY'
          import re
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text()
              if source.count(old) != 1:
                  raise SystemExit(f"Block 20 repair anchor changed unexpectedly: {path}: {old[:40]!r}")
              target.write_text(source.replace(old, new))

          def regex_replace_once(path: str, pattern: str, replacement: str) -> None:
              target = Path(path)
              source = target.read_text()
              repaired, count = re.subn(pattern, replacement, source, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"Block 20 regex repair count was {count}: {path}")
              target.write_text(repaired)

          replace_once(
              "rust/silent-disco-core/src/transport/socket/shared.rs",
              """                            drop(on_outcome(ReadControlOutcome::Rejected(\n                                TransportError::protocol(TransportChannel::Control, &error),\n                            ));\n""",
              """                            drop(on_outcome(ReadControlOutcome::Rejected(\n                                TransportError::protocol(TransportChannel::Control, &error),\n                            )));\n""",
          )
          replace_once(
              "rust/silent-disco-core/src/transport/socket/shared.rs",
              """                drop(on_outcome(ReadControlOutcome::Rejected(TransportError::io(\n                    TransportErrorKind::Io,\n                    TransportChannel::Control,\n                    \"failed to read control connection\",\n                    &error,\n                )));\n""",
              """                drop(on_outcome(ReadControlOutcome::Rejected(TransportError::io(\n                    TransportErrorKind::Io,\n                    TransportChannel::Control,\n                    \"failed to read control connection\",\n                    &error,\n                ))));\n""",
          )
          replace_once(
              "rust/silent-disco-core/src/transport/socket/host.rs",
              "use super::host_workers::{spawn_accept_loop, spawn_udp_receiver, worker_registry_error};",
              """use super::host_workers::{
              shutting_down_error, spawn_accept_loop, spawn_udp_receiver, worker_registry_error,
          };""",
          )
          datagram_pattern = (
              r"\(\s*TransportChannel::Synchronization,\s*ProtocolFrame::SyncRequest\(_\)\s*\)"
              r"\s*\|\s*"
              r"\(\s*TransportChannel::Synchronization,\s*ProtocolFrame::SyncResponse\(_\)\s*\)"
              r"\s*\|\s*"
              r"\(\s*TransportChannel::Audio,\s*ProtocolFrame::Audio\(_\)\s*\)\s*=>\s*\{\}"
          )
          datagram_replacement = """(
                  TransportChannel::Synchronization,
                  ProtocolFrame::SyncRequest(_) | ProtocolFrame::SyncResponse(_),
              )
              | (TransportChannel::Audio, ProtocolFrame::Audio(_)) => {}"""
          regex_replace_once(
              "rust/silent-disco-core/src/transport/socket/host.rs",
              datagram_pattern,
              datagram_replacement,
          )
          regex_replace_once(
              "rust/silent-disco-core/src/transport/virtual_transport.rs",
              datagram_pattern,
              datagram_replacement,
          )
          replace_once(
              "rust/silent-disco-core/src/transport/socket/host_workers.rs",
              "fn shutting_down_error() -> TransportError {",
              "pub(super) fn shutting_down_error() -> TransportError {",
          )
          workers = Path("rust/silent-disco-core/src/transport/socket/host_workers.rs")
          workers_source = workers.read_text()
          if workers_source.count("peer_for_reader") != 12:
              raise SystemExit("Block 20 reader-peer rename anchor changed unexpectedly")
          workers.write_text(workers_source.replace("peer_for_reader", "reader_peer"))
          replace_once(
              "rust/silent-disco-core/src/transport/socket/listener.rs",
              "use std::net::{Shutdown, SocketAddr, TcpStream, UdpSocket};",
              "use std::net::{SocketAddr, TcpStream, UdpSocket};",
          )
          replace_once(
              "rust/silent-disco-core/src/transport/socket/shared.rs",
              "use std::net::{Shutdown, SocketAddr, TcpStream};",
              "use std::net::{Shutdown, TcpStream};",
          )
          replace_once(
              "rust/silent-disco-core/src/transport/types.rs",
              "#[derive(Debug, Clone, PartialEq, Eq)]\npub enum TransportEvent {",
              "#[derive(Clone, PartialEq, Eq)]\npub enum TransportEvent {",
          )
          PY
          grep -Fqx 'pub mod transport;' rust/silent-disco-core/src/lib.rs
          grep -Fqx 'mod virtual_transport;' rust/silent-disco-core/src/transport/mod.rs

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy --component rustfmt
          rustup default "${RUST_VERSION}"

      - name: Format candidate
        run: |
          set -o pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all 2>&1 | tee /tmp/block20-format.log

      - name: Enforce source-size invariant
        run: bash scripts/check-source-file-line-counts.sh

      - name: Run focused strict transport gates
        run: |
          set -o pipefail
          cargo clippy --manifest-path rust/Cargo.toml -p silent-disco-core \
            --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/block20-clippy.log
          cargo test --manifest-path rust/Cargo.toml -p silent-disco-core \
            transport -- --nocapture 2>&1 | tee /tmp/block20-tests.log

      - name: Commit focused candidate directly to master
        run: |
          set -euo pipefail
          git rm .github/workflows/desktop-block20.yml
          git rm -r .github/desktop-block20-source
          git add rust/silent-disco-core/src/lib.rs rust/silent-disco-core/src/transport
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Implement shared transport runtime candidate (Desktop Block 20)"
          remote_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          parent_sha="$(git rev-parse HEAD^)"
          test "${remote_sha}" = "${parent_sha}"
          git push origin HEAD:master
          echo "BLOCK20_CANDIDATE=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Publish success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${TRACKING_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
            --body "Desktop Block 20 focused transport gates passed in Actions run ${GITHUB_RUN_ID}. Candidate ${BLOCK20_CANDIDATE} was committed directly to master; temporary payload and workflow files were removed."

      - name: Publish compact failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Desktop Block 20 focused candidate validation failed in Actions run ${GITHUB_RUN_ID} against ${BLOCK20_INPUT}. No source candidate was committed."
            echo
            echo '```text'
            tail -80 /tmp/block20-format.log 2>/dev/null || true
            tail -80 /tmp/block20-clippy.log 2>/dev/null || true
            tail -80 /tmp/block20-tests.log 2>/dev/null || true
            echo '```'
          } > /tmp/block20-failure.md
          gh issue comment "${TRACKING_ISSUE}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/block20-failure.md
