name: Supply chain

# Dependency vulnerability audit (Rust, npm, Android Gradle), git-history secret
# scan and CycloneDX SBOMs; see scripts/check-supply-chain.sh for the triage
# policy. Runs weekly as well, because new advisories arrive without commits.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.16.0"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
  CARGO_CYCLONEDX_VERSION: "0.5.9"
  CARGO_CYCLONEDX_SHA256: "9bd3e599314f50810c9d98b8b68a617ff9d3cc20873968d90b29d121f6b226ff"
  OSV_SCANNER_VERSION: "2.7.0"
  OSV_SCANNER_SHA256: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  audit:
    name: Dependency audit, secret scan and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository (full history for the secret scan)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned, checksum-verified scanners
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/supply-chain-bin"
          work="$RUNNER_TEMP/supply-chain-dl"
          mkdir -p "$bin" "$work"
          cd "$work"
          fetch() { curl -fsSL --retry 3 -o "$2" "$1"; echo "$3  $2" | sha256sum -c -; }
          fetch "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" deny.tgz "$CARGO_DENY_SHA256"
          tar xzf deny.tgz
          mv "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" "$bin/"
          fetch "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-${CARGO_CYCLONEDX_VERSION}/cargo-cyclonedx-x86_64-unknown-linux-musl.tar.xz" cdx.txz "$CARGO_CYCLONEDX_SHA256"
          tar xJf cdx.txz
          mv cargo-cyclonedx-x86_64-unknown-linux-musl/cargo-cyclonedx "$bin/"
          fetch "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" osv-scanner "$OSV_SCANNER_SHA256"
          install -m 0755 osv-scanner "$bin/osv-scanner"
          fetch "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks.tgz "$GITLEAKS_SHA256"
          tar xzf gitleaks.tgz gitleaks
          mv gitleaks "$bin/"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Test the npm audit triage policy
        working-directory: scripts
        run: python3 test_npm_audit_triage.py

      - name: Run the supply-chain gate
        run: bash scripts/check-supply-chain.sh "$RUNNER_TEMP/supply-chain"

      - name: Upload SBOMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: ${{ runner.temp }}/supply-chain/sbom
          if-no-files-found: error
          retention-days: 90
