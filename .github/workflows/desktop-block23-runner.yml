name: Desktop Block 23 clippy wiring

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  wire:
    if: >-
      github.event.issue.number == 45 &&
      github.event.comment.body == '/wire-desktop-block23-tauri-clippy-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Restore workflows and wire adapter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/wire-block23-tauri-clippy.py
          git diff --check
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Wire Block 23 Tauri clippy adapter"
          remote_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test "$remote_sha" = "$(git rev-parse HEAD^)"
          git push origin HEAD:master
          gh issue comment 45 --repo "$GITHUB_REPOSITORY" \
            --body "Wired the deterministic Block 23 Tauri clippy adapter and restored all temporary workflows in commit $(git rev-parse HEAD)."
