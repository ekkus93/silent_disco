name: Desktop Block 23 publisher cache cleanup patch

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: desktop-block23-clean-runner
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.event.issue.number == 45 &&
      github.event.comment.body == '/patch-desktop-block23-publisher-cache-cleanup-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Patch publisher cleanup and restore runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          validation = Path('.github/block23-validation.sh')
          text = validation.read_text(encoding='utf-8')
          old = '''python3 .github/block23-complete.py

git rm --ignore-unmatch \\
'''
          new = '''python3 .github/block23-complete.py

# TypeScript project builds leave disposable incremental compiler caches. They
# are not release artifacts and must not enter the Block 23 completion commit.
rm -f \\
  desktop/tsconfig.app.tsbuildinfo \\
  desktop/tsconfig.node.tsbuildinfo

git rm --ignore-unmatch \\
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'publisher cleanup anchor: expected one target, found {count}')
          validation.write_text(text.replace(old, new, 1), encoding='utf-8')

          runner = Path('.github/workflows/desktop-block23-runner.yml')
          original = subprocess.check_output(
              ['git', 'show', 'HEAD^:.github/workflows/desktop-block23-runner.yml'],
              text=True,
          )
          runner.write_text(original, encoding='utf-8')
          PY
          git diff --check
          git add .github/block23-validation.sh .github/workflows/desktop-block23-runner.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Clean TypeScript caches before Block 23 publish"
          remote_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test "$remote_sha" = "$(git rev-parse HEAD^)"
          git push origin HEAD:master
          gh issue comment 45 --repo "$GITHUB_REPOSITORY" \
            --body "Patched the Block 23 publisher to remove disposable TypeScript build caches in commit $(git rev-parse HEAD), and restored the clean-runner workflow."
