name: Desktop Block 23 clean runner

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: desktop-block23-clean-runner
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.1"
  NODE_VERSION: "22.16.0"
  TRACKING_ISSUE: "45"

jobs:
  inspect-approval:
    if: >-
      github.event.issue.number == 45 &&
      github.event.comment.body == '/extract-desktop-block23-approval'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply exact generated payload
        run: |
          mkdir -p desktop/dist
          printf '%s\n' '<!doctype html><html><body></body></html>' > desktop/dist/index.html
          cat .github/apply-block23.py.part-* | base64 --decode | gzip --decompress > .github/apply-block23.py
          python3 .github/block23-adapt.py
          python3 .github/block23-client-adapt.py
          python3 .github/apply-block23.py
          python3 .github/block23-storage-runner-adapt.py
          mkdir -p /tmp/block23-approval
          cp desktop/src-tauri/src/platform/host_transport.rs /tmp/block23-approval/
          cp desktop/src-tauri/src/platform/host_transport_admission_tests.rs /tmp/block23-approval/
      - uses: actions/upload-artifact@v4
        with:
          name: block23-approval-generated
          path: /tmp/block23-approval
      - name: Announce extraction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Desktop Block 23 approval extraction completed in Actions run $GITHUB_RUN_ID against $(git rev-parse HEAD)."

  validate:
    if: >-
      github.event.issue.number == 45 &&
      github.event.comment.body == '/run-desktop-block23-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Capture exact input and announce
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "BLOCK23_INPUT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Desktop Block 23 clean runner started in Actions run $GITHUB_RUN_ID against direct-master input $(git rev-parse HEAD). No branch or PR is involved."

      - name: Prepare current-layout implementation payload
        run: |
          cat .github/apply-block23.py.part-* | base64 --decode | gzip --decompress > .github/apply-block23.py
          python3 .github/block23-adapt.py
          python3 .github/block23-client-adapt.py

      - name: Seed frontend distribution for binding compilation
        run: |
          mkdir -p desktop/dist
          printf '%s\n' '<!doctype html><html><body></body></html>' > desktop/dist/index.html

      - name: Apply, validate, document, and publish Block 23
        run: bash .github/block23-validation.sh

      - name: Publish success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Desktop Block 23 passed in Actions run $GITHUB_RUN_ID and committed $BLOCK23_COMMIT directly to master. Delivery-first approval/rejection/removal, trusted-device persistence, listener detail UI, full Rust/desktop/Linux/Android/ABI/instrumentation gates, evidence, and cleanup all passed."

      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Desktop Block 23 clean runner failed in Actions run $GITHUB_RUN_ID against $BLOCK23_INPUT. No implementation or completion evidence was committed; continue directly on master from the first failed command."
