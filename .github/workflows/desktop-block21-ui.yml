name: Validate Desktop Block 21 UI

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: desktop-block21-ui
  cancel-in-progress: false

env:
  NODE_VERSION: "22.16.0"
  TRACKING_ISSUE: "45"

jobs:
  validate:
    if: >-
      github.event.issue.number == 45 &&
      github.event.comment.body == '/run-desktop-block21-ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Capture exact input and announce
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "BLOCK21_UI_INPUT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Desktop Block 21 UI validation started in Actions run $GITHUB_RUN_ID against direct-master input $(git rev-parse HEAD). No branch or PR is involved."

      - name: Apply Host Setup integration
        run: python3 .github/apply-block21-ui.py

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf time wget

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install and format focused UI
        working-directory: desktop
        run: |
          npm ci
          npx biome format --write \
            src/screens/HostNetworkPolicyCard.tsx \
            src/screens/HostNetworkPolicyCard.test.tsx \
            src/screens/HostSetupScreen.tsx \
            src/screens/HostSetupScreen.test.tsx

      - name: Run frontend and binding gates
        working-directory: desktop
        run: |
          npm run bindings:check
          npm run format:check
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Enforce source-size invariant
        run: bash scripts/check-source-file-line-counts.sh

      - name: Commit validated UI directly to master
        run: |
          set -euo pipefail
          git rm .github/workflows/desktop-block21-ui.yml .github/apply-block21-ui.py
          git add \
            desktop/src/screens/HostNetworkPolicyCard.tsx \
            desktop/src/screens/HostNetworkPolicyCard.test.tsx \
            desktop/src/screens/HostSetupScreen.tsx \
            desktop/src/screens/HostSetupScreen.test.tsx
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Add explicit desktop network selection UI (Desktop Block 21)"
          remote_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test "$remote_sha" = "$(git rev-parse HEAD^)"
          git push origin HEAD:master
          echo "BLOCK21_UI_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Desktop Block 21 explicit-selection UI passed in Actions run $GITHUB_RUN_ID and committed $BLOCK21_UI_COMMIT directly to master. Bindings, format, lint, typecheck, frontend tests/build, accessibility-focused tests, and source-size checks passed."

      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Desktop Block 21 UI validation failed in Actions run $GITHUB_RUN_ID against $BLOCK21_UI_INPUT. Continue directly on master from the first failed gate."
