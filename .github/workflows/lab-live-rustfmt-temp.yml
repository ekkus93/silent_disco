name: Lab live transport rustfmt temporary

on:
  push:
    branches:
      - agent/lab-live-transport

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.event.head_commit.message != 'Apply rustfmt to Lab live transport'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lab-live-transport
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Format desktop Rust
        working-directory: desktop/src-tauri
        run: cargo fmt --all
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- desktop/src-tauri/src; then
            echo 'No formatter changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/src-tauri/src
          git commit -m 'Apply rustfmt to Lab live transport'
          git push origin HEAD:agent/lab-live-transport
