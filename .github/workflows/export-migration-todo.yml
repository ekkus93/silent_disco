name: Export migration TODO

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  export:
    name: Export migration TODO source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload migration TODO source
        uses: actions/upload-artifact@v4
        with:
          name: migration-todo-source
          path: docs/SILENT_DISCO_RUST_CORE_MIGRATION_TODO.md
          if-no-files-found: error
          retention-days: 1
