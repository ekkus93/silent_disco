name: Resolve Block 9 overlap

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  resolve:
    if: github.event.pull_request.head.ref == 'agent/rust-android-storage-block9'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Block 9 branch
        uses: actions/checkout@v4
        with:
          ref: agent/rust-android-storage-block9
          fetch-depth: 0

      - name: Merge current master while retaining its authoritative implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git merge --no-commit --no-ff origin/master || true
          git rev-parse -q --verify MERGE_HEAD
          git read-tree --reset -u origin/master
          git diff --cached --check
          git commit -m "Merge current master and retain its Block 9 implementation"
          git push origin HEAD:agent/rust-android-storage-block9
