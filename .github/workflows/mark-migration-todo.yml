name: Fix compatibility fixture test labels

on:
  pull_request:
    branches:
      - master
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.repository == 'ekkus93/silent_disco' &&
      github.event.pull_request.head.ref == 'agent/rust-migration-ci-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Remove unsupported Truth labels without changing assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/test/java/com/ekkus/silentdisco/core/transport/RustMigrationCompatibilityFixtureTest.kt')
          text = path.read_text()
          before = text.count('.named(')
          if before == 0:
              print('Truth labels already removed')
          else:
              lines = [line for line in text.splitlines() if not line.strip().startswith('.named(')]
              text = '\n'.join(lines) + '\n'
              inline = [
                  '.named(name)',
                  '.named("$name round trip")',
                  '.named("sync probe $current")',
                  '.named(entry.string("name"))',
                  '.named("packet[$index].version")',
              ]
              for value in inline:
                  text = text.replace(value, '')
              if '.named(' in text:
                  raise SystemExit('unhandled Truth .named call remains')
              path.write_text(text)
              print(f'removed {before} unsupported Truth labels')
          PY

          git diff --check

      - name: Commit compatibility test correction
        run: |
          if git diff --quiet; then
            echo "Compatibility test labels already corrected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/java/com/ekkus/silentdisco/core/transport/RustMigrationCompatibilityFixtureTest.kt
          git commit -m "Fix Truth compatibility in migration fixture tests"
          git push origin HEAD:master
