name: Apply compatibility baseline plumbing

on:
  pull_request:
    branches:
      - master
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.repository == 'ekkus93/silent_disco' &&
      github.event.pull_request.head.ref == 'agent/rust-migration-ci-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Wire MainViewModel to the legacy preference contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/ekkus/silentdisco/app/MainViewModel.kt')
          text = path.read_text()

          import_anchor = 'import com.ekkus.silentdisco.core.permissions.PermissionState\n'
          import_line = 'import com.ekkus.silentdisco.core.persistence.LegacyPreferencesContract\n'
          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('permission import anchor changed')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          replacements = {
              '"tuning:syncSampleWindow"': 'LegacyPreferencesContract.SYNC_SAMPLE_WINDOW',
              '"tuning:syncCadenceMs"': 'LegacyPreferencesContract.SYNC_CADENCE_MS',
              '"tuning:startupBufferMs"': 'LegacyPreferencesContract.STARTUP_BUFFER_MS',
              '"tuning:latePacketThresholdMs"': 'LegacyPreferencesContract.LATE_PACKET_THRESHOLD_MS',
              '"tuning:hardResyncThresholdMs"': 'LegacyPreferencesContract.HARD_RESYNC_THRESHOLD_MS',
              '"tuning:syncDriftThresholdBits"': 'LegacyPreferencesContract.SYNC_DRIFT_THRESHOLD_BITS',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count not in (0, 2):
                  raise SystemExit(f'unexpected occurrence count for {old}: {count}')
              text = text.replace(old, new)

          old = 'preferences.edit { putBoolean("trusted:$listenerId", true) }'
          new = 'preferences.edit { putBoolean(LegacyPreferencesContract.trustedDeviceKey(listenerId), true) }'
          count = text.count(old)
          if count not in (0, 1):
              raise SystemExit(f'unexpected trusted-device key occurrence count: {count}')
          text = text.replace(old, new)

          path.write_text(text)
          PY

          git diff --check

      - name: Commit preference contract wiring
        run: |
          if git diff --quiet; then
            echo "Preference contract already wired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ekkus/silentdisco/app/MainViewModel.kt
          git commit -m "Use legacy preference contract in Android state owner"
          git push origin HEAD:master
