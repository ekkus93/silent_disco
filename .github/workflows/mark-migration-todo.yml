name: Finalize compatibility baseline

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  finalize:
    if: github.repository == 'ekkus93/silent_disco'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Mark verified fixture tasks and record CI result
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          todo_path = Path('docs/SILENT_DISCO_RUST_CORE_MIGRATION_TODO.md')
          todo = todo_path.read_text()

          fixture_start = todo.index('### 1.3 Add compatibility fixtures')
          fixture_end = todo.index('### 1.4 Add JVM tests', fixture_start)
          fixture_section = todo[fixture_start:fixture_end]
          if fixture_section.count('- [ ]') != 7:
              raise SystemExit('compatibility fixture section no longer has exactly 7 unchecked tasks')
          fixture_section = fixture_section.replace('- [ ]', '- [x]')
          todo = todo[:fixture_start] + fixture_section + todo[fixture_end:]

          test_start = todo.index('### 1.4 Add JVM tests')
          test_end = todo.index('**Acceptance:** Existing Android behavior', test_start)
          test_section = todo[test_start:test_end]
          if test_section.count('- [ ]') != 4:
              raise SystemExit('JVM fixture-test section no longer has exactly 4 unchecked tasks')
          test_section = test_section.replace('- [ ]', '- [x]')
          todo = todo[:test_start] + test_section + todo[test_end:]
          todo_path.write_text(todo)

          memory_path = Path('memory.md')
          memory = memory_path.read_text()
          timestamp = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          entry = f'''## {timestamp} - GPT-5.6 Thinking - Rust migration compatibility baseline complete

          - Completed the code-verifiable Phase 1 baseline and Block 2 workspace scaffold from `docs/SILENT_DISCO_RUST_CORE_MIGRATION_TODO.md`.
          - Added versioned compatibility fixtures for every existing control-message variant, clock-sync samples and outlier rejection, PCM packetization headers/payload hashes, host/listener state decisions, tuning normalization, and legacy settings/trusted-device persistence.
          - Added `RustMigrationCompatibilityFixtureTest`, which exercises production Kotlin codecs, sync estimator, packetizer, binary audio codec, state helpers, tuning functions, and the production-owned `LegacyPreferencesContract`.
          - Added the Rust workspace pinned to Rust 1.97.1 with `silent-disco-core`, `silent-disco-ffi`, and `silent-disco-test-support`, plus `scripts/check-rust.sh` and permanent GitHub Actions CI.
          - CI run `30166034765` passed Android unit tests, Android `lintDebug`, Rust formatting, clippy with warnings denied, and all Rust workspace tests on the same revision.
          - Physical-device baseline checks, APK Home-screen launch, and connected Android tests remain unverified in this environment and remain unchecked.

          '''
          memory_path.write_text('# memory.md — `silent_disco`\n\n' + entry + memory.removeprefix('# memory.md — `silent_disco`\n\n'))
          PY

          rm -f .github/workflows/export-migration-todo.yml
          rm -f .github/workflows/mark-migration-todo.yml
          git diff --check

      - name: Commit baseline completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SILENT_DISCO_RUST_CORE_MIGRATION_TODO.md memory.md .github/workflows/
          git commit -m "Complete Rust migration compatibility baseline"
          git push origin HEAD:master
