name: Block 8 storage bootstrap

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.ref == 'agent/rust-storage-block8'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Block 8 branch
        uses: actions/checkout@v4
        with:
          ref: agent/rust-storage-block8
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Apply guarded Block 8 sources
        shell: bash
        run: |
          set -o pipefail
          {
            python .github/scripts/fix_block8_migrations.py
            python .github/scripts/apply_block8_storage.py
            python .github/scripts/fix_block8_clippy.py
          } 2>&1 | tee block8-apply.log

      - name: Format and validate Rust storage layer
        shell: bash
        run: |
          set -o pipefail
          cd rust
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee ../block8-rust-validation.log
          cargo test --workspace --all-features 2>&1 | tee -a ../block8-rust-validation.log

      - name: Upload bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block8-bootstrap-diagnostics
          path: |
            block8-apply.log
            block8-rust-validation.log
            rust/silent-disco-core/src/storage/database.rs
            rust/silent-disco-core/src/storage/worker.rs
            rust/silent-disco-core/src/storage/models.rs
            rust/silent-disco-core/src/storage/settings_repository.rs
          if-no-files-found: warn
          retention-days: 1

      - name: Verify patch hygiene
        run: git diff --check

      - name: Commit validated Block 8 sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Rust storage schema and repositories"
          git push origin HEAD:agent/rust-storage-block8
