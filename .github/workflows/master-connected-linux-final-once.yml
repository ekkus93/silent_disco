name: One-time final Linux connected tests

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: one-time-final-linux-connected-tests
  cancel-in-progress: false

jobs:
  connected:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable and inspect KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          {
            uname -a
            id
            ls -l /dev/kvm
          } | tee linux-connected-host.txt

      - name: Install Android SDK, NDK, emulator, and API 35 image
        shell: bash
        run: |
          set +o pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "system-images;android-35;google_apis;x86_64"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Run every connected Android instrumentation test
        id: connected
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p linux-connected
          "${ANDROID_HOME}/emulator/emulator" -version \
            > linux-connected/emulator-version.log 2>&1
          set +e
          "${ANDROID_HOME}/emulator/emulator" -accel-check \
            > linux-connected/accel-check.log 2>&1
          accel_status=$?
          set -e
          printf 'accel_status=%s\n' "${accel_status}" \
            > linux-connected/accel-status.txt
          if [ "${accel_status}" -ne 0 ]; then
            cat linux-connected/accel-check.log
            exit 123
          fi

          "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name silent-disco-api35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_6 \
            > linux-connected/avd-create.log 2>&1 <<< "no"

          "${ANDROID_HOME}/emulator/emulator" \
            -avd silent-disco-api35 \
            -accel on \
            -cores 2 \
            -memory 3072 \
            -no-window \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -wipe-data \
            -noaudio \
            -no-boot-anim \
            -no-metrics \
            -camera-back none \
            -verbose \
            > linux-connected/emulator.log 2>&1 &
          emulator_pid=$!
          cleanup() {
            adb emu kill >/dev/null 2>&1 || true
            kill "${emulator_pid}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          adb start-server
          adb_deadline=$((SECONDS + 300))
          adb_ready=0
          while [ "${SECONDS}" -lt "${adb_deadline}" ]; do
            if ! kill -0 "${emulator_pid}" 2>/dev/null; then
              tail -n 500 linux-connected/emulator.log
              exit 121
            fi
            if adb devices | grep -q '^emulator-'; then
              adb_ready=1
              break
            fi
            sleep 3
          done
          if [ "${adb_ready}" -ne 1 ]; then
            tail -n 500 linux-connected/emulator.log || true
            exit 124
          fi

          boot_deadline=$((SECONDS + 720))
          booted=0
          while [ "${SECONDS}" -lt "${boot_deadline}" ]; do
            if ! kill -0 "${emulator_pid}" 2>/dev/null; then
              tail -n 500 linux-connected/emulator.log
              exit 121
            fi
            completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "${completed}" = "1" ]; then
              booted=1
              break
            fi
            sleep 5
          done
          if [ "${booted}" -ne 1 ]; then
            adb devices -l || true
            tail -n 500 linux-connected/emulator.log || true
            exit 122
          fi

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb devices -l | tee linux-connected/adb-devices.txt

          set +e
          ./gradlew connectedDebugAndroidTest --stacktrace --console=plain \
            2>&1 | tee linux-connected/connected-tests.log
          status=${PIPESTATUS[0]}
          set -e

          find app/build/outputs/androidTest-results -type f -name '*.xml' -print \
            > linux-connected/xml-files.txt 2>/dev/null || true
          if [ -d app/build/outputs/androidTest-results ]; then
            tar -czf linux-connected/android-test-results.tar.gz \
              app/build/outputs/androidTest-results
          fi
          exit "${status}"

      - name: Record result and remove one-time workflow
        if: always()
        shell: bash
        env:
          CONNECTED: ${{ steps.connected.outcome }}
        run: |
          set -euo pipefail
          git fetch origin master
          remote_head="$(git rev-parse origin/master)"
          failed=0
          if [ "${CONNECTED}" != "success" ] || [ "${remote_head}" != "${GITHUB_SHA}" ]; then
            failed=1
          fi

          rm -f .github/workflows/master-connected-linux-final-once.yml
          rm -rf .validation

          if [ "${failed}" -ne 0 ]; then
            mkdir -p .validation/master-connected-linux-final
            {
              printf 'run_id=%s\n' "${GITHUB_RUN_ID}"
              printf 'tested_sha=%s\n' "${GITHUB_SHA}"
              printf 'connected=%s\n' "${CONNECTED}"
              printf 'remote_head=%s\n' "${remote_head}"
            } > .validation/master-connected-linux-final/result.txt
            cp linux-connected-host.txt .validation/master-connected-linux-final/ 2>/dev/null || true
            for file in emulator-version.log accel-check.log accel-status.txt avd-create.log emulator.log connected-tests.log adb-devices.txt xml-files.txt; do
              if [ -f "linux-connected/${file}" ]; then
                tail -n 5000 "linux-connected/${file}" \
                  > ".validation/master-connected-linux-final/${file}"
              fi
            done
            cp linux-connected/*.tar.gz .validation/master-connected-linux-final/ 2>/dev/null || true
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f .validation/master-connected-linux-final 2>/dev/null || true
          if [ "${failed}" -eq 0 ]; then
            git commit -m "Complete all lint and automated tests on master"
          else
            git commit -m "Record final Linux connected test diagnostics"
          fi
          git push origin HEAD:master
          exit "${failed}"
