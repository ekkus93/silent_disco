name: Block 9 Android Persistence Bootstrap

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: github.event.pull_request.head.ref == 'agent/rust-storage-block9'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-storage-block9
          fetch-depth: 0
      - name: Apply guarded MainViewModel migration
        run: python .github/scripts/apply_block9_main_view_model.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
      - name: Run Rust gates
        shell: bash
        run: |
          set -o pipefail
          cd rust
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
      - name: Build Android app and instrumentation APKs
        id: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            assembleDebug \
            assemblePocDebug \
            assembleRelease \
            assembleDebugAndroidTest \
            test \
            lintDebug \
            --stacktrace \
            --console=plain \
            2>&1 | tee block9-android-validation.log
      - name: Verify Rust library packaging
        run: |
          set -euo pipefail
          apks=(
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/pocDebug/app-pocDebug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          )
          abis=(armeabi-v7a arm64-v8a x86 x86_64)
          for apk in "${apks[@]}"; do
            test -f "$apk"
            for abi in "${abis[@]}"; do
              unzip -Z1 "$apk" "lib/$abi/libsilent_disco_ffi.so" | grep -Fx "lib/$abi/libsilent_disco_ffi.so"
            done
          done
      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block9-android-validation
          path: |
            block9-android-validation.log
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 1
      - name: Ensure patch hygiene
        run: git diff --check
      - name: Remove bootstrap files
        run: |
          rm .github/scripts/apply_block9_main_view_model.py
          rm .github/workflows/block9-android-bootstrap.yml
      - name: Commit validated Android persistence migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate Rust database with Android persistence'
          git push origin HEAD:agent/rust-storage-block9
