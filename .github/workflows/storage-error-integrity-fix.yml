name: Storage error integrity fix

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feature/rust-sqlite-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/rust-sqlite-worker
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Apply guarded error integrity fix
        run: python .github/scripts/apply_storage_error_integrity_fix.py

      - name: Format and validate Rust
        id: strict
        shell: bash
        run: |
          set -o pipefail
          cd rust
          {
            cargo fmt --all
            cargo fmt --all -- --check
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            cargo test --workspace --all-features
          } 2>&1 | tee ../storage-error-integrity-validation.log

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-error-integrity-validation-diagnostics
          path: storage-error-integrity-validation.log
          if-no-files-found: error
          retention-days: 1

      - name: Verify patch hygiene
        run: git diff --check

      - name: Commit validated error integrity fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve storage error subsystem integrity"
          git push origin HEAD:feature/rust-sqlite-worker
