name: SQLite worker bootstrap repair

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feature/rust-sqlite-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/rust-sqlite-worker
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Repair and apply guarded bootstrap
        id: repair
        shell: bash
        run: |
          set -o pipefail
          python .github/scripts/repair_sqlite_worker_bootstrap.py \
            2>&1 | tee sqlite-worker-bootstrap-repair.log

      - name: Upload repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-worker-bootstrap-repair-diagnostics
          path: sqlite-worker-bootstrap-repair.log
          if-no-files-found: error
          retention-days: 1

      - name: Generate lockfile and format
        run: |
          cd rust
          cargo generate-lockfile
          cargo fmt --all

      - name: Run strict Rust validation
        run: |
          cd rust
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features

      - name: Verify patch hygiene
        run: git diff --check

      - name: Commit validated SQLite worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Rust SQLite worker"
          git push origin HEAD:feature/rust-sqlite-worker
