name: Fix Rust synchronization core

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'ekkus93/silent_disco'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Install pinned Rust formatter
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1

      - name: Apply guarded synchronization fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          types_path = Path('rust/silent-disco-core/src/sync/types.rs')
          types = types_path.read_text()
          old = '''        Ok(Self {
            correlation_id: exchange.correlation_id,
            local_receive_time: exchange.t4_local_receive,
            round_trip_time_ms: network_round_trip as f64,
            offset_ms: offset_twice as f64 / 2.0,
        })
    }
}
'''
          new = '''        Ok(Self {
            correlation_id: exchange.correlation_id,
            local_receive_time: exchange.t4_local_receive,
            round_trip_time_ms: u64_to_f64(network_round_trip),
            offset_ms: i128_to_f64(offset_twice) / 2.0,
        })
    }
}

// Monotonic millisecond values lose sub-millisecond integer precision only above
// the exact f64 integer range. The estimator immediately filters practical RTTs
// to a small configured bound, while offset arithmetic retains its sign and
// half-millisecond resolution for all mobile-runtime timestamp ranges.
#[allow(clippy::cast_precision_loss)]
fn u64_to_f64(value: u64) -> f64 {
    value as f64
}

#[allow(clippy::cast_precision_loss)]
fn i128_to_f64(value: i128) -> f64 {
    value as f64
}
'''
          if types.count(old) != 1:
              raise SystemExit('sync sample conversion block changed unexpectedly')
          types_path.write_text(types.replace(old, new))

          estimator_path = Path('rust/silent-disco-core/src/sync/estimator.rs')
          estimator = estimator_path.read_text()
          old_tests = '''        assert_eq!(
            ClockSyncEstimator::new(SyncEstimatorConfig {
                max_samples: 0,
                ..SyncEstimatorConfig::default()
            }),
            Err(SyncEstimatorError::InvalidConfiguration)
        );
        assert_eq!(
            ClockSyncEstimator::new(SyncEstimatorConfig {
                max_accepted_rtt_ms: f64::NAN,
                ..SyncEstimatorConfig::default()
            }),
            Err(SyncEstimatorError::InvalidConfiguration)
        );
'''
          new_tests = '''        assert!(matches!(
            ClockSyncEstimator::new(SyncEstimatorConfig {
                max_samples: 0,
                ..SyncEstimatorConfig::default()
            }),
            Err(SyncEstimatorError::InvalidConfiguration)
        ));
        assert!(matches!(
            ClockSyncEstimator::new(SyncEstimatorConfig {
                max_accepted_rtt_ms: f64::NAN,
                ..SyncEstimatorConfig::default()
            }),
            Err(SyncEstimatorError::InvalidConfiguration)
        ));
'''
          if estimator.count(old_tests) != 1:
              raise SystemExit('invalid-config assertions changed unexpectedly')
          old_id = '                    SyncCorrelationId::new(1_000 + id as u64),\n'
          new_id = '''                    SyncCorrelationId::new(
                        1_000 + u64::try_from(id).expect("pending-probe index fits u64"),
                    ),
'''
          if estimator.count(old_id) != 1:
              raise SystemExit('pending-probe index conversion changed unexpectedly')
          estimator = estimator.replace(old_tests, new_tests).replace(old_id, new_id)
          estimator_path.write_text(estimator)

          fixture_path = Path('rust/silent-disco-core/src/sync/fixture_tests.rs')
          fixture = fixture_path.read_text()
          old_fixture_id = '        let correlation = SyncCorrelationId::new(index as u64 + 1);\n'
          new_fixture_id = '''        let correlation = SyncCorrelationId::new(
            u64::try_from(index)
                .expect("fixture sample index fits u64")
                .saturating_add(1),
        );
'''
          if fixture.count(old_fixture_id) != 1:
              raise SystemExit('fixture correlation conversion changed unexpectedly')
          fixture_path.write_text(fixture.replace(old_fixture_id, new_fixture_id))
          PY

          cd rust
          cargo fmt --all
          cd ..
          rm .github/workflows/fix-sync-core.yml
          git diff --check

      - name: Commit exact fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Rust synchronization validation and formatting"
          git push origin HEAD:master
