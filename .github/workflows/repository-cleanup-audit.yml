name: Repository cleanup audit

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: read

jobs:
  audit:
    if: github.event.head_commit.message == 'Run repository cleanup audit'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enumerate branches and open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          printf 'branch\tsha\trelation_to_master\n' > repository-branches.tsv
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [ "$branch" = "HEAD" ] && continue
            sha="$(git rev-parse "$ref")"
            if [ "$branch" = "master" ]; then
              relation=master
            elif git merge-base --is-ancestor "$ref" origin/master; then
              relation=merged_into_master
            elif git merge-base --is-ancestor origin/master "$ref"; then
              relation=ahead_of_master
            else
              relation=diverged_from_master
            fi
            printf '%s\t%s\t%s\n' "$branch" "$sha" "$relation" >> repository-branches.tsv
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin | sort)

          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" > open-pull-requests.json
          jq -r '.[] | [.number, .draft, .head.ref, .base.ref, .mergeable_state, .title] | @tsv' \
            open-pull-requests.json > open-pull-requests.tsv
          cat repository-branches.tsv
          cat open-pull-requests.tsv

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: repository-cleanup-audit
          path: |
            repository-branches.tsv
            open-pull-requests.json
            open-pull-requests.tsv
          retention-days: 1

      - name: Remove audit workflow
        run: |
          rm .github/workflows/repository-cleanup-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove repository cleanup audit workflow"
          git push origin HEAD:master
