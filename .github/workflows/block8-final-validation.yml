name: Block 8 final validation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  rust:
    if: github.event.pull_request.head.ref == 'agent/rust-storage-block8'
    name: Rust quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Block 8 branch
        uses: actions/checkout@v4
        with:
          ref: agent/rust-storage-block8

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Check Rust formatting
        run: |
          cd rust
          cargo fmt --all -- --check

      - name: Run Rust clippy
        shell: bash
        run: |
          set -o pipefail
          cd rust
          cargo clippy --workspace --all-targets --all-features -- -D warnings \
            2>&1 | tee ../block8-final-rust-clippy.log

      - name: Run Rust tests
        shell: bash
        run: |
          set -o pipefail
          cd rust
          cargo test --workspace --all-features \
            2>&1 | tee ../block8-final-rust-tests.log

      - name: Upload Rust diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block8-final-rust-diagnostics
          path: |
            block8-final-rust-clippy.log
            block8-final-rust-tests.log
          if-no-files-found: warn
          retention-days: 1

  android:
    if: github.event.pull_request.head.ref == 'agent/rust-storage-block8'
    name: Android build, unit tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Block 8 branch
        uses: actions/checkout@v4
        with:
          ref: agent/rust-storage-block8

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install required Android SDK packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Install pinned Rust toolchain for Android
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Build Android APKs and instrumentation test APK with Rust core
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            assembleDebug \
            assemblePocDebug \
            assembleRelease \
            assembleDebugAndroidTest \
            --stacktrace \
            --console=plain \
            2>&1 | tee block8-final-android-build.log

      - name: Verify Rust libraries are packaged for every supported ABI
        shell: bash
        run: |
          set -euo pipefail
          apks=(
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/pocDebug/app-pocDebug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          )
          abis=(armeabi-v7a arm64-v8a x86 x86_64)
          for apk in "${apks[@]}"; do
            test -f "$apk"
            for abi in "${abis[@]}"; do
              unzip -Z1 "$apk" "lib/$abi/libsilent_disco_ffi.so" | grep -Fx "lib/$abi/libsilent_disco_ffi.so"
            done
          done

      - name: Run Android unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew test --stacktrace --console=plain \
            2>&1 | tee block8-final-android-tests.log

      - name: Run Android lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew lintDebug --stacktrace --console=plain \
            2>&1 | tee block8-final-android-lint.log

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block8-final-android-diagnostics
          path: |
            block8-final-android-build.log
            block8-final-android-tests.log
            block8-final-android-lint.log
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 1

  cleanup:
    name: Remove guarded validation workflow
    needs:
      - rust
      - android
    runs-on: ubuntu-latest
    steps:
      - name: Check out Block 8 branch
        uses: actions/checkout@v4
        with:
          ref: agent/rust-storage-block8
          fetch-depth: 0

      - name: Remove workflow and commit validated branch
        run: |
          rm .github/workflows/block8-final-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record clean Block 8 validation branch"
          git push origin HEAD:agent/rust-storage-block8
