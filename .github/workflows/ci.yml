name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust quality gates
    # All pushes and PRs compile on ephemeral GitHub-hosted runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Check Rust formatting
        id: rust-format
        run: |
          cd rust
          cargo fmt --all -- --check

      - name: Generate Rust formatting patch
        if: failure() && steps.rust-format.conclusion == 'failure'
        run: |
          cd rust
          cargo fmt --all
          git diff -- . > ../rustfmt.patch

      - name: Upload Rust formatting patch
        if: failure() && steps.rust-format.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: |
            rustfmt.patch
            rust/**/*.rs
            rust/**/Cargo.toml
          if-no-files-found: error
          retention-days: 1

      - name: Run Rust clippy
        id: rust-clippy
        if: always()
        shell: bash
        run: |
          set -o pipefail
          cd rust
          cargo clippy --workspace --all-targets --all-features -- -D warnings \
            2>&1 | tee ../rust-clippy.log

      - name: Upload Rust clippy diagnostics
        if: failure() && steps.rust-clippy.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rust-clippy-diagnostics
          path: rust-clippy.log
          if-no-files-found: error
          retention-days: 1

      - name: Run Rust tests
        if: always()
        run: |
          mkdir -p rust-pcm-evidence
          cd rust
          SILENT_DISCO_PCM_EVIDENCE_DIR="$GITHUB_WORKSPACE/rust-pcm-evidence" \
            cargo test --workspace --all-features -- --test-threads=1

      - name: Validate exact-head PCM callback evidence
        if: always()
        shell: bash
        run: |
          python3 scripts/test_check_pcm_evidence.py
          python3 scripts/check_pcm_evidence.py \
            --directory rust-pcm-evidence --commit-sha "$GITHUB_SHA"

      - name: Upload objective PCM comparison evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gapless-pcm-comparison-evidence
          path: rust-pcm-evidence/*.json
          if-no-files-found: warn
          retention-days: 3

  android:
    name: Android build, unit tests, and lint
    # Keep trusted pushes and PRs on isolated hosted workers.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      release_candidate_upload: ${{ steps.android-release-candidate.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install required Android SDK packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Install pinned Rust toolchain for Android
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Build Android APKs and instrumentation test APK with Rust core
        id: android-build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            assembleDebug \
            assemblePocDebug \
            assembleRelease \
            assembleDebugAndroidTest \
            --stacktrace \
            --console=plain \
            2>&1 | tee android-rust-build.log

      - name: Verify Rust libraries are packaged for every supported ABI
        shell: bash
        run: |
          set -euo pipefail
          apks=(
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/pocDebug/app-pocDebug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          )
          abis=(armeabi-v7a arm64-v8a x86 x86_64)
          for apk in "${apks[@]}"; do
            test -f "$apk"
            for abi in "${abis[@]}"; do
              unzip -Z1 "$apk" "lib/$abi/libsilent_disco_ffi.so" | grep -Fx "lib/$abi/libsilent_disco_ffi.so"
            done
          done

      - name: Run Android unit tests
        id: android-tests
        if: always()
        shell: bash
        run: |
          set -o pipefail
          ./gradlew test --stacktrace --console=plain 2>&1 | tee android-unit-tests.log

      - name: Upload Android release-candidate APK
        id: android-release-candidate
        if: steps.android-build.outcome == 'success'
        # Preserve build/test qualification when account-level artifact storage is unavailable.
        # The separate publish gate below still fails CI until publication succeeds.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-release-candidate
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android build and test diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-build-test-diagnostics
          path: |
            android-rust-build.log
            android-unit-tests.log
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 1

      - name: Run Android lint
        if: always()
        run: ./gradlew lintDebug --stacktrace --console=plain

  android-release-publication:
    name: Android candidate publication gate
    needs: android
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require uploaded release candidate
        shell: bash
        env:
          UPLOAD_OUTCOME: ${{ needs.android.outputs.release_candidate_upload }}
        run: |
          if [[ "${UPLOAD_OUTCOME}" != "success" ]]; then
            echo "::error::Android candidate artifact was not uploaded; release qualification remains blocked."
            exit 1
          fi

  android-instrumentation:
    name: Android instrumentation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Enable KVM acceleration
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install required Android SDK and NDK packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Install pinned Rust toolchain for Android
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Report emulator runner disk availability
        shell: bash
        run: df -h /

      - name: Run instrumentation suite on snapshot-free API 29 emulator
        id: connected-tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/run-android-emulator-tests.sh

      - name: Upload instrumentation diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-diagnostics
          path: |
            android-instrumentation-tests.log
            android-screenshot-capture.log
            android-screenshot-capture-repeat.log
            android-workflow-screenshots/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 1
