name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust quality gates
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'docs/rust-sync-block6-record'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Check Rust formatting
        id: rust-format
        run: |
          cd rust
          cargo fmt --all -- --check

      - name: Generate Rust formatting patch
        if: failure() && steps.rust-format.conclusion == 'failure'
        run: |
          cd rust
          cargo fmt --all
          git diff -- . > ../rustfmt.patch

      - name: Upload Rust formatting patch
        if: failure() && steps.rust-format.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          if-no-files-found: error
          retention-days: 1

      - name: Run Rust clippy
        id: rust-clippy
        if: always()
        shell: bash
        run: |
          set -o pipefail
          cd rust
          cargo clippy --workspace --all-targets --all-features -- -D warnings \
            2>&1 | tee ../rust-clippy.log

      - name: Upload Rust clippy diagnostics
        if: failure() && steps.rust-clippy.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rust-clippy-diagnostics
          path: rust-clippy.log
          if-no-files-found: error
          retention-days: 1

      - name: Run Rust tests
        if: always()
        run: |
          cd rust
          cargo test --workspace --all-features

  android:
    name: Android build, unit tests, and lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'docs/rust-sync-block6-record'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install required Android SDK packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Install pinned Rust toolchain for Android
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Build Android APKs and instrumentation test APK with Rust core
        id: android-build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            assembleDebug \
            assemblePocDebug \
            assembleRelease \
            assembleDebugAndroidTest \
            --stacktrace \
            --console=plain \
            2>&1 | tee android-rust-build.log

      - name: Verify Rust libraries are packaged for every supported ABI
        shell: bash
        run: |
          set -euo pipefail
          apks=(
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/pocDebug/app-pocDebug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          )
          abis=(armeabi-v7a arm64-v8a x86 x86_64)
          for apk in "${apks[@]}"; do
            test -f "$apk"
            for abi in "${abis[@]}"; do
              unzip -Z1 "$apk" "lib/$abi/libsilent_disco_ffi.so" | grep -Fx "lib/$abi/libsilent_disco_ffi.so"
            done
          done

      - name: Run Android unit tests
        id: android-tests
        if: always()
        shell: bash
        run: |
          set -o pipefail
          ./gradlew test --stacktrace --console=plain 2>&1 | tee android-unit-tests.log

      - name: Upload Android build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-test-diagnostics
          path: |
            android-rust-build.log
            android-unit-tests.log
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 1

      - name: Run Android lint
        if: always()
        run: ./gradlew lintDebug --stacktrace --console=plain

  # BEGIN BLOCK 6 DOCUMENTATION JOB
  block6-documentation:
    name: Record Rust synchronization Block 6
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'docs/rust-sync-block6-record'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: docs/rust-sync-block6-record
          fetch-depth: 0

      - name: Apply guarded Block 6 record
        run: |
          python .github/scripts/complete_sync_block6.py
          git diff --check

      - name: Commit Block 6 record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record Rust synchronization Block 6 status"
          git push origin HEAD:docs/rust-sync-block6-record
  # END BLOCK 6 DOCUMENTATION JOB
