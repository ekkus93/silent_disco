name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Check Rust formatting
        id: rust-format
        run: |
          cd rust
          cargo fmt --all -- --check

      - name: Generate Rust formatting patch
        if: failure() && steps.rust-format.conclusion == 'failure'
        run: |
          cd rust
          cargo fmt --all
          git diff -- . > ../rustfmt.patch

      - name: Upload Rust formatting patch
        if: failure() && steps.rust-format.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          if-no-files-found: error
          retention-days: 1

      - name: Run Rust clippy
        if: always()
        run: |
          cd rust
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        if: always()
        run: |
          cd rust
          cargo test --workspace --all-features

  android:
    name: Android unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install required Android SDK packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Run Android unit tests
        if: always()
        run: ./gradlew test --stacktrace

      - name: Run Android lint
        if: always()
        run: ./gradlew lintDebug --stacktrace
