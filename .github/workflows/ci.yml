name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Check Rust formatting
        id: rust-format
        run: |
          cd rust
          cargo fmt --all -- --check

      - name: Generate Rust formatting patch
        if: failure() && steps.rust-format.conclusion == 'failure'
        run: |
          cd rust
          cargo fmt --all
          git diff -- . > ../rustfmt.patch

      - name: Upload Rust formatting patch
        if: failure() && steps.rust-format.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: |
            rustfmt.patch
            rust/**/*.rs
            rust/**/Cargo.toml
          if-no-files-found: error
          retention-days: 1

      - name: Run Rust clippy
        id: rust-clippy
        if: always()
        shell: bash
        run: |
          set -o pipefail
          cd rust
          cargo clippy --workspace --all-targets --all-features -- -D warnings \
            2>&1 | tee ../rust-clippy.log

      - name: Upload Rust clippy diagnostics
        if: failure() && steps.rust-clippy.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rust-clippy-diagnostics
          path: rust-clippy.log
          if-no-files-found: error
          retention-days: 1

      - name: Run Rust tests
        if: always()
        run: |
          cd rust
          cargo test --workspace --all-features

  android:
    name: Android build, unit tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install required Android SDK packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Install pinned Rust toolchain for Android
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Build Android APKs and instrumentation test APK with Rust core
        id: android-build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            assembleDebug \
            assemblePocDebug \
            assembleRelease \
            assembleDebugAndroidTest \
            --stacktrace \
            --console=plain \
            2>&1 | tee android-rust-build.log

      - name: Verify Rust libraries are packaged for every supported ABI
        shell: bash
        run: |
          set -euo pipefail
          apks=(
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/pocDebug/app-pocDebug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          )
          abis=(armeabi-v7a arm64-v8a x86 x86_64)
          for apk in "${apks[@]}"; do
            test -f "$apk"
            for abi in "${abis[@]}"; do
              unzip -Z1 "$apk" "lib/$abi/libsilent_disco_ffi.so" | grep -Fx "lib/$abi/libsilent_disco_ffi.so"
            done
          done

      - name: Run Android unit tests
        id: android-tests
        if: always()
        shell: bash
        run: |
          set -o pipefail
          ./gradlew test --stacktrace --console=plain 2>&1 | tee android-unit-tests.log

      - name: Upload Android build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-test-diagnostics
          path: |
            android-rust-build.log
            android-unit-tests.log
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 1

      - name: Run Android lint
        if: always()
        run: ./gradlew lintDebug --stacktrace --console=plain

  android-instrumentation:
    name: Android instrumentation tests
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install required Android SDK and NDK packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Install pinned Rust toolchain for Android
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Run Gradle-managed instrumentation suite
        id: managed-tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew pixel2api29DebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=software \
            --stacktrace \
            --console=plain \
            2>&1 | tee android-instrumentation-tests.log

      - name: Upload instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-diagnostics
          path: |
            android-instrumentation-tests.log
            app/build/outputs/androidTest-results/managedDevice/
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/managed_device_android_test_additional_output/
          if-no-files-found: warn
          retention-days: 1