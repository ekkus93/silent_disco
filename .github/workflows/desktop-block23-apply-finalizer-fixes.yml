name: Apply Desktop Block 23 finalizer fixes

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: desktop-block23-helper-writes
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.issue.number == 45 &&
      github.event.comment.body == '/apply-desktop-block23-finalizer-fixes-v2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Update finalization cleanup and changed-path contract
        run: |
          printf '%s' '' | base64 --decode > /tmp/block23-finalizer-patch.py
          python3 /tmp/block23-finalizer-patch.py
          rm .github/workflows/desktop-block23-apply-finalizer-fixes.yml
          git diff --check
      - name: Commit correction directly to master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/block23-validation.sh .github/workflows/desktop-block23-apply-finalizer-fixes.yml
          git commit -m "Fix Block 23 finalization cleanup contract"
          git push origin HEAD:master
          gh issue comment 45 --repo "$GITHUB_REPOSITORY" --body "Applied Desktop Block 23 finalization cleanup and changed-path fixes in commit $(git rev-parse HEAD)."
