name: Desktop Block 23 granular diagnostics

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: >-
      github.event.issue.number == 45 &&
      github.event.comment.body == '/diagnose-desktop-block23-v2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply deterministic adapter wiring
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' '' | base64 --decode > /tmp/wire_adapter.py
          python3 /tmp/wire_adapter.py
          git diff --check
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Wire Block 23 Tauri clippy adapter"
          remote_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test "$remote_sha" = "$(git rev-parse HEAD^)"
          git push origin HEAD:master
          gh issue comment 45 --repo "$GITHUB_REPOSITORY" --body "Applied deterministic Block 23 Tauri clippy adapter wiring in commit $(git rev-parse HEAD)."
