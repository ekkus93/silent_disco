name: Desktop Block 23 granular diagnostics

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: desktop-block23-granular-diagnostics
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.1"
  NODE_VERSION: "22.16.0"
  TRACKING_ISSUE: "45"

jobs:
  diagnose:
    if: >-
      github.event.issue.number == 45 &&
      github.event.comment.body == '/diagnose-desktop-block23-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Capture exact input and announce
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "BLOCK23_INPUT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Desktop Block 23 granular diagnostics started in Actions run $GITHUB_RUN_ID against direct-master input $(git rev-parse HEAD). This run cannot publish implementation changes."

      - name: Prepare and apply current-layout payload
        id: payload
        continue-on-error: true
        run: |
          cat .github/apply-block23.py.part-* | base64 --decode | gzip --decompress > .github/apply-block23.py
          python3 .github/block23-adapt.py
          python3 .github/block23-client-adapt.py
          mkdir -p desktop/dist
          printf '%s\n' '<!doctype html><html><body></body></html>' > desktop/dist/index.html
          python3 .github/apply-block23.py
          rm .github/apply-block23.py
          python3 .github/block23-storage-runner-adapt.py

      - name: Install Rust and Linux build dependencies
        id: toolchain
        if: steps.payload.outcome == 'success'
        continue-on-error: true
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy --component rustfmt
          rustup default "${RUST_VERSION}"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf time wget

      - name: Dependency, formatting, lockfile, and source preflight
        id: preflight
        if: steps.toolchain.outcome == 'success'
        continue-on-error: true
        run: |
          cp desktop/src-tauri/Cargo.lock /tmp/block23-desktop.Cargo.lock
          cp desktop/package-lock.json /tmp/block23-package-lock.json
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cp rust/Cargo.lock /tmp/block23-rust.Cargo.lock
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all
          (
            cd desktop
            npm ci
            npm run bindings:generate
            npm run format
          )
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
          cmp /tmp/block23-rust.Cargo.lock rust/Cargo.lock
          cmp /tmp/block23-desktop.Cargo.lock desktop/src-tauri/Cargo.lock
          cmp /tmp/block23-package-lock.json desktop/package-lock.json
          git diff --check
          bash scripts/check-source-file-line-counts.sh

      - name: Focused Rust host commands
        id: host_commands
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        working-directory: desktop/src-tauri
        run: cargo test host_commands::tests -- --nocapture

      - name: Focused Rust host session DTO
        id: host_session_dto
        if: steps.host_commands.outcome == 'success'
        continue-on-error: true
        working-directory: desktop/src-tauri
        run: cargo test host_session_dto::tests -- --nocapture

      - name: Focused Rust storage effects
        id: storage_effects
        if: steps.host_session_dto.outcome == 'success'
        continue-on-error: true
        working-directory: desktop/src-tauri
        run: cargo test platform::storage_effect_runner_tests -- --nocapture

      - name: Focused Rust transport admission
        id: transport_admission
        if: steps.storage_effects.outcome == 'success'
        continue-on-error: true
        working-directory: desktop/src-tauri
        run: cargo test platform::host_transport_admission_tests -- --nocapture

      - name: Focused Rust host transport
        id: host_transport
        if: steps.transport_admission.outcome == 'success'
        continue-on-error: true
        working-directory: desktop/src-tauri
        run: cargo test platform::host_transport_tests -- --nocapture

      - name: Focused Host Session frontend test
        id: host_session_frontend
        if: steps.host_transport.outcome == 'success'
        continue-on-error: true
        working-directory: desktop
        run: npm test -- --run src/screens/HostSessionScreen.test.tsx

      - name: Full shared Rust matrix
        id: rust_matrix
        if: steps.host_session_frontend.outcome == 'success'
        continue-on-error: true
        working-directory: rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features

      - name: Full desktop frontend matrix
        id: desktop_frontend
        if: steps.rust_matrix.outcome == 'success'
        continue-on-error: true
        working-directory: desktop
        run: |
          npm run bindings:check
          npm run format:check
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Full Tauri Rust matrix
        id: tauri_rust
        if: steps.desktop_frontend.outcome == 'success'
        continue-on-error: true
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
          cargo check --all-features

      - name: Linux Tauri package build
        id: tauri_package
        if: steps.tauri_rust.outcome == 'success'
        continue-on-error: true
        working-directory: desktop
        run: npm run tauri build

      - name: Install Android SDK components
        id: android_sdk
        if: steps.tauri_package.outcome == 'success'
        continue-on-error: true
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Android assemble matrix
        id: android_assemble
        if: steps.android_sdk.outcome == 'success'
        continue-on-error: true
        run: |
          ./gradlew assembleDebug assemblePocDebug assembleRelease assembleDebugAndroidTest \
            --stacktrace --console=plain

      - name: Android unit tests and lint
        id: android_test_lint
        if: steps.android_assemble.outcome == 'success'
        continue-on-error: true
        run: ./gradlew test lintDebug --stacktrace --console=plain

      - name: Android APK ABI validation
        id: android_abi
        if: steps.android_test_lint.outcome == 'success'
        continue-on-error: true
        run: |
          for apk in \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/pocDebug/app-pocDebug.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk; do
            test -f "${apk}"
            for abi in armeabi-v7a arm64-v8a x86 x86_64; do
              unzip -Z1 "${apk}" "lib/${abi}/libsilent_disco_ffi.so" \
                | grep -Fx "lib/${abi}/libsilent_disco_ffi.so"
            done
          done

      - name: Android managed-device instrumentation
        id: android_instrumentation
        if: steps.android_abi.outcome == 'success'
        continue-on-error: true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ./gradlew pixel2api29DebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=software \
            --stacktrace --console=plain

      - name: Final drift and completion-evidence gate
        id: final_evidence
        if: steps.android_instrumentation.outcome == 'success'
        continue-on-error: true
        run: |
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
          cmp /tmp/block23-rust.Cargo.lock rust/Cargo.lock
          cmp /tmp/block23-desktop.Cargo.lock desktop/src-tauri/Cargo.lock
          cmp /tmp/block23-package-lock.json desktop/package-lock.json
          git diff --check
          bash scripts/check-source-file-line-counts.sh
          python3 .github/block23-complete.py

      - name: Publish diagnostic result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD: ${{ steps.payload.outcome }}
          TOOLCHAIN: ${{ steps.toolchain.outcome }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          HOST_COMMANDS: ${{ steps.host_commands.outcome }}
          HOST_SESSION_DTO: ${{ steps.host_session_dto.outcome }}
          STORAGE_EFFECTS: ${{ steps.storage_effects.outcome }}
          TRANSPORT_ADMISSION: ${{ steps.transport_admission.outcome }}
          HOST_TRANSPORT: ${{ steps.host_transport.outcome }}
          HOST_SESSION_FRONTEND: ${{ steps.host_session_frontend.outcome }}
          RUST_MATRIX: ${{ steps.rust_matrix.outcome }}
          DESKTOP_FRONTEND: ${{ steps.desktop_frontend.outcome }}
          TAURI_RUST: ${{ steps.tauri_rust.outcome }}
          TAURI_PACKAGE: ${{ steps.tauri_package.outcome }}
          ANDROID_SDK: ${{ steps.android_sdk.outcome }}
          ANDROID_ASSEMBLE: ${{ steps.android_assemble.outcome }}
          ANDROID_TEST_LINT: ${{ steps.android_test_lint.outcome }}
          ANDROID_ABI: ${{ steps.android_abi.outcome }}
          ANDROID_INSTRUMENTATION: ${{ steps.android_instrumentation.outcome }}
          FINAL_EVIDENCE: ${{ steps.final_evidence.outcome }}
        run: |
          outcomes=$(cat <<EOF
          payload=${PAYLOAD}
          toolchain=${TOOLCHAIN}
          preflight=${PREFLIGHT}
          host_commands=${HOST_COMMANDS}
          host_session_dto=${HOST_SESSION_DTO}
          storage_effects=${STORAGE_EFFECTS}
          transport_admission=${TRANSPORT_ADMISSION}
          host_transport=${HOST_TRANSPORT}
          host_session_frontend=${HOST_SESSION_FRONTEND}
          rust_matrix=${RUST_MATRIX}
          desktop_frontend=${DESKTOP_FRONTEND}
          tauri_rust=${TAURI_RUST}
          tauri_package=${TAURI_PACKAGE}
          android_sdk=${ANDROID_SDK}
          android_assemble=${ANDROID_ASSEMBLE}
          android_test_lint=${ANDROID_TEST_LINT}
          android_abi=${ANDROID_ABI}
          android_instrumentation=${ANDROID_INSTRUMENTATION}
          final_evidence=${FINAL_EVIDENCE}
          EOF
          )
          first_failed=$(printf '%s\n' "$outcomes" | awk -F= '$2 == "failure" || $2 == "cancelled" { print $1; exit }')
          if [[ -z "$first_failed" && "$FINAL_EVIDENCE" == "success" ]]; then
            body="Desktop Block 23 granular diagnostics passed every non-publishing gate in Actions run $GITHUB_RUN_ID against $BLOCK23_INPUT. The next action is the complete clean runner."
          else
            [[ -n "$first_failed" ]] || first_failed="workflow_setup_or_unknown"
            body="Desktop Block 23 granular diagnostics found first failing gate '$first_failed' in Actions run $GITHUB_RUN_ID against $BLOCK23_INPUT. No implementation or completion evidence was committed."
          fi
          printf '%s\n\n%s\n' "$body" "$outcomes" > /tmp/block23-diagnostic-comment.txt
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/block23-diagnostic-comment.txt
