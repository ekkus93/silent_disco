name: Fix protocol header import

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'ekkus93/silent_disco'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Install pinned Rust formatter
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1

      - name: Move typed header import into tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('rust/silent-disco-core/src/protocol/codec.rs')
          text = path.read_text()
          old_top = (
              '    FRAME_HEADER_BYTES, FRAME_HEADER_LENGTH, FrameHeader, Heartbeat, Hello, JoinApproval,\n'
          )
          new_top = (
              '    FRAME_HEADER_BYTES, FrameHeader, Heartbeat, Hello, JoinApproval,\n'
          )
          if text.count(old_top) != 1:
              raise SystemExit('production header import changed unexpectedly')
          text = text.replace(old_top, new_top)

          old_test = (
              '            AudioCodec, AudioDatagram, ControlMessage, DeviceIdentity, FRAME_HEADER_BYTES, Hello,\n'
              '            JoinRequest, MAX_CONTROL_PAYLOAD_BYTES, MessageKind, PROTOCOL_MAGIC, PROTOCOL_VERSION,\n'
          )
          new_test = (
              '            AudioCodec, AudioDatagram, ControlMessage, DeviceIdentity, FRAME_HEADER_BYTES,\n'
              '            FRAME_HEADER_LENGTH, Hello, JoinRequest, MAX_CONTROL_PAYLOAD_BYTES, MessageKind,\n'
              '            PROTOCOL_MAGIC, PROTOCOL_VERSION,\n'
          )
          if text.count(old_test) != 1:
              raise SystemExit('test protocol import changed unexpectedly')
          path.write_text(text.replace(old_test, new_test))
          PY

          cd rust
          cargo fmt --all
          cd ..
          rm .github/workflows/fix-protocol-header-import.yml
          git diff --check

      - name: Commit import fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Scope protocol header length import to tests"
          git push origin HEAD:master
