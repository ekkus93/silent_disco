name: Complete Rust migration Blocks 4 and 5

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  complete:
    if: github.repository == 'ekkus93/silent_disco'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply assertion-checked TODO and memory updates
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          todo_path = Path('docs/SILENT_DISCO_RUST_CORE_MIGRATION_TODO.md')
          todo = todo_path.read_text()

          block4_start = todo.index('## Block 4 — Implement Rust domain IDs, enums, and structured errors')
          block4_end = todo.index('**Acceptance:** Core domain types compile without Android dependencies', block4_start)
          block4 = todo[block4_start:block4_end]
          if block4.count('- [ ]') != 27:
              raise SystemExit('Block 4 no longer has exactly 27 unchecked tasks')
          todo = todo[:block4_start] + block4.replace('- [ ]', '- [x]') + todo[block4_end:]

          block5_start = todo.index('## Block 5 — Implement Rust protocol framing and golden vectors')
          block5_end = todo.index('**Acceptance:** Rust protocol tests pass and the wire format is fully specified by executable vectors.', block5_start)
          block5 = todo[block5_start:block5_end]
          if block5.count('- [ ]') != 38:
              raise SystemExit('Block 5 no longer has exactly 38 unchecked tasks')
          todo = todo[:block5_start] + block5.replace('- [ ]', '- [x]') + todo[block5_end:]

          required_open = (
              '- [ ] Run the current connected Android test suite on an available physical device.',
              '- [ ] Test loads the Rust library on a physical Android device.',
              '- [ ] Test verifies the ABI version.',
          )
          for item in required_open:
              if item not in todo:
                  raise SystemExit(f'physical-device task changed unexpectedly: {item}')
          todo_path.write_text(todo)

          memory_path = Path('memory.md')
          memory = memory_path.read_text()
          prefix = '# memory.md — `silent_disco`\n\n'
          if not memory.startswith(prefix):
              raise SystemExit('memory.md header changed unexpectedly')
          if 'Rust migration Block 4 complete' in memory or 'Rust migration Block 5 complete' in memory:
              raise SystemExit('Block 4 or Block 5 memory entry already exists')
          timestamp = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          entries = f'''## {timestamp} - GPT-5.6 Thinking - Rust migration Block 5 complete

- Completed Block 5 of `docs/SILENT_DISCO_RUST_CORE_MIGRATION_TODO.md`; the physical-device-only checks in Blocks 1 and 3 remain open.
- Established authoritative protocol version 2 with magic `SDP2`, a fixed 16-byte network-byte-order header, explicit version/kind/flags/payload-length fields, a 64 KiB control payload limit, a 4 KiB audio datagram limit, and bounded identifiers/text.
- Added canonical dependency-free Rust payload schemas for all ten control messages, synchronization request/response packets, and PCM16 audio datagrams. Kotlin/JVM object serialization is not part of protocol v2.
- The parser validates magic, version, kind, flags, header size, declared payload size, exact frame length, field bounds, UTF-8, booleans, identifiers, audio metadata, and CRC32 before accepting a frame. Header-only oversized declarations are rejected before payload allocation or copying.
- Added explicit malformed, unsupported, oversized, unauthorized-session, and stale-sequence failure classes with independent diagnostic counters and structured `CoreError` conversion.
- Added production-encoder-generated golden vectors under `rust/silent-disco-core/testdata/protocol/v2/` for every message kind, field-size boundaries, an exact 4096-byte audio datagram, deterministic frame/payload CRCs, and malformed/unsupported/integrity cases. Tests decode and re-encode every valid vector byte-for-byte.
- Added deterministic arbitrary-input parser coverage that exercises inputs from 0 through 512 bytes without panics or allocation driven by untrusted declared lengths.
- CI run `30170763626` passed Rust formatting, Clippy with warnings denied, all Rust tests, Android debug/PoC-debug/release APK builds, all four ABI packaging checks, Android unit tests, and Android lint on the same revision.

## {timestamp} - GPT-5.6 Thinking - Rust migration Block 4 complete

- Completed Block 4 of `docs/SILENT_DISCO_RUST_CORE_MIGRATION_TODO.md` while leaving the physical-device-only Block 3 checks open.
- Added validated Rust newtypes for session, stream, device, request, operation, and diagnostic-run IDs, plus monotonic milliseconds, packet sequence, and sample index.
- Opaque IDs are bounded to 128 UTF-8 bytes; blank values, boundary whitespace, and control characters are rejected. Canonical UTF-8 and network-byte-order representations are explicit and round-trip tested.
- Added presentation-independent application role, approval, host/listener lifecycle, playback, transport, synchronization-confidence, trust, and delivery-severity enums with stable numeric codes and snake-case wire names.
- Added `CoreError`, `CoreErrorRecord`, stable subsystem-specific error codes, severity, retryability, operation correlation, and bounded context. There is no generic `Unknown` code for known failure classes.
- Error messages are limited to 512 bytes; context is limited to 16 entries, 64-byte keys, and 256-byte values. Identifier conversion never copies the rejected identifier value into diagnostics.
- CI run `30168849005` passed Rust formatting, Clippy with warnings denied, all Rust tests, Android debug/PoC-debug/release APK builds, all four ABI packaging checks, Android unit tests, and Android lint on the same revision.

'''
          memory_path.write_text(prefix + entries + memory[len(prefix):])
          PY

          rm .github/workflows/complete-rust-blocks-4-5.yml
          rm -f .github/rust-blocks-4-5-completion-trigger.txt
          rm -f .github/protocol-vector-style-trigger.txt
          git diff --check

      - name: Commit completion record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Rust domain and protocol migration blocks"
          git push origin HEAD:master
