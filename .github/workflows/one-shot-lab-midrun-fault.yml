name: One-shot Lab mid-run fault implementation

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/one-shot-lab-midrun-fault.yml"

permissions:
  contents: write

env:
  RUST_VERSION: "1.97.1"

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential curl file libasound2-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy --component rustfmt
          rustup default "${RUST_VERSION}"

      - name: Apply exact implementation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new))

