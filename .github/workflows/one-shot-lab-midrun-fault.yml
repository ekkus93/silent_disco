name: One-shot Lab mid-run fault implementation

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/one-shot-lab-midrun-fault.yml"

permissions:
  contents: write

env:
  RUST_VERSION: "1.97.1"

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential curl file libasound2-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy --component rustfmt
          rustup default "${RUST_VERSION}"

      - name: Apply exact implementation patch
        run: python3 .github/scripts/one_shot_lab_midrun_fault.py

      - name: Format and verify source limits
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all
          test "$(wc -l < desktop/src-tauri/src/lab/scenario/live_transport.rs)" -lt 800
          for file in \
            rust/silent-disco-core/src/transport/virtual_fault_control.rs \
            desktop/src-tauri/src/lab/fault/control.rs \
            desktop/src-tauri/src/lab/scenario/live_transport/state.rs \
            desktop/src-tauri/src/lab/scenario/live_transport/fault_control.rs; do
            test "$(wc -l < "$file")" -lt 800
          done
          git diff --check

      - name: Create Rust-only frontend placeholder
        run: |
          mkdir -p desktop/dist
          printf '<!doctype html><title>Silent Disco Lab mutation verification</title>\n' > desktop/dist/index.html

      - name: Run focused core dynamic-loss test
        run: cargo test --manifest-path rust/Cargo.toml -p silent-disco-core loss_controller_updates_an_existing_listener_without_reconnect -- --exact

      - name: Run focused Lab live-transport proofs
        working-directory: desktop/src-tauri
        run: cargo test --all-features lab::scenario::live_transport_proof_tests -- --nocapture

      - name: Run strict Desktop Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Commit verified implementation and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-lab-midrun-fault.yml
          git rm .github/scripts/one_shot_lab_midrun_fault.py
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add rust desktop/src-tauri
          git commit -m "Add deterministic mid-run Lab receive fault mutation"
          git push origin HEAD:master
