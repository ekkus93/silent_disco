name: Publish Desktop Block 13 Automation Status

on:
  workflow_run:
    workflows:
      - Fix Block 13 Rust and Rerun Transport
      - Enable Block 13 Targeted Transport
      - Apply Block 13 Targeted Transport
    types:
      - requested
      - in_progress
      - completed

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: publish-block13-automation-${{ github.event.workflow_run.workflow_id }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Publish latest helper status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
        run: |
          set -euo pipefail
          latest_run_id="$(
            gh api \
              "repos/${REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?per_page=1" \
              --jq '.workflow_runs[0].id'
          )"
          if [[ "${latest_run_id}" != "${RUN_ID}" ]]; then
            printf 'Skipping stale helper run %s; latest is %s.\n' "${RUN_ID}" "${latest_run_id}"
            exit 0
          fi

          run_file="${RUNNER_TEMP}/block13-run.json"
          jobs_file="${RUNNER_TEMP}/block13-jobs.json"
          patch_file="${RUNNER_TEMP}/block13-issue.json"
          gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" > "${run_file}"
          gh api \
            "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100" \
            > "${jobs_file}"

          python3 - "${run_file}" "${jobs_file}" "${patch_file}" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          raw_jobs = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          problem = {
              "action_required",
              "cancelled",
              "failure",
              "stale",
              "startup_failure",
              "timed_out",
          }
          jobs = []
          failed_steps = []
          for raw_job in raw_jobs.get("jobs", []):
              steps = []
              for raw_step in raw_job.get("steps", []):
                  step = {
                      "number": raw_step.get("number"),
                      "name": raw_step.get("name"),
                      "status": raw_step.get("status"),
                      "conclusion": raw_step.get("conclusion"),
                      "started_at": raw_step.get("started_at"),
                      "completed_at": raw_step.get("completed_at"),
                  }
                  steps.append(step)
                  if step["conclusion"] in problem:
                      failed_steps.append(
                          {
                              "job_id": raw_job.get("id"),
                              "job": raw_job.get("name"),
                              "step_number": step["number"],
                              "step": step["name"],
                              "conclusion": step["conclusion"],
                          }
                      )
              jobs.append(
                  {
                      "id": raw_job.get("id"),
                      "name": raw_job.get("name"),
                      "status": raw_job.get("status"),
                      "conclusion": raw_job.get("conclusion"),
                      "started_at": raw_job.get("started_at"),
                      "completed_at": raw_job.get("completed_at"),
                      "runner_name": raw_job.get("runner_name"),
                      "runner_group_name": raw_job.get("runner_group_name"),
                      "steps": steps,
                  }
              )

          payload = {
              "schema_version": 1,
              "workflow": run.get("name"),
              "workflow_id": run.get("workflow_id"),
              "workflow_path": run.get("path"),
              "run_id": run.get("id"),
              "run_number": run.get("run_number"),
              "run_attempt": run.get("run_attempt"),
              "run_url": run.get("html_url"),
              "status": run.get("status"),
              "conclusion": run.get("conclusion"),
              "event": run.get("event"),
              "head_branch": run.get("head_branch"),
              "head_sha": run.get("head_sha"),
              "updated_at": run.get("updated_at"),
              "published_at": datetime.now(timezone.utc).isoformat(),
              "failed_steps": failed_steps,
              "jobs": jobs,
          }
          failed_summary = "None"
          if failed_steps:
              failed_summary = ", ".join(
                  f'{item["job"]} / {item["step"]} ({item["conclusion"]})'
                  for item in failed_steps
              )
          conclusion = payload["conclusion"] or "pending"
          body = "\n".join(
              [
                  "<!-- maintained by publish-block13-automation-status.yml -->",
                  "# Latest Desktop Block 13 Automation",
                  "",
                  f'- **Workflow:** `{payload["workflow"]}`',
                  f'- **Status:** `{payload["status"]}`',
                  f'- **Conclusion:** `{conclusion}`',
                  f'- **Run:** [{payload["run_id"]}]({payload["run_url"]})',
                  f'- **Commit:** `{payload["head_sha"]}`',
                  f'- **Failed steps:** {failed_summary}',
                  f'- **Observed:** `{payload["updated_at"]}`',
                  "",
                  "## Machine-readable status",
                  "",
                  "```json",
                  json.dumps(payload, indent=2, sort_keys=True),
                  "```",
                  "",
                  "This issue is overwritten whenever the latest helper run changes state.",
              ]
          )
          patch = {
              "title": "CI Status: Desktop Block 13 Automation",
              "body": body + "\n",
              "state": "open",
          }
          Path(sys.argv[3]).write_text(json.dumps(patch), encoding="utf-8")
          PY

          latest_run_id="$(
            gh api \
              "repos/${REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?per_page=1" \
              --jq '.workflow_runs[0].id'
          )"
          if [[ "${latest_run_id}" != "${RUN_ID}" ]]; then
            printf 'Skipping superseded helper run %s; latest is now %s.\n' \
              "${RUN_ID}" "${latest_run_id}"
            exit 0
          fi
          gh api --method PATCH "repos/${REPOSITORY}/issues/44" --input "${patch_file}" >/dev/null
