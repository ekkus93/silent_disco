name: Block 13 Trigger Probe

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/block13-trigger-probe.txt"

permissions:
  issues: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Record probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 45 --body "Block 13 trigger probe ran: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
