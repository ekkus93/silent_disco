name: Desktop Block 21 source snapshot

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/desktop-block21-source-snapshot.yml

permissions:
  contents: read
  issues: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Record exact source input
        run: echo "BLOCK21_SOURCE_INPUT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create source archive
        run: |
          set -euo pipefail
          tar -czf /tmp/desktop-block21-source.tar.gz \
            Cargo.toml build.gradle.kts gradle.properties settings.gradle.kts gradlew gradlew.bat \
            app buildSrc desktop docs gradle rust scripts tools memory.md \
            --exclude='*/target' --exclude='*/node_modules' --exclude='*/dist' --exclude='*/build'
          sha256sum /tmp/desktop-block21-source.tar.gz > /tmp/desktop-block21-source.sha256
          printf '%s\n' "$BLOCK21_SOURCE_INPUT" > /tmp/desktop-block21-source.commit

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-block21-source
          path: |
            /tmp/desktop-block21-source.tar.gz
            /tmp/desktop-block21-source.sha256
            /tmp/desktop-block21-source.commit
          retention-days: 2
          if-no-files-found: error

      - name: Publish snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 45 --repo "$GITHUB_REPOSITORY" \
            --body "Desktop Block 21 source snapshot created in Actions run $GITHUB_RUN_ID from direct-master input $BLOCK21_SOURCE_INPUT. No branch or PR is involved."
