name: Ralph actor backpressure

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/ralph-actor-backpressure.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Patch actor notification backpressure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("rust/silent-disco-core/src/runtime/actor_runtime/mod.rs")
          source = path.read_text()

          old_send = '''fn send_notification(
              sender: &SyncSender<NotificationMessage>,
              notification: CoreNotification,
          ) -> Result<(), CoreError> {
              sender
                  .send(NotificationMessage::Notify(Box::new(notification)))
                  .map_err(|_| worker_stopped(None))
          }
          '''
          new_send = '''fn send_notification(
              sender: &SyncSender<NotificationMessage>,
              notification: CoreNotification,
          ) -> Result<(), CoreError> {
              match sender.try_send(NotificationMessage::Notify(Box::new(notification))) {
                  Ok(()) => Ok(()),
                  Err(TrySendError::Full(_)) => Err(core_error(
                      CoreErrorCode::QueueOverflow,
                      "notification queue is full",
                      ErrorSeverity::Fatal,
                      false,
                      None,
                  )),
                  Err(TrySendError::Disconnected(_)) => Err(worker_stopped(None)),
              }
          }
          '''
          if old_send not in source:
              raise SystemExit("expected send_notification implementation was not found")
          source = source.replace(old_send, new_send, 1)

          old_imports = '''    use super::{CoreActorConfig, CoreActorRuntime};
              use crate::domain::DeviceId;
              use crate::error::CoreErrorCode;
          '''
          new_imports = '''    use super::{CoreActorConfig, CoreActorRuntime};
              use crate::domain::{AppRole, DeviceId};
              use crate::error::CoreErrorCode;
              use crate::runtime::{CoreCommand, CoreCommandRequest, SnapshotRevision};
              use std::sync::atomic::{AtomicUsize, Ordering};
              use std::sync::{Arc, Condvar, Mutex, mpsc};
              use std::time::Duration;
          '''
          if old_imports not in source:
              raise SystemExit("expected actor test imports were not found")
          source = source.replace(old_imports, new_imports, 1)

          marker = '''        assert!(runtime.shutdown().is_err());
              }
          }
          '''
          replacement = '''        assert!(runtime.shutdown().is_err());
              }

              #[test]
              fn notification_queue_overflow_fails_actor_without_blocking() {
                  let release_gate = Arc::new((Mutex::new(false), Condvar::new()));
                  let observer_gate = Arc::clone(&release_gate);
                  let observer_calls = Arc::new(AtomicUsize::new(0));
                  let observer_call_count = Arc::clone(&observer_calls);
                  let (entered_sender, entered_receiver) = mpsc::channel();

                  let mut config =
                      CoreActorConfig::new(DeviceId::new("core-3").expect("valid device ID"));
                  config.actor_queue_capacity = 8;
                  config.notification_queue_capacity = 1;

                  let runtime = CoreActorRuntime::start(config, move |_| {
                      if observer_call_count.fetch_add(1, Ordering::SeqCst) == 0 {
                          entered_sender
                              .send(())
                              .map_err(|_| super::worker_stopped(None))?;
                          let (released, wake) = &*observer_gate;
                          let mut released = released
                              .lock()
                              .map_err(|_| super::shared_state_error("test gate was poisoned"))?;
                          while !*released {
                              released = wake
                                  .wait(released)
                                  .map_err(|_| super::shared_state_error("test gate was poisoned"))?;
                          }
                      }
                      Ok(())
                  })
                  .expect("runtime starts");
                  entered_receiver
                      .recv_timeout(Duration::from_secs(2))
                      .expect("initial notification entered observer");

                  let handle = runtime.handle();
                  handle
                      .submit_command(
                          CoreCommandRequest::new(
                              SnapshotRevision::new(0),
                              CoreCommand::SelectRole { role: AppRole::Host },
                          )
                          .expect("valid first command"),
                      )
                      .expect("first command admitted");

                  for _ in 0..1_000 {
                      if handle
                          .current_snapshot()
                          .is_ok_and(|snapshot| snapshot.revision == SnapshotRevision::new(1))
                      {
                          break;
                      }
                      std::thread::yield_now();
                  }
                  assert_eq!(
                      handle
                          .current_snapshot()
                          .expect("first command snapshot is available")
                          .revision,
                      SnapshotRevision::new(1)
                  );

                  handle
                      .submit_command(
                          CoreCommandRequest::new(
                              SnapshotRevision::new(1),
                              CoreCommand::SelectRole {
                                  role: AppRole::Listener,
                              },
                          )
                          .expect("valid second command"),
                      )
                      .expect("second command admitted");

                  let overflow = (0..1_000).find_map(|_| match handle.current_snapshot() {
                      Ok(_) => {
                          std::thread::yield_now();
                          None
                      }
                      Err(error) => Some(error),
                  });
                  let overflow = overflow.expect("notification overflow becomes visible");
                  assert_eq!(overflow.code, CoreErrorCode::QueueOverflow);
                  assert_eq!(overflow.message, "notification queue is full");

                  let (released, wake) = &*release_gate;
                  *released.lock().expect("release gate lock") = true;
                  wake.notify_all();

                  assert!(runtime.shutdown().is_err());
                  assert!(observer_calls.load(Ordering::SeqCst) >= 1);
              }
          }
          '''
          if marker not in source:
              raise SystemExit("expected actor test module ending was not found")
          source = source.replace(marker, replacement, 1)
          path.write_text(source)
          PY

      - name: Format and validate Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cd rust
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features

      - name: Enforce source file line limit
        run: bash scripts/check-source-file-line-counts.sh

      - name: Commit validated fix and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ralph-actor-backpressure.yml
          git add rust/silent-disco-core/src/runtime/actor_runtime/mod.rs
          git commit -m "Fail visibly on actor notification backpressure"
          git push origin HEAD:master
