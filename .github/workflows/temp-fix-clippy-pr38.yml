name: Temporary Clippy Fix PR38

on:
  push:
    branches:
      - chatgpt/fix-rust-ci-30332312110

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-rust-ci-30332312110
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Apply exact Clippy repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("rust/silent-disco-core/src/runtime/actor_runtime/state.rs")
          text = path.read_text()

          replacements = [
              (
                  "CoreCommand::CancelJoin => self.cancel_join(operation_id),",
                  "CoreCommand::CancelJoin => self.cancel_join(&operation_id),",
              ),
              (
                  "fn cancel_join(&mut self, operation_id: OperationId) -> Result<ApplyOutcome, CoreError> {\n        self.require_role(AppRole::Listener, &operation_id)?;",
                  "fn cancel_join(&mut self, operation_id: &OperationId) -> Result<ApplyOutcome, CoreError> {\n        self.require_role(AppRole::Listener, operation_id)?;",
              ),
              (
                  "PlatformEvent::SessionExpired { session_id } => self.expire_session(&session_id),",
                  "PlatformEvent::SessionExpired { session_id } => Ok(self.expire_session(&session_id)),",
              ),
              (
                  "fn expire_session(&mut self, session_id: &SessionId) -> Result<ApplyOutcome, CoreError> {",
                  "fn expire_session(&mut self, session_id: &SessionId) -> ApplyOutcome {",
              ),
              ("return Ok(ApplyOutcome::default());", "return ApplyOutcome::default();"),
              ("Ok(ApplyOutcome::changed())\n    }\n\n    fn apply_platform_success", "ApplyOutcome::changed()\n    }\n\n    fn apply_platform_success"),
              (
                  "TransportEvent::ListenerDisconnected { device_id, error } => {\n                self.record_listener_disconnect(&device_id, error)\n            }",
                  "TransportEvent::ListenerDisconnected { device_id, error } => {\n                Ok(self.record_listener_disconnect(&device_id, error))\n            }",
              ),
              (
                  "TransportEvent::Failed(error) => self.record_transport_failure(error),",
                  "TransportEvent::Failed(error) => Ok(self.record_transport_failure(error)),",
              ),
              (
                  ") -> Result<ApplyOutcome, CoreError> {\n        let previous = self.snapshot.listeners.len();",
                  ") -> ApplyOutcome {\n        let previous = self.snapshot.listeners.len();",
              ),
              ("return Ok(ApplyOutcome {\n                notifications: vec![CoreNotification::Error(error)],", "return ApplyOutcome {\n                notifications: vec![CoreNotification::Error(error)],"),
              ("stop_requested: false,\n            });\n        }\n        if previous == self.snapshot.listeners.len() {\n            return Ok(ApplyOutcome::default());\n        }\n        Ok(ApplyOutcome::changed())", "stop_requested: false,\n            };\n        }\n        if previous == self.snapshot.listeners.len() {\n            return ApplyOutcome::default();\n        }\n        ApplyOutcome::changed()"),
              (
                  "fn record_transport_failure(&mut self, error: CoreError) -> Result<ApplyOutcome, CoreError> {",
                  "fn record_transport_failure(&mut self, error: CoreError) -> ApplyOutcome {",
              ),
              ("Ok(ApplyOutcome {\n            notifications: vec![CoreNotification::Error(error)],\n            changed: true,\n            stop_requested: false,\n        })\n    }\n\n    fn apply_audio", "ApplyOutcome {\n            notifications: vec![CoreNotification::Error(error)],\n            changed: true,\n            stop_requested: false,\n        }\n    }\n\n    fn apply_audio"),
              ("self.diagnostic(", "Self::diagnostic("),
              ("fn diagnostic(\n        &self,\n", "fn diagnostic(\n"),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f"expected replacement target not found: {old[:100]!r}")
              if old != "self.diagnostic(" and count != 1:
                  raise SystemExit(f"replacement target occurred {count} times: {old[:100]!r}")
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Format and verify Rust workspace
        working-directory: rust
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust
          git commit -m "Fix remaining Rust actor lints"
          git push origin HEAD:chatgpt/fix-rust-ci-30332312110
