name: Finalize Desktop Block 16 once

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/finalize-desktop-block16-once.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: finalize-desktop-block16-once
  cancel-in-progress: false

env:
  NODE_VERSION: "22.16.0"
  RUST_VERSION: "1.97.1"

jobs:
  validate-and-finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact master revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish validation start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 45 --body "Desktop Block 16 final validation started: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} at commit ${GITHUB_SHA}."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy --component rustfmt
          rustup default "${RUST_VERSION}"

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Verify tracked source line limit
        run: bash scripts/check-source-file-line-counts.sh

      - name: Generate exact lockfiles
        shell: bash
        run: |
          set -euo pipefail
          cd desktop
          npm install --package-lock-only --ignore-scripts
          cd src-tauri
          cargo generate-lockfile

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Create binding-generator frontend placeholder
        run: |
          mkdir -p desktop/dist
          printf '<!doctype html><title>Silent Disco Block 16 validation</title>\n' > desktop/dist/index.html

      - name: Verify Rust-derived TypeScript bindings
        working-directory: desktop
        run: npm run bindings:check

      - name: Check frontend formatting
        working-directory: desktop
        run: npm run format:check

      - name: Run frontend lint
        working-directory: desktop
        run: npm run lint

      - name: Run TypeScript checks
        working-directory: desktop
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: desktop
        run: npm test -- --run

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      - name: Check Rust formatting
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: Run strict Rust Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run desktop backend tests
        working-directory: desktop/src-tauri
        run: cargo test --all-features

      - name: Check desktop backend
        working-directory: desktop/src-tauri
        run: cargo check --all-features

      - name: Build Linux desktop bundles
        working-directory: desktop
        run: npm run tauri build

      - name: Require exact committed lockfiles
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain -- desktop/package-lock.json desktop/src-tauri/Cargo.lock)"
          if [[ -n "${status}" ]]; then
            printf '%s\n' "${status}"
            echo "Desktop lockfiles must be committed exactly as generated." >&2
            exit 1
          fi

      - name: Require unchanged master before finalization
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          test "$(git rev-parse origin/master)" = "${GITHUB_SHA}"

      - name: Mark Block 16 complete and record evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          todo = Path("docs/SILENT_DISCO_TAURI_DESKTOP_HOST_TODO.md")
          text = todo.read_text()
          start = text.index("## Block 16 — Implement secure audio file selection")
          end = text.index("## Block 17 — Implement atomic source staging", start)
          block = text[start:end]
          unchecked = block.count("- [ ]")
          if unchecked != 19:
              raise SystemExit(f"expected 19 unchecked Block 16 tasks, found {unchecked}")
          block = block.replace("- [ ]", "- [x]")
          evidence = (
              "**Completion evidence:** Secure single-file selection, bounded signature inspection, "
              "opaque backend registration, authoritative capability publication, profile-lifecycle "
              "cleanup, frontend integration, and all automated gates passed in GitHub Actions run "
              f"`{os.environ['GITHUB_RUN_ID']}` at source commit `{os.environ['GITHUB_SHA']}`. "
              "Physical interaction with a native desktop file dialog was not performed by this CI run.\n\n"
          )
          marker = "**Acceptance:** File selection grants only the access needed to stage one explicit source."
          if block.count(marker) != 1:
              raise SystemExit("Block 16 acceptance marker was not found exactly once")
          block = block.replace(marker, evidence + marker)
          todo.write_text(text[:start] + block + text[end:])

          memory = Path("memory.md")
          entry = f'''\n\n## 2026-07-30 — Desktop Block 16 secure audio source selection complete\n\n- Source commit validated: `{os.environ['GITHUB_SHA']}`.\n- Final validation run: `{os.environ['GITHUB_RUN_ID']}`.\n- Added backend-owned native file selection for one explicit WAV, FLAC, or MP3 source; cancellation remains distinct from failure and no unrestricted filesystem capability is exposed.\n- Inspection verifies canonicalized regular files, an 8 GiB size bound, bounded/sanitized display names, fixed-size content signatures, explicit unsupported formats, and opaque source IDs. Native paths remain only in a single backend registry and are cleared fail-visibly when the profile closes.\n- The authoritative actor receives only the redacted descriptor. Profile readiness waits for the acknowledged capability snapshot, and React waits for a newer Rust snapshot rather than mutating source state optimistically.\n- Tests cover cancellation, dialog failure, missing files, directories, empty/oversized files, Unicode bounds, deceptive extensions, malformed MP3 headers, canonicalization and permission failures, deterministic identities, registry rollback/clear, capability publication, and frontend cancellation/error behavior.\n- Automated validation passed source-size enforcement, generated-binding verification, frontend format/lint/typecheck/tests/build, Rust format/strict Clippy/tests/check, lockfile reproducibility, and Linux Tauri bundle creation. Native dialog interaction on a physical desktop session remains unclaimed.\n'''
          memory.write_text(memory.read_text().rstrip() + entry)
          PY

      - name: Commit completion evidence and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SILENT_DISCO_TAURI_DESKTOP_HOST_TODO.md memory.md
          git rm .github/workflows/finalize-desktop-block16-once.yml
          git commit -m "Complete Desktop Block 16 secure audio selection"
          git push origin HEAD:master

      - name: Publish validation result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh issue comment 45 --body "Desktop Block 16 final validation ${JOB_STATUS}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
