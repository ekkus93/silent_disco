name: Ralph desktop Block 10 diagnostics

on:
  pull_request:
    branches:
      - master
    paths:
      - "desktop/**"
      - ".github/workflows/ralph-desktop-block10-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ralph/desktop-block10
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Install Rust and Tauri dependencies
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.1
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget
      - name: Format and generate
        id: generate
        continue-on-error: true
        run: |
          cd desktop/src-tauri
          cargo fmt --all
          cargo generate-lockfile
          cd ..
          npm ci
          npm run bindings:generate
      - name: Compile and test
        id: validate
        continue-on-error: true
        run: |
          mkdir -p desktop/dist
          printf '<!doctype html><title>diagnostic</title>\n' > desktop/dist/index.html
          cd desktop/src-tauri
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
          cargo check --all-features
      - name: Upload formatted and generated outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ralph-desktop-block10-diagnostics
          path: |
            desktop/src-tauri/src/
            desktop/src-tauri/Cargo.lock
            desktop/src/core/generated/desktop-bindings.ts
          if-no-files-found: warn
          retention-days: 3
      - name: Fail when generation or validation failed
        if: steps.generate.outcome != 'success' || steps.validate.outcome != 'success'
        run: exit 1
