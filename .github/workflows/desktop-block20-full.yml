name: Validate Desktop Block 20 full repository

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/desktop-block20-full.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: desktop-block20-full-validation
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.1"
  NODE_VERSION: "22.16.0"
  TRACKING_ISSUE: "45"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out exact master input
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Capture exact input
        run: echo "BLOCK20_INPUT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Publish start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${TRACKING_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
            --body "Desktop Block 20 full validation started in Actions run ${GITHUB_RUN_ID} against direct-master input ${BLOCK20_INPUT}. No branch or PR is involved."

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy --component rustfmt
          rustup default "${RUST_VERSION}"

      - name: Format and synchronize lockfiles
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
          cp rust/Cargo.lock /tmp/block20-rust.Cargo.lock
          cp desktop/src-tauri/Cargo.lock /tmp/block20-desktop.Cargo.lock

      - name: Run focused transport tests
        working-directory: rust
        run: cargo test -p silent-disco-core transport -- --nocapture

      - name: Enforce tracked source-size invariant
        run: bash scripts/check-source-file-line-counts.sh

      - name: Run shared Rust strict gates
        working-directory: rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK and Linux Tauri packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf time wget

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify generated desktop bindings and frontend
        working-directory: desktop
        run: |
          mkdir -p dist
          printf '<!doctype html><title>Silent Disco Block 20 validation</title>\n' > dist/index.html
          npm ci
          npm run bindings:check
          npm run format:check
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Run desktop Rust strict gates
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
          cargo check --all-features

      - name: Build Linux desktop bundles
        working-directory: desktop
        run: npm run tauri build

      - name: Build Android variants and test APK
        run: |
          ./gradlew assembleDebug assemblePocDebug assembleRelease \
            assembleDebugAndroidTest --stacktrace --console=plain

      - name: Verify packaged Rust ABIs
        run: |
          set -euo pipefail
          apks=(
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/pocDebug/app-pocDebug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          )
          abis=(armeabi-v7a arm64-v8a x86 x86_64)
          for apk in "${apks[@]}"; do
            test -f "${apk}"
            for abi in "${abis[@]}"; do
              unzip -Z1 "${apk}" "lib/${abi}/libsilent_disco_ffi.so" \
                | grep -Fx "lib/${abi}/libsilent_disco_ffi.so"
            done
          done

      - name: Run Android unit tests and lint
        run: ./gradlew test lintDebug --stacktrace --console=plain

      - name: Run Android instrumentation suite
        run: |
          ./gradlew pixel2api29DebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=software \
            --stacktrace --console=plain

      - name: Require reproducible tracked lockfiles
        run: |
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
          cmp /tmp/block20-rust.Cargo.lock rust/Cargo.lock
          cmp /tmp/block20-desktop.Cargo.lock desktop/src-tauri/Cargo.lock
          git diff --exit-code -- desktop/package-lock.json tools/decoder-spike/Cargo.lock

      - name: Record Block 20 completion evidence
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          run_id = os.environ["GITHUB_RUN_ID"]
          input_sha = os.environ["BLOCK20_INPUT"]

          design_path = Path("docs/DESKTOP_BLOCK20_TRANSPORT_RUNTIME.md")
          design_path.write_text(f"""# Desktop Block 20 — Shared Transport Runtime

**Status:** Complete

## Delivered boundary

Shared Rust now owns production TCP control and UDP synchronization/audio transport semantics. The implementation provides bounded queues, protocol-v2 framing and limits, typed bind/connect/protocol/authorization failures, explicit delivery accounting, cooperative shutdown with deterministic worker joins, and an isolated injectable virtual transport/clock for Lab Mode.

Desktop-specific interface enumeration, bind selection, lifecycle orchestration, and playback integration remain assigned to later desktop blocks.

## Validation evidence

- GitHub Actions run: `{run_id}`
- Direct-master validated input: `{input_sha}`
- Focused coverage: socket multi-listener join/control/sync/audio exchange, unauthorized and malformed input rejection, bounded queue pressure, zero-peer accounting, production factory selection, virtual-network isolation, and injected clock behavior.
- Repository coverage: shared Rust strict gates, desktop frontend and Rust gates, Linux bundles, Android variants, four packaged Rust ABIs, Android unit/lint, and managed-device instrumentation.
""")

          desktop_path = Path("docs/SILENT_DISCO_TAURI_DESKTOP_HOST_TODO.md")
          desktop = desktop_path.read_text()
          start = desktop.index("## Block 20")
          candidates = [
              desktop.find("## Block 21", start),
              desktop.find("# Phase", start + 1),
          ]
          ends = [value for value in candidates if value != -1]
          end = min(ends) if ends else len(desktop)
          block = desktop[start:end]
          block = block.replace("- [ ]", "- [x]")
          evidence = (
              f"\n**Completion evidence:** Shared production socket and virtual transport semantics "
              f"passed GitHub Actions run `{run_id}` against direct-master input `{input_sha}`. "
              "See `docs/DESKTOP_BLOCK20_TRANSPORT_RUNTIME.md`.\n"
          )
          if "**Completion evidence:**" not in block:
              block = block.rstrip() + "\n" + evidence + "\n"
          desktop_path.write_text(desktop[:start] + block + desktop[end:])

          migration_path = Path("docs/SILENT_DISCO_RUST_CORE_MIGRATION_TODO.md")
          migration = migration_path.read_text()
          headings = [
              "## Block 19",
              "### 19.",
          ]
          start = -1
          for heading in headings:
              start = migration.find(heading)
              if start != -1:
                  break
          if start == -1:
              raise SystemExit("shared migration Block 19 heading not found")
          next_block = migration.find("## Block 20", start + 1)
          if next_block == -1:
              next_block = len(migration)
          section = migration[start:next_block]
          section = section.replace("- [ ]", "- [x]")
          if "Desktop Block 20 evidence" not in section:
              section = section.rstrip() + (
                  f"\n\n**Desktop Block 20 evidence:** Shared transport runtime passed Actions "
                  f"run `{run_id}` against direct-master input `{input_sha}`.\n\n"
              )
          migration_path.write_text(migration[:start] + section + migration[next_block:])

          memory_path = Path("memory.md")
          memory = memory_path.read_text().rstrip()
          memory += f"""

## 2026-07-30 — Desktop Block 20 shared transport runtime complete

- Shared Rust owns TCP control and UDP synchronization/audio runtime semantics.
- Protocol-v2 framing, bounds, peer authorization, delivery accounting, bounded queues, typed failures, deterministic shutdown/join, and isolated virtual transport/clock are covered.
- Desktop network-interface and bind-selection work remains in Block 21.
- Work was committed directly to `master`; no branch or PR was used.
- Validation run: `{run_id}`.
- Validated input commit: `{input_sha}`.
"""
          memory_path.write_text(memory)
          PY

      - name: Commit completion records and remove validator
        run: |
          set -euo pipefail
          git rm .github/workflows/desktop-block20-full.yml
          git rm --ignore-unmatch .github/desktop-block20-*.py
          git add rust/Cargo.lock desktop/src-tauri/Cargo.lock \
            docs/DESKTOP_BLOCK20_TRANSPORT_RUNTIME.md \
            docs/SILENT_DISCO_TAURI_DESKTOP_HOST_TODO.md \
            docs/SILENT_DISCO_RUST_CORE_MIGRATION_TODO.md memory.md
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Complete shared transport runtime (Desktop Block 20)"
          remote_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          parent_sha="$(git rev-parse HEAD^)"
          test "${remote_sha}" = "${parent_sha}"
          git push origin HEAD:master
          echo "BLOCK20_COMMIT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Publish success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${TRACKING_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
            --body "Desktop Block 20 passed in Actions run ${GITHUB_RUN_ID} and committed ${BLOCK20_COMMIT} directly to master. Shared socket/virtual transport, focused behavior tests, full Rust/desktop/Linux/Android/ABI/instrumentation gates, documentation, and temporary-file cleanup all passed."

      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${TRACKING_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
            --body "Desktop Block 20 full validation failed in Actions run ${GITHUB_RUN_ID} against ${BLOCK20_INPUT}. No completion evidence was written; continue directly on master from the first failed gate."
