name: One-time master connected tests on macOS

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: one-time-master-connected-macos
  cancel-in-progress: false

jobs:
  connected:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Run every connected Android instrumentation test
        id: connected
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -o pipefail
            ./gradlew connectedDebugAndroidTest --stacktrace --console=plain \
              2>&1 | tee master-connected-macos.log

      - name: Record result and remove one-time workflow
        if: always()
        shell: bash
        env:
          CONNECTED: ${{ steps.connected.outcome }}
        run: |
          set -euo pipefail
          git fetch origin master
          remote_head="$(git rev-parse origin/master)"
          failed=0
          if [ "${CONNECTED}" != "success" ] || [ "${remote_head}" != "${GITHUB_SHA}" ]; then
            failed=1
          fi

          rm -f .github/workflows/master-connected-macos-once.yml
          rm -rf .validation/master-full-validation
          rm -rf .validation/master-connected-diagnostic
          rm -rf .validation/master-connected-final
          rm -rf .validation/master-connected-macos

          if [ "${failed}" -ne 0 ]; then
            mkdir -p .validation/master-connected-macos
            {
              printf 'run_id=%s\n' "${GITHUB_RUN_ID}"
              printf 'tested_sha=%s\n' "${GITHUB_SHA}"
              printf 'connected=%s\n' "${CONNECTED}"
              printf 'remote_head=%s\n' "${remote_head}"
            } > .validation/master-connected-macos/result.txt
            if [ -f master-connected-macos.log ]; then
              tail -n 2500 master-connected-macos.log \
                > .validation/master-connected-macos/connected-tests-tail.log
            fi
            if [ -d app/build/outputs/androidTest-results ]; then
              tar -czf .validation/master-connected-macos/android-test-results.tar.gz \
                app/build/outputs/androidTest-results
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f .validation/master-connected-macos 2>/dev/null || true
          if [ "${failed}" -eq 0 ]; then
            git commit -m "Complete all connected tests on master"
          else
            git commit -m "Record macOS connected test failure on master"
          fi
          git push origin HEAD:master
          exit "${failed}"
