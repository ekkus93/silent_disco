name: Source file line limit

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: source-file-line-limit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-file-line-limit:
    name: Tracked source files stay below 800 lines
    # Keep push, manual, and PR validation off the owner's persistent machine.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Enforce source file line limit
        run: bash scripts/check-source-file-line-counts.sh
