name: Source file line limit

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: source-file-line-limit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-file-line-limit:
    name: Source files over the 800-line guideline (advisory)
    # Keep push, manual, and PR validation off the owner's persistent machine.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Report files over the 800-line guideline (never fails)
        run: bash scripts/check-source-file-line-counts.sh

      - name: Enforce hosted Ubuntu workflow runner policy
        run: |
          python3 scripts/test_check_hosted_runner_policy.py
          python3 scripts/check_hosted_runner_policy.py

      - name: Test objective listener PCM capture comparison
        run: python3 scripts/test_compare_pcm_capture.py
