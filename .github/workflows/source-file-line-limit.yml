name: Source file line limit

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: source-file-line-limit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-file-line-limit:
    name: Tracked source files stay below 800 lines
    # Never run untrusted pull-request code on the private self-hosted runner.
    # Trusted master pushes and manual validation use the labeled local runner.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || '["self-hosted","Linux","X64","silent-disco"]') }}
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Enforce source file line limit
        run: bash scripts/check-source-file-line-counts.sh
