name: Temporary Desktop Normalize PR38

on:
  push:
    branches:
      - chatgpt/fix-rust-ci-30332312110

permissions:
  contents: write

jobs:
  normalize-desktop:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-rust-ci-30332312110
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install pinned Rust formatter
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1

      - name: Generate exact lockfiles and formatting
        working-directory: desktop
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run format
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Commit normalized desktop tree
        run: |
          if git diff --quiet -- desktop; then
            echo "Desktop tree is already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop
          git commit -m "Normalize desktop dependencies and formatting"
          git push origin HEAD:chatgpt/fix-rust-ci-30332312110
