name: Inspect Block 13 UniFFI API

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/inspect-block13-uniffi-api.yml"

permissions:
  contents: write

concurrency:
  group: inspect-block13-uniffi-api
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Generate Kotlin bindings
        run: bash scripts/generate-uniffi-kotlin.sh "${GITHUB_WORKSPACE}/app/build/generated/uniffiKotlin"

      - name: Extract focused host API report
        shell: bash
        run: |
          set -euo pipefail
          generated_root="${GITHUB_WORKSPACE}/app/build/generated/uniffiKotlin"
          generated_file="$(find "${generated_root}" -type f -name '*.kt' -print -quit)"
          test -n "${generated_file}"
          mkdir -p docs/review-source
          python3 - "${generated_file}" docs/review-source/BLOCK13_GENERATED_UNIFFI_HOST_API.txt <<'PY'
          import sys
          from pathlib import Path

          source_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          lines = source_path.read_text(encoding="utf-8").splitlines()
          targets = [
              "class FfiCoreHandle",
              "interface FfiCoreObserver",
              "data class FfiJoinRequestInput",
              "data class FfiJoinRequest ",
          ]
          report = [
              f"Generated from: {source_path.name}",
              "Purpose: exact generated host-controller API for Desktop Block 13",
              "",
          ]

          for target in targets:
              matches = [index for index, line in enumerate(lines) if target in line]
              if len(matches) != 1:
                  raise SystemExit(f"target {target!r} matched {len(matches)} lines")
              start = matches[0]
              while start > 0 and lines[start - 1].lstrip().startswith(("@", "//")):
                  start -= 1
              depth = 0
              opened = False
              block = []
              for line in lines[start:]:
                  block.append(line)
                  depth += line.count("{") - line.count("}")
                  opened = opened or "{" in line
                  if opened and depth == 0:
                      break
              report.extend(block)
              report.append("")

          if len(report) > 700:
              raise SystemExit(f"focused generated API report has {len(report)} lines")
          output_path.write_text("\n".join(report) + "\n", encoding="utf-8")
          PY
          git diff --check

      - name: Commit focused declaration report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/review-source/BLOCK13_GENERATED_UNIFFI_HOST_API.txt
          git commit -m "Record generated Block 13 host API"
          for attempt in 1 2 3; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              exit 0
            fi
            printf 'Push attempt %s raced another master update; retrying.\n' "${attempt}" >&2
          done
          exit 1
