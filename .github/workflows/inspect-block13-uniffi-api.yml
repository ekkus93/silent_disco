name: Inspect Block 13 UniFFI API

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/inspect-block13-uniffi-api.yml"

permissions:
  contents: write

concurrency:
  group: inspect-block13-uniffi-api
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Generate Kotlin bindings
        run: bash scripts/generate-uniffi-kotlin.sh "${GITHUB_WORKSPACE}/app/build/generated/uniffiKotlin"

      - name: Extract public API declaration report
        shell: bash
        run: |
          set -euo pipefail
          generated_root="${GITHUB_WORKSPACE}/app/build/generated/uniffiKotlin"
          generated_file="$(find "${generated_root}" -type f -name '*.kt' -print -quit)"
          test -n "${generated_file}"
          mkdir -p docs/review-source
          python3 - "${generated_file}" docs/review-source/BLOCK13_GENERATED_UNIFFI_API.txt <<'PY'
          import re
          import sys
          from pathlib import Path

          source_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          lines = source_path.read_text(encoding="utf-8").splitlines()
          top_level = re.compile(
              r"^(data class|enum class|sealed class|interface|class) "
              r"(Ffi[A-Za-z0-9_]+)"
          )
          method_start = re.compile(r"^\s{4}(override )?fun [A-Za-z][A-Za-z0-9_]*\(")
          variant_start = re.compile(r"^\s{4}(data class|data object|object) [A-Z][A-Za-z0-9_]*")

          report = [
              f"Generated from: {source_path.name}",
              "Purpose: exact temporary UniFFI Kotlin API inspection for Desktop Block 13",
              "",
          ]
          index = 0
          while index < len(lines):
              line = lines[index]
              stripped = line.strip()
              if top_level.match(stripped) or method_start.match(line) or variant_start.match(line):
                  block = [line]
                  depth = line.count("(") - line.count(")")
                  continuation = line.rstrip().endswith(("(", ",")) or depth > 0
                  index += 1
                  while index < len(lines) and continuation:
                      next_line = lines[index]
                      block.append(next_line)
                      depth += next_line.count("(") - next_line.count(")")
                      continuation = depth > 0 or next_line.rstrip().endswith(",")
                      index += 1
                  report.extend(block)
                  report.append("")
                  continue
              index += 1

          if not any("FfiCoreHandle" in line for line in report):
              raise SystemExit("generated FfiCoreHandle declaration was not found")
          if len(report) > 700:
              raise SystemExit(f"generated API report has {len(report)} lines")
          output_path.write_text("\n".join(report) + "\n", encoding="utf-8")
          PY
          git diff --check

      - name: Commit declaration report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/review-source/BLOCK13_GENERATED_UNIFFI_API.txt
          git commit -m "Record generated Block 13 UniFFI API"
          for attempt in 1 2 3; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              exit 0
            fi
            printf 'Push attempt %s raced another master update; retrying.\n' "${attempt}" >&2
          done
          exit 1
