name: Diagnose Desktop Block 19 desktop Rust

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/desktop-block19.yml

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustup default 1.97.1

      - name: Run desktop Clippy with compact diagnostics
        id: clippy
        continue-on-error: true
        run: |
          set +e
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml \
            --all-targets --all-features --message-format=short -- -D warnings \
            > /tmp/desktop-clippy.log 2>&1
          status=$?
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          tail -100 /tmp/desktop-clippy.log > /tmp/desktop-clippy-tail.log

      - name: Publish exact diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Desktop Block 19 desktop Clippy diagnostic:'
            echo '```text'
            cat /tmp/desktop-clippy-tail.log
            echo '```'
          } > /tmp/comment.md
          gh issue comment 45 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/comment.md
          test "${{ steps.clippy.outputs.status }}" = 0
