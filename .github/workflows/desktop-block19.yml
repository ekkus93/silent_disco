name: Repair Desktop Block 19 focused build

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/desktop-block19.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: desktop-block19-focused-repair
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.1"
  TRACKING_ISSUE: "45"

jobs:
  repair-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact master input
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Capture exact input
        run: echo "BLOCK19_INPUT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Apply missing resampler import
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("rust/silent-disco-core/src/audio/decoder.rs")
          text = path.read_text()
          needle = "use super::source::{\n"
          replacement = "use super::resampler::StereoResampler;\nuse super::source::{\n"
          if "use super::resampler::StereoResampler;" not in text:
              if text.count(needle) != 1:
                  raise SystemExit("decoder import boundary changed unexpectedly")
              path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy --component rustfmt
          rustup default "${RUST_VERSION}"

      - name: Format, lock, and run focused decoder tests
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo test --manifest-path rust/Cargo.toml -p silent-disco-core audio -- --nocapture

      - name: Commit focused repair directly to master
        run: |
          set -euo pipefail
          git rm --ignore-unmatch .github/workflows/desktop-block19-repair.yml
          git add rust/silent-disco-core/src/audio/decoder.rs rust/Cargo.lock
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Repair Desktop Block 19 focused decoder build"
          remote_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          parent_sha="$(git rev-parse HEAD^)"
          test "${remote_sha}" = "${parent_sha}"
          git push origin HEAD:master
          echo "REPAIR_COMMIT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Publish focused repair success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${TRACKING_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
            --body "Desktop Block 19 focused decoder build passed in Actions run ${GITHUB_RUN_ID}; repair commit ${REPAIR_COMMIT} was pushed directly to master. Full repository validation remains pending."

      - name: Publish focused repair failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${TRACKING_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
            --body "Desktop Block 19 focused decoder repair failed in Actions run ${GITHUB_RUN_ID} against ${BLOCK19_INPUT}."

