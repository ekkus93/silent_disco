name: Diagnose Desktop Block 19 desktop Rust

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/desktop-block19.yml

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustup default 1.97.1

      - name: Install Linux Tauri development packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Prepare Tauri frontend fixture
        run: |
          mkdir -p desktop/dist
          printf '<!doctype html><title>Desktop Clippy diagnostic</title>\n' > desktop/dist/index.html

      - name: Run desktop Clippy with full panic diagnostics
        id: clippy
        continue-on-error: true
        env:
          RUST_BACKTRACE: "1"
        run: |
          set +e
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml \
            --all-targets --all-features -- -D warnings \
            > /tmp/desktop-clippy.log 2>&1
          status=$?
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          tail -160 /tmp/desktop-clippy.log > /tmp/desktop-clippy-tail.log

      - name: Publish exact diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Desktop Block 19 desktop Clippy diagnostic with Tauri frontend fixture:'
            echo '```text'
            cat /tmp/desktop-clippy-tail.log
            echo '```'
          } > /tmp/comment.md
          gh issue comment 45 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/comment.md
          test "${{ steps.clippy.outputs.status }}" = 0
