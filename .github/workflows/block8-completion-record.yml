name: Block 8 completion record

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  record:
    if: github.event.pull_request.head.ref == 'docs/rust-storage-block8-record'
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: docs/rust-storage-block8-record
          fetch-depth: 0

      - name: Record verified Block 8 completion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          todo_path = Path("docs/SILENT_DISCO_RUST_CORE_MIGRATION_TODO.md")
          todo = todo_path.read_text(encoding="utf-8")
          start_marker = "## Block 8 — Implement schema and migrations"
          end_marker = "## Block 9 — Integrate Rust database with Android and migrate current persisted data"
          start = todo.index(start_marker)
          end = todo.index(end_marker)
          block = todo[start:end]
          unchecked = block.count("- [ ]")
          if unchecked != 26:
              raise RuntimeError(f"expected 26 unchecked Block 8 tasks, found {unchecked}")
          block = block.replace("- [ ]", "- [x]")
          acceptance = "**Acceptance:** All database tests pass using temporary files, not only `:memory:` databases."
          status = (
              acceptance
              + "\n\n**Implementation status:** Complete. PR #31 merged as "
              + "`4dd2de7c54942f047d4fd47ca8c73ae73721fabe`. Guarded validation run "
              + "`30184437336` passed Rust formatting, strict Clippy, all Rust tests, "
              + "Android debug/PoC-debug/release/instrumentation builds, four-ABI JNI packaging, "
              + "Android unit tests, and Android lint. Android database path selection and "
              + "legacy `SharedPreferences` import remain Block 9."
          )
          if block.count(acceptance) != 1:
              raise RuntimeError("Block 8 acceptance marker did not match exactly")
          block = block.replace(acceptance, status)
          todo_path.write_text(todo[:start] + block + todo[end:], encoding="utf-8")

          memory_path = Path("memory.md")
          memory = memory_path.read_text(encoding="utf-8")
          heading = "# memory.md — `silent_disco`\n"
          if not memory.startswith(heading):
              raise RuntimeError("memory.md heading did not match")
          entry = """

          ## 2026-07-26T02:32:00Z - GPT-5.6 Thinking - Rust schema and migrations Block 8 complete

          - Added ordered immutable Rust migrations with explicit versions and SHA-256 checksums. `schema_migrations` records version, application timestamp, and checksum; checksum mismatch, unsupported newer schemas, and failed transactional migrations are fatal and never trigger automatic delete/recreate behavior.
          - Added the strict initial SQLite schema for application settings, trusted devices, session history, and diagnostic runs, including required constraints, indexes, and foreign keys.
          - Added typed repositories for settings, trusted devices, session lifecycle records, and diagnostic summaries. Raw SQL and the SQLite connection remain private to the Rust storage worker and never cross FFI.
          - Added temporary-file database tests for empty-to-latest migration, reopen, rollback, checksum mismatch, newer-schema rejection, constraint mapping, worker request ordering, Unicode names, and binary public keys.
          - PR #31 merged as `4dd2de7c54942f047d4fd47ca8c73ae73721fabe`. Guarded validation run `30184437336` passed Rust formatting, Clippy with warnings denied, all Rust tests, debug/PoC-debug/release and instrumentation APK builds, four-ABI Rust packaging checks, Android unit tests, and Android lint.
          - Block 8 does not select the Android database path or import legacy `SharedPreferences`; those remain explicit Block 9 work with no fallback to duplicate Kotlin persistence.
          """
          entry = "\n".join(line[10:] if line.startswith("          ") else line for line in entry.splitlines())
          memory_path.write_text(heading + entry + memory[len(heading):], encoding="utf-8")
          PY

      - name: Verify documentation patch
        run: |
          git diff --check
          grep -F '**Implementation status:** Complete. PR #31 merged as' docs/SILENT_DISCO_RUST_CORE_MIGRATION_TODO.md
          grep -F 'Rust schema and migrations Block 8 complete' memory.md

      - name: Remove workflow and commit record
        run: |
          rm .github/workflows/block8-completion-record.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record Rust storage Block 8 completion"
          git push origin HEAD:docs/rust-storage-block8-record
