name: Fix Block 13 Rust and Rerun Transport

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/fix-block13-rust-and-rerun-transport.yml"

permissions:
  actions: write
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix remaining Rust compile errors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "rust/silent-disco-core/src/runtime/records.rs",
              "AudioSourceDescriptor, CapabilitySnapshot, CoreDiagnostic, DeliveryReport, HostDraft,",
              "AudioSourceDescriptor, CapabilitySnapshot, DeliveryReport, HostDraft,",
          )
          replace_once(
              "rust/silent-disco-ffi/src/host_control/handle.rs",
              "CoreCommandRequest, HostDraftPatch, InviteCodePatch, JoinRequestSummary, ListenerSummary,",
              "CoreCommandRequest, CoreNotification, HostDraftPatch, InviteCodePatch, JoinRequestSummary, ListenerSummary,",
          )
          replace_once(
              "rust/silent-disco-ffi/src/host_control/handle.rs",
              "move |notification| {",
              "move |notification: CoreNotification| {",
          )
          replace_once(
              "rust/silent-disco-ffi/src/host_control/handle.rs",
              "#[uniffi::export]\nimpl FfiCoreHandle {",
              """#[allow(
              clippy::missing_errors_doc,
              reason = "all exported methods use the uniform validated FfiBridgeError contract"
          )]
          #[uniffi::export]
          impl FfiCoreHandle {""",
          )
          replace_once(
              "rust/silent-disco-ffi/src/host_control/handle.rs",
              """fn observer_callback_error() -> CoreError {
              CoreError {
                  code: CoreErrorCode::FfiCallbackFailed,
                  message: "foreign core observer rejected a notification".to_owned(),
                  subsystem: CoreErrorCode::FfiCallbackFailed.subsystem(),
                  severity: ErrorSeverity::Fatal,
                  retryable: true,
                  operation_id: None,
                  context: Vec::new(),
              }
          }
          """,
              """fn observer_callback_error() -> CoreError {
              CoreError::new(
                  CoreErrorCode::FfiCallbackFailed,
                  "foreign core observer rejected a notification",
                  ErrorSeverity::Fatal,
                  true,
                  None,
              )
              .expect("static observer callback error must satisfy the bounded error contract")
          }
          """,
          )
          replace_once(
              "rust/silent-disco-core/tests/host_block12_actor_tuning.rs",
              "request => panic!(\"unexpected storage effect: {request:?}\"),",
              "request @ StorageEffectRequest::PersistTrustedDevice { .. } => {\n            panic!(\"unexpected storage effect: {request:?}\")\n        }",
          )
          replace_once(
              "rust/silent-disco-ffi/src/host_control/conversions.rs",
              """    AppRole, ApprovalMode, HostLifecycle, PlaybackState, TransportState, TrustState, TuningSettings,
          """,
              """    AppRole, ApprovalMode, HostLifecycle, MonotonicMillis, OperationId, PlaybackState,
              TransportState, TrustState, TuningSettings,
          """,
          )
          replace_once(
              "rust/silent-disco-ffi/src/host_control/conversions.rs",
              "value.operation_id.map(|value| value.into_string())",
              "value.operation_id.map(OperationId::into_string)",
          )
          replace_once(
              "rust/silent-disco-ffi/src/host_control/conversions.rs",
              "value.last_contact.map(|value| value.get())",
              "value.last_contact.map(MonotonicMillis::get)",
          )
          replace_once(
              "rust/silent-disco-ffi/src/host_control/types.rs",
              "#[derive(Debug, Clone, PartialEq, uniffi::Enum)]\npub enum FfiCoreNotification {",
              """#[allow(
              clippy::large_enum_variant,
              reason = "UniFFI rich enums require owned record payloads at the foreign boundary"
          )]
          #[derive(Debug, Clone, PartialEq, uniffi::Enum)]
          pub enum FfiCoreNotification {""",
          )
          replace_once(
              "rust/silent-disco-ffi/src/host_control/types.rs",
              """#[uniffi::export(with_foreign)]
          pub trait FfiCoreObserver: Send + Sync {
              fn on_notification(&self, notification: FfiCoreNotification) -> Result<(), FfiBridgeError>;
          }
          """,
              """#[uniffi::export(with_foreign)]
          pub trait FfiCoreObserver: Send + Sync {
              /// Accepts one serialized notification from the authoritative Rust actor.
              ///
              /// # Errors
              ///
              /// Returns [`FfiBridgeError`] when the foreign observer cannot accept the notification.
              fn on_notification(&self, notification: FfiCoreNotification) -> Result<(), FfiBridgeError>;
          }
          """,
          )
          PY
          git rm .github/workflows/fix-block13-rust-and-rerun-transport.yml
          cd rust
          cargo fmt --all
          cd ..
          git diff --check

      - name: Verify Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          cd rust
          cargo +1.97.1 fmt --all -- --check
          cargo +1.97.1 clippy --workspace --all-targets --all-features -- -D warnings
          cargo +1.97.1 test --workspace --all-features

      - name: Commit Rust repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust
          git commit -m "Fix remaining UniFFI compile errors"
          git push origin HEAD:master

      - name: Rerun targeted transport implementation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-block13-targeted-transport.yml --ref master
