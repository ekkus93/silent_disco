name: Record oversized refactor memory

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/record-oversized-refactor-memory.yml"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Append durable completion record
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("memory.md")
          source = path.read_text(encoding="utf-8")
          heading = "## 2026-07-28 - GPT-5.6 Thinking - Oversized source-file refactor complete"
          if heading not in source:
              record = """

## 2026-07-28 - GPT-5.6 Thinking - Oversized source-file refactor complete

- Completed `docs/OVERSIZED_SOURCE_FILES_SPLIT_REFACTOR_TODO.md` as five separately validated implementation tasks on `master`.
- Task 1: `5bac13879e223841d8625c713b56af574667e0de` split `MainViewModel.kt` into focused action, transport, synchronization, playback, persistence, diagnostics, demo, and support files while preserving public member action methods.
- Task 2: `7dd779d23a4c411462a796c63693d21913c4e0c0` split the Rust database worker into client, lifecycle, module, and test files.
- Task 3: `7be020c4e4e9fd2103698b0d84aee6511098bda8` split the protocol codec into encoding, decoding, module, and test files.
- Task 4: `edf5db368af48c42581611a2f684357e4d966308` split actor state by command, platform, transport, audio, storage, and support responsibilities.
- Task 5: `e43f750e402b707c8029bbdd96654e8174240242` split the Android database ABI into registry/conversion logic, JNI exports, and tests.
- All 30 resulting target source files are below 800 physical lines; the largest is `rust/silent-disco-core/src/storage/worker/mod.rs` at 623 lines.
- Before each implementation commit and once again after all five were combined, the following passed: Rust formatting, strict Clippy with warnings denied, all Rust workspace tests, Android debug assembly, Android unit tests, and Android lint.
- Final completion and exact per-file line counts are recorded by commit `fc28ac2f725a69eb8106096a04f40b6d10f44521` in the TODO document.
- The refactors introduced no dependency changes and committed no generated `Cargo.lock` change. Temporary workflows, transformers, and failure reports were removed.
"""
              path.write_text(source.rstrip() + record, encoding="utf-8")
          PY

          rm .github/workflows/record-oversized-refactor-memory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Record oversized source refactor in project memory"
          git push origin HEAD:master
