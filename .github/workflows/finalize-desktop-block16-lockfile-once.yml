name: Finalize Desktop Block 16 lockfile once

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/finalize-desktop-block16-lockfile-once.yml"

permissions:
  contents: write

concurrency:
  group: finalize-desktop-block16-lockfile-once
  cancel-in-progress: false

jobs:
  finalize:
    name: Generate and commit exact Cargo lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Generate exact desktop Cargo lockfile
        working-directory: desktop/src-tauri
        run: cargo generate-lockfile

      - name: Commit lockfile and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src-tauri/Cargo.lock
          git rm .github/workflows/finalize-desktop-block16-lockfile-once.yml
          git commit -m "Finalize Desktop Block 16 lockfile"
          git push origin HEAD:master
