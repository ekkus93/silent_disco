name: Agent refresh desktop Cargo lock

on:
  push:
    branches:
      - agent/lab-live-transport
    paths:
      - ".github/workflows/agent-refresh-desktop-cargo-lock.yml"

permissions:
  contents: write

env:
  RUST_VERSION: "1.97.1"

jobs:
  refresh:
    name: Regenerate committed desktop Cargo lock
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/lab-live-transport

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      - name: Regenerate Cargo lockfile
        working-directory: desktop/src-tauri
        run: cargo generate-lockfile

      - name: Commit exact generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- desktop/src-tauri/Cargo.lock; then
            echo "Cargo.lock is already exact."
            exit 0
          fi
          git diff --check -- desktop/src-tauri/Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src-tauri/Cargo.lock
          git commit -m "Refresh desktop Cargo lock"
          git push origin HEAD:agent/lab-live-transport
