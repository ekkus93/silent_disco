name: Finalize Rust Android integration block

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  finalize:
    if: github.repository == 'ekkus93/silent_disco'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Mark verified Block 3 tasks and record device blocker
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          todo_path = Path('docs/SILENT_DISCO_RUST_CORE_MIGRATION_TODO.md')
          todo = todo_path.read_text()
          completed = [
              'Build Rust for each Android ABI currently supported by the application.',
              'Integrate the build through Gradle; no manual `.so` copying.',
              "Reuse the repository's pinned Android NDK version.",
              'Ensure debug and release variants select intentional Rust profiles.',
              'Add a clean task that removes generated native output safely.',
              'Add a Kotlin/JNI or small C++ bridge call that reads the version.',
              'Do not call this from the real-time path.',
              'Fail visibly if the library cannot load or returns an unsupported version.',
              'Test reports the device ABI in failure output.',
              'Remove any fallback that returns a hard-coded successful version when native loading fails.',
          ]
          for item in completed:
              old = f'- [ ] {item}'
              new = f'- [x] {item}'
              if todo.count(old) != 1:
                  raise SystemExit(f'expected exactly one unchecked task: {old!r}')
              todo = todo.replace(old, new, 1)

          still_open = [
              '- [ ] Test loads the Rust library on a physical Android device.',
              '- [ ] Test verifies the ABI version.',
          ]
          for item in still_open:
              if todo.count(item) != 1:
                  raise SystemExit(f'physical-device task unexpectedly changed: {item!r}')

          todo_path.write_text(todo)

          memory_path = Path('memory.md')
          memory = memory_path.read_text()
          timestamp = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          entry = f'''## {timestamp} - GPT-5.6 Thinking - Block 3 Rust Android integration code complete

          - Added a Gradle-owned Rust Android build using pinned Rust 1.97.1, cargo-ndk 4.1.2, Android NDK 28.2.13676358, and minSdk/platform 29.
          - Explicitly builds and packages `libsilent_disco_ffi.so` for `armeabi-v7a`, `arm64-v8a`, `x86`, and `x86_64` in debug, PoC-debug, and release APKs. Generated libraries stay under `app/build/generated/rustJniLibs`; `cleanRustAndroid` deletes only that generated tree.
          - Added the Rust C ABI version export and direct JNI entry point, plus `RustCoreBridge` with explicit load/version exceptions and no hard-coded success fallback. The bridge is control-plane/startup-only and is not called from the real-time audio path.
          - Added JVM ABI validation tests and `RustCoreBridgeInstrumentedTest`, which includes `Build.SUPPORTED_ABIS` in failure output.
          - CI run `30167855172` passed Rust formatting, Clippy with warnings denied, Rust tests, all Android APK builds, four-ABI APK packaging checks, Android unit tests, and Android lint on the same revision.
          - The instrumented native-load/version test has not been executed here because no physical Android device is attached. The two physical-device tasks and Block 3 acceptance remain open. Run `./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.ekkus.silentdisco.core.rust.RustCoreBridgeInstrumentedTest` on a device and record the model, Android version, ABI, and result before proceeding past this gate.

          '''
          prefix = '# memory.md — `silent_disco`\n\n'
          memory_path.write_text(prefix + entry + memory.removeprefix(prefix))
          PY

          rm -f .github/workflows/finalize-rust-android-block.yml
          git diff --check

      - name: Commit verified Block 3 progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SILENT_DISCO_RUST_CORE_MIGRATION_TODO.md memory.md .github/workflows/
          git commit -m "Record verified Rust Android integration progress"
          git push origin HEAD:master
