name: Temporary PR38 Tauri Icon Generator

on:
  push:
    branches:
      - chatgpt/fix-rust-ci-30332312110

permissions:
  contents: write

jobs:
  generate-icon:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-rust-ci-30332312110
          fetch-depth: 0

      - name: Generate deterministic RGBA PNG
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import struct
          import zlib

          width = 512
          height = 512
          center = width // 2
          rows = bytearray()

          for y in range(height):
              rows.append(0)
              dy = y - center
              for x in range(width):
                  dx = x - center
                  radius2 = dx * dx + dy * dy
                  if radius2 < 76 * 76:
                      rgba = (245, 158, 11, 255)
                  elif radius2 < 132 * 132:
                      rgba = (34, 211, 238, 255)
                  elif radius2 < 190 * 190 and ((x + y) // 18) % 2 == 0:
                      rgba = (168, 85, 247, 255)
                  else:
                      rgba = (17, 24, 39, 255)
                  rows.extend(rgba)

          def chunk(kind: bytes, payload: bytes) -> bytes:
              return (
                  struct.pack('>I', len(payload))
                  + kind
                  + payload
                  + struct.pack('>I', zlib.crc32(kind + payload) & 0xFFFFFFFF)
              )

          png = (
              b'\x89PNG\r\n\x1a\n'
              + chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0))
              + chunk(b'IDAT', zlib.compress(bytes(rows), level=9))
              + chunk(b'IEND', b'')
          )
          output = Path('desktop/src-tauri/icons/icon.png')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_bytes(png)
          if output.read_bytes()[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('generated icon is not a PNG')
          PY
          file desktop/src-tauri/icons/icon.png

      - name: Commit icon and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-pr38-actor-clippy-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src-tauri/icons/icon.png
          git commit -m "Add Tauri application icon"
          git push origin HEAD:chatgpt/fix-rust-ci-30332312110
