name: Ralph oversized source refactor

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/ralph-oversized-refactor.yml"

permissions:
  contents: write

concurrency:
  group: ralph-oversized-refactor-master
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.1"
  VETTED_SPLIT_COMMIT: "486f2df79ed407620771c08033c6e2002b557548"
  TODO_PATH: "docs/OVERSIZED_SOURCE_FILES_SPLIT_REFACTOR_TODO.md"

jobs:
  ralph-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure validation toolchains
        shell: bash
        run: |
          set -euo pipefail
          java -version
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy --component rustfmt
          rustup default "${RUST_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Execute five independently validated refactor tasks
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/ralph-oversized-refactor.log) 2>&1
          trap 'status=$?; echo "FAILED_COMMAND=${BASH_COMMAND}"; echo "EXIT_STATUS=${status}"; exit ${status}' ERR

          validate_all() {
            echo "=== Rust formatting ==="
            (
              cd rust
              cargo fmt --all
              cargo fmt --all -- --check
              echo "=== Rust Clippy ==="
              cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
              echo "=== Rust tests ==="
              cargo test --locked --workspace --all-features
            )
            echo "=== Android build, unit tests, and lint ==="
            ./gradlew assembleDebug test lintDebug --stacktrace --console=plain
          }

          assert_under_800() {
            local label="$1"
            shift
            local failed=0
            echo "=== ${label} line counts ==="
            for file in "$@"; do
              test -f "${file}"
              local lines
              lines=$(wc -l < "${file}")
              printf '%4d %s\n' "${lines}" "${file}"
              if (( lines >= 800 )); then
                echo "ERROR: ${file} has ${lines} lines; target is fewer than 800"
                failed=1
              fi
            done
            test "${failed}" -eq 0
          }

          commit_task() {
            local message="$1"
            git add -A
            git diff --cached --check
            test -n "$(git status --porcelain)"
            git commit -m "${message}"
            git push origin HEAD:master
            git rev-parse HEAD >> /tmp/oversized-refactor-shas
          }

          echo "=== TASK 1: MainViewModel.kt ==="
          git checkout "${VETTED_SPLIT_COMMIT}" -- \
            app/src/main/java/com/ekkus/silentdisco/app/MainViewModel.kt \
            app/src/main/java/com/ekkus/silentdisco/app/MainViewModelAudioPipeline.kt \
            app/src/main/java/com/ekkus/silentdisco/app/MainViewModelDemo.kt \
            app/src/main/java/com/ekkus/silentdisco/app/MainViewModelDiagnostics.kt \
            app/src/main/java/com/ekkus/silentdisco/app/MainViewModelHostPlayback.kt \
            app/src/main/java/com/ekkus/silentdisco/app/MainViewModelListenerPlayback.kt \
            app/src/main/java/com/ekkus/silentdisco/app/MainViewModelPersistence.kt \
            app/src/main/java/com/ekkus/silentdisco/app/MainViewModelSupport.kt \
            app/src/main/java/com/ekkus/silentdisco/app/MainViewModelSynchronization.kt \
            app/src/main/java/com/ekkus/silentdisco/app/MainViewModelTransport.kt

          python3 - <<'PY'
          from __future__ import annotations

          import re
          from dataclasses import dataclass
          from pathlib import Path

          path = Path("app/src/main/java/com/ekkus/silentdisco/app/MainViewModel.kt")
          source = path.read_text(encoding="utf-8")

          def mask_non_code(text: str) -> str:
              output = list(text)
              state = "code"
              block_depth = 0
              index = 0
              while index < len(text):
                  def blank(position: int) -> None:
                      if text[position] != "\n":
                          output[position] = " "

                  if state == "line_comment":
                      blank(index)
                      if text[index] == "\n":
                          state = "code"
                      index += 1
                      continue
                  if state == "block_comment":
                      if text.startswith("/*", index):
                          blank(index); blank(index + 1)
                          block_depth += 1
                          index += 2
                          continue
                      if text.startswith("*/", index):
                          blank(index); blank(index + 1)
                          block_depth -= 1
                          index += 2
                          if block_depth == 0:
                              state = "code"
                          continue
                      blank(index)
                      index += 1
                      continue
                  if state == "string":
                      blank(index)
                      if text[index] == "\\" and index + 1 < len(text):
                          blank(index + 1)
                          index += 2
                      elif text[index] == '"':
                          state = "code"
                          index += 1
                      else:
                          index += 1
                      continue
                  if state == "triple":
                      if text.startswith('"""', index):
                          blank(index); blank(index + 1); blank(index + 2)
                          index += 3
                          state = "code"
                      else:
                          blank(index)
                          index += 1
                      continue
                  if state == "char":
                      blank(index)
                      if text[index] == "\\" and index + 1 < len(text):
                          blank(index + 1)
                          index += 2
                      elif text[index] == "'":
                          state = "code"
                          index += 1
                      else:
                          index += 1
                      continue

                  if text.startswith("//", index):
                      blank(index); blank(index + 1)
                      state = "line_comment"
                      index += 2
                  elif text.startswith("/*", index):
                      blank(index); blank(index + 1)
                      state = "block_comment"
                      block_depth = 1
                      index += 2
                  elif text.startswith('"""', index):
                      blank(index); blank(index + 1); blank(index + 2)
                      state = "triple"
                      index += 3
                  elif text[index] == '"':
                      blank(index)
                      state = "string"
                      index += 1
                  elif text[index] == "'":
                      blank(index)
                      state = "char"
                      index += 1
                  else:
                      index += 1
              if state not in {"code", "line_comment"}:
                  raise RuntimeError(f"unterminated Kotlin lexical state: {state}")
              return "".join(output)

          def matching_brace(masked: str, opening: int) -> int:
              depth = 0
              for index in range(opening, len(masked)):
                  if masked[index] == "{":
                      depth += 1
                  elif masked[index] == "}":
                      depth -= 1
                      if depth == 0:
                          return index
              raise RuntimeError(f"unmatched opening brace at {opening}")

          @dataclass(frozen=True)
          class Move:
              declaration: str
              wrapper: str | None
              implementation_declaration: str
              destination: str

          moves = [
              Move(
                  "    fun createHostSession(): Boolean {",
                  "    fun createHostSession(): Boolean = createHostSessionImpl()\n",
                  "internal fun MainViewModel.createHostSessionImpl(): Boolean {",
                  "MainViewModelHostActions.kt",
              ),
              Move(
                  "    fun approveJoinRequest(request: JoinRequest) {",
                  "    fun approveJoinRequest(request: JoinRequest) = approveJoinRequestImpl(request)\n",
                  "internal fun MainViewModel.approveJoinRequestImpl(request: JoinRequest) {",
                  "MainViewModelHostActions.kt",
              ),
              Move(
                  "    fun rejectJoinRequest(request: JoinRequest) {",
                  "    fun rejectJoinRequest(request: JoinRequest) = rejectJoinRequestImpl(request)\n",
                  "internal fun MainViewModel.rejectJoinRequestImpl(request: JoinRequest) {",
                  "MainViewModelHostActions.kt",
              ),
              Move(
                  "    fun startHostPlayback() {",
                  "    fun startHostPlayback() = startHostPlaybackImpl()\n",
                  "internal fun MainViewModel.startHostPlaybackImpl() {",
                  "MainViewModelHostActions.kt",
              ),
              Move(
                  "    fun pauseHostPlayback() {",
                  "    fun pauseHostPlayback() = pauseHostPlaybackImpl()\n",
                  "internal fun MainViewModel.pauseHostPlaybackImpl() {",
                  "MainViewModelHostActions.kt",
              ),
              Move(
                  "    fun stopHostPlayback() {",
                  "    fun stopHostPlayback() = stopHostPlaybackImpl()\n",
                  "internal fun MainViewModel.stopHostPlaybackImpl() {",
                  "MainViewModelHostActions.kt",
              ),
              Move(
                  "    fun endSession() {",
                  "    fun endSession() = endSessionImpl()\n",
                  "internal fun MainViewModel.endSessionImpl() {",
                  "MainViewModelHostActions.kt",
              ),
              Move(
                  "    fun scanForSessions() {",
                  "    fun scanForSessions() = scanForSessionsImpl()\n",
                  "internal fun MainViewModel.scanForSessionsImpl() {",
                  "MainViewModelListenerActions.kt",
              ),
              Move(
                  "    fun requestJoin() {",
                  "    fun requestJoin() = requestJoinImpl()\n",
                  "internal fun MainViewModel.requestJoinImpl() {",
                  "MainViewModelListenerActions.kt",
              ),
              Move(
                  "    internal fun startTransportListenerPlayback(sessionId: SessionId, streamId: StreamId, format: AudioFormatSpec = AudioFormatSpec()) {",
                  None,
                  "internal fun MainViewModel.startTransportListenerPlayback(sessionId: SessionId, streamId: StreamId, format: AudioFormatSpec = AudioFormatSpec()) {",
                  "MainViewModelListenerActions.kt",
              ),
          ]

          prefix = source[: source.index("class MainViewModel")]
          generated: dict[str, list[str]] = {}

          for move in moves:
              masked = mask_non_code(source)
              start = masked.find(move.declaration)
              if start < 0:
                  raise RuntimeError(f"method declaration not found: {move.declaration}")
              opening = masked.find("{", start)
              closing = matching_brace(masked, opening)
              end = closing + 1
              while end < len(source) and source[end] in " \t":
                  end += 1
              if end < len(source) and source[end] == "\n":
                  end += 1
              block = source[start:end]
              dedented = "\n".join(
                  line[4:] if line.startswith("    ") else line
                  for line in block.rstrip().splitlines()
              )
              declaration_without_indent = move.declaration[4:]
              if dedented.count(declaration_without_indent) != 1:
                  raise RuntimeError(f"implementation declaration count changed for {move.declaration}")
              implementation = dedented.replace(
                  declaration_without_indent,
                  move.implementation_declaration,
                  1,
              )
              generated.setdefault(move.destination, []).append(implementation)
              replacement = move.wrapper or ""
              source = source[:start] + replacement + source[end:]

          path.write_text(re.sub(r"\n{3,}", "\n\n", source).rstrip() + "\n", encoding="utf-8")
          directory = path.parent
          for filename, implementations in generated.items():
              content = prefix.rstrip() + "\n\n" + "\n\n".join(implementations) + "\n"
              (directory / filename).write_text(content, encoding="utf-8")
          PY

          mapfile -t task1_files < <(find app/src/main/java/com/ekkus/silentdisco/app -maxdepth 1 -type f -name 'MainViewModel*.kt' | sort)
          assert_under_800 "Task 1 MainViewModel files" "${task1_files[@]}"
          validate_all
          commit_task "Refactor MainViewModel into focused action modules"

          echo "=== TASK 2: storage/worker.rs ==="
          git rm rust/silent-disco-core/src/storage/worker.rs
          git checkout "${VETTED_SPLIT_COMMIT}" -- \
            rust/silent-disco-core/src/storage/worker/client.rs \
            rust/silent-disco-core/src/storage/worker/lifecycle.rs \
            rust/silent-disco-core/src/storage/worker/mod.rs \
            rust/silent-disco-core/src/storage/worker/tests.rs
          mapfile -t task2_files < <(find rust/silent-disco-core/src/storage/worker -maxdepth 1 -type f -name '*.rs' | sort)
          assert_under_800 "Task 2 storage worker files" "${task2_files[@]}"
          validate_all
          commit_task "Split database worker by client and lifecycle responsibilities"

          echo "=== TASK 3: protocol/codec.rs ==="
          git rm rust/silent-disco-core/src/protocol/codec.rs
          git checkout "${VETTED_SPLIT_COMMIT}" -- \
            rust/silent-disco-core/src/protocol/codec/decoding.rs \
            rust/silent-disco-core/src/protocol/codec/encoding.rs \
            rust/silent-disco-core/src/protocol/codec/mod.rs \
            rust/silent-disco-core/src/protocol/codec/tests.rs
          mapfile -t task3_files < <(find rust/silent-disco-core/src/protocol/codec -maxdepth 1 -type f -name '*.rs' | sort)
          assert_under_800 "Task 3 protocol codec files" "${task3_files[@]}"
          validate_all
          commit_task "Split protocol codec into encoding and decoding modules"

          echo "=== TASK 4: actor_runtime/state.rs ==="
          git rm rust/silent-disco-core/src/runtime/actor_runtime/state.rs
          git checkout "${VETTED_SPLIT_COMMIT}" -- \
            rust/silent-disco-core/src/runtime/actor_runtime/state/audio.rs \
            rust/silent-disco-core/src/runtime/actor_runtime/state/commands.rs \
            rust/silent-disco-core/src/runtime/actor_runtime/state/mod.rs \
            rust/silent-disco-core/src/runtime/actor_runtime/state/platform.rs \
            rust/silent-disco-core/src/runtime/actor_runtime/state/storage.rs \
            rust/silent-disco-core/src/runtime/actor_runtime/state/support.rs \
            rust/silent-disco-core/src/runtime/actor_runtime/state/transport.rs
          mapfile -t task4_files < <(find rust/silent-disco-core/src/runtime/actor_runtime/state -maxdepth 1 -type f -name '*.rs' | sort)
          assert_under_800 "Task 4 actor state files" "${task4_files[@]}"
          validate_all
          commit_task "Split actor state reducer by event family"

          echo "=== TASK 5: android_database_abi.rs ==="
          git rm rust/silent-disco-ffi/src/android_database_abi.rs
          git checkout "${VETTED_SPLIT_COMMIT}" -- \
            rust/silent-disco-ffi/src/android_database_abi/exports.rs \
            rust/silent-disco-ffi/src/android_database_abi/mod.rs \
            rust/silent-disco-ffi/src/android_database_abi/tests.rs
          mapfile -t task5_files < <(find rust/silent-disco-ffi/src/android_database_abi -maxdepth 1 -type f -name '*.rs' | sort)
          assert_under_800 "Task 5 Android database ABI files" "${task5_files[@]}"
          validate_all
          commit_task "Split Android database ABI into registry and export modules"

          echo "=== FINAL COMPLETION RECORD ==="
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          todo_path = Path("docs/OVERSIZED_SOURCE_FILES_SPLIT_REFACTOR_TODO.md")
          todo = todo_path.read_text(encoding="utf-8")
          for number in range(1, 6):
              marker = f"# Task {number} —"
              todo = todo.replace(marker, f"# Task {number} —", 1)

          groups = {
              "Task 1 — MainViewModel": sorted(Path("app/src/main/java/com/ekkus/silentdisco/app").glob("MainViewModel*.kt")),
              "Task 2 — storage worker": sorted(Path("rust/silent-disco-core/src/storage/worker").glob("*.rs")),
              "Task 3 — protocol codec": sorted(Path("rust/silent-disco-core/src/protocol/codec").glob("*.rs")),
              "Task 4 — actor state": sorted(Path("rust/silent-disco-core/src/runtime/actor_runtime/state").glob("*.rs")),
              "Task 5 — Android database ABI": sorted(Path("rust/silent-disco-ffi/src/android_database_abi").glob("*.rs")),
          }
          shas = Path("/tmp/oversized-refactor-shas").read_text(encoding="utf-8").splitlines()
          if len(shas) != 5:
              raise SystemExit(f"expected five task SHAs, found {len(shas)}")

          lines = [
              "",
              "---",
              "",
              "# Ralph Loop completion record",
              "",
              "All five top-level refactor tasks were completed sequentially on `master`.",
              "Each task passed Rust formatting, strict Clippy, all Rust tests, Android debug assembly, Android unit tests, and Android lint before its implementation commit was pushed.",
              "",
          ]
          for index, (label, files) in enumerate(groups.items()):
              lines.append(f"## {label}")
              lines.append("")
              lines.append(f"Implementation commit: `{shas[index]}`")
              lines.append("")
              for file in files:
                  count = len(file.read_text(encoding="utf-8").splitlines())
                  if count >= 800:
                      raise SystemExit(f"final line-count violation: {file} has {count}")
                  lines.append(f"- `{file.as_posix()}` — {count} lines")
              lines.append("")
          lines.extend([
              "## Final status",
              "",
              "- [x] Every resulting target source file is under 800 physical lines.",
              "- [x] Public `MainViewModel` action methods remain member methods and delegate to extracted implementations.",
              "- [x] Rust module imports remain explicit and strict Clippy passes with warnings denied.",
              "- [x] No protocol constants, JNI export names, actor transaction rules, storage queue limits, or explicit error paths were intentionally changed.",
              "- [x] The complete standard validation commands passed after every top-level task.",
              "",
          ])
          todo_path.write_text(todo.rstrip() + "\n" + "\n".join(lines), encoding="utf-8")
          PY

          rm .github/workflows/ralph-oversized-refactor.yml
          commit_task "Record completion of oversized source refactor loop"
