name: Ralph oversized refactor task 1

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/ralph-oversized-refactor.yml"

permissions:
  contents: write

concurrency:
  group: ralph-oversized-refactor-master
  cancel-in-progress: true

env:
  RUST_VERSION: "1.97.1"
  SOURCE_SHA: "486f2df79ed407620771c08033c6e2002b557548"

jobs:
  task-1-main-view-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Refactor and validate MainViewModel
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/task1.log) 2>&1
          trap 'status=$?; echo "FAILED_COMMAND=${BASH_COMMAND}"; echo "EXIT_STATUS=${status}"; exit ${status}' ERR

          base="https://raw.githubusercontent.com/ekkus93/silent_disco/${SOURCE_SHA}"
          files=(
            app/src/main/java/com/ekkus/silentdisco/app/MainViewModel.kt
            app/src/main/java/com/ekkus/silentdisco/app/MainViewModelAudioPipeline.kt
            app/src/main/java/com/ekkus/silentdisco/app/MainViewModelDemo.kt
            app/src/main/java/com/ekkus/silentdisco/app/MainViewModelDiagnostics.kt
            app/src/main/java/com/ekkus/silentdisco/app/MainViewModelHostPlayback.kt
            app/src/main/java/com/ekkus/silentdisco/app/MainViewModelListenerPlayback.kt
            app/src/main/java/com/ekkus/silentdisco/app/MainViewModelPersistence.kt
            app/src/main/java/com/ekkus/silentdisco/app/MainViewModelSupport.kt
            app/src/main/java/com/ekkus/silentdisco/app/MainViewModelSynchronization.kt
            app/src/main/java/com/ekkus/silentdisco/app/MainViewModelTransport.kt
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "${file}")"
            curl --fail --location --silent --show-error "${base}/${file}" --output "${file}"
          done

          python3 - <<'PY'
          from __future__ import annotations

          import re
          from dataclasses import dataclass
          from pathlib import Path

          path = Path("app/src/main/java/com/ekkus/silentdisco/app/MainViewModel.kt")
          source = path.read_text(encoding="utf-8")

          def mask(text: str) -> str:
              result = list(text)
              state = "code"
              depth = 0
              index = 0
              while index < len(text):
                  def blank(position: int) -> None:
                      if text[position] != "\n":
                          result[position] = " "
                  if state == "line":
                      blank(index)
                      if text[index] == "\n": state = "code"
                      index += 1; continue
                  if state == "block":
                      if text.startswith("/*", index):
                          blank(index); blank(index + 1); depth += 1; index += 2
                      elif text.startswith("*/", index):
                          blank(index); blank(index + 1); depth -= 1; index += 2
                          if depth == 0: state = "code"
                      else:
                          blank(index); index += 1
                      continue
                  if state in {"string", "char"}:
                      quote = '"' if state == "string" else "'"
                      blank(index)
                      if text[index] == "\\" and index + 1 < len(text):
                          blank(index + 1); index += 2
                      elif text[index] == quote:
                          state = "code"; index += 1
                      else:
                          index += 1
                      continue
                  if state == "triple":
                      if text.startswith('"""', index):
                          blank(index); blank(index + 1); blank(index + 2); index += 3; state = "code"
                      else:
                          blank(index); index += 1
                      continue
                  if text.startswith("//", index):
                      blank(index); blank(index + 1); state = "line"; index += 2
                  elif text.startswith("/*", index):
                      blank(index); blank(index + 1); state = "block"; depth = 1; index += 2
                  elif text.startswith('"""', index):
                      blank(index); blank(index + 1); blank(index + 2); state = "triple"; index += 3
                  elif text[index] == '"':
                      blank(index); state = "string"; index += 1
                  elif text[index] == "'":
                      blank(index); state = "char"; index += 1
                  else:
                      index += 1
              if state not in {"code", "line"}: raise RuntimeError(f"unterminated state {state}")
              return "".join(result)

          def close_brace(text: str, opening: int) -> int:
              depth = 0
              for index in range(opening, len(text)):
                  if text[index] == "{": depth += 1
                  elif text[index] == "}":
                      depth -= 1
                      if depth == 0: return index
              raise RuntimeError("unmatched brace")

          @dataclass(frozen=True)
          class Move:
              declaration: str
              wrapper: str | None
              implementation: str
              destination: str

          moves = [
              Move("    fun createHostSession(): Boolean {", "    fun createHostSession(): Boolean = createHostSessionImpl()\n", "internal fun MainViewModel.createHostSessionImpl(): Boolean {", "MainViewModelHostActions.kt"),
              Move("    fun approveJoinRequest(request: JoinRequest) {", "    fun approveJoinRequest(request: JoinRequest) = approveJoinRequestImpl(request)\n", "internal fun MainViewModel.approveJoinRequestImpl(request: JoinRequest) {", "MainViewModelHostActions.kt"),
              Move("    fun rejectJoinRequest(request: JoinRequest) {", "    fun rejectJoinRequest(request: JoinRequest) = rejectJoinRequestImpl(request)\n", "internal fun MainViewModel.rejectJoinRequestImpl(request: JoinRequest) {", "MainViewModelHostActions.kt"),
              Move("    fun startHostPlayback() {", "    fun startHostPlayback() = startHostPlaybackImpl()\n", "internal fun MainViewModel.startHostPlaybackImpl() {", "MainViewModelHostActions.kt"),
              Move("    fun pauseHostPlayback() {", "    fun pauseHostPlayback() = pauseHostPlaybackImpl()\n", "internal fun MainViewModel.pauseHostPlaybackImpl() {", "MainViewModelHostActions.kt"),
              Move("    fun stopHostPlayback() {", "    fun stopHostPlayback() = stopHostPlaybackImpl()\n", "internal fun MainViewModel.stopHostPlaybackImpl() {", "MainViewModelHostActions.kt"),
              Move("    fun endSession() {", "    fun endSession() = endSessionImpl()\n", "internal fun MainViewModel.endSessionImpl() {", "MainViewModelHostActions.kt"),
              Move("    fun scanForSessions() {", "    fun scanForSessions() = scanForSessionsImpl()\n", "internal fun MainViewModel.scanForSessionsImpl() {", "MainViewModelListenerActions.kt"),
              Move("    fun requestJoin() {", "    fun requestJoin() = requestJoinImpl()\n", "internal fun MainViewModel.requestJoinImpl() {", "MainViewModelListenerActions.kt"),
              Move("    internal fun startTransportListenerPlayback(sessionId: SessionId, streamId: StreamId, format: AudioFormatSpec = AudioFormatSpec()) {", None, "internal fun MainViewModel.startTransportListenerPlayback(sessionId: SessionId, streamId: StreamId, format: AudioFormatSpec = AudioFormatSpec()) {", "MainViewModelListenerActions.kt"),
          ]

          prefix = source[:source.index("class MainViewModel")]
          generated: dict[str, list[str]] = {}
          for move in moves:
              code = mask(source)
              start = code.find(move.declaration)
              if start < 0: raise RuntimeError(f"missing {move.declaration}")
              opening = code.find("{", start)
              end = close_brace(code, opening) + 1
              while end < len(source) and source[end] in " \t": end += 1
              if end < len(source) and source[end] == "\n": end += 1
              block = "\n".join(line[4:] if line.startswith("    ") else line for line in source[start:end].rstrip().splitlines())
              original = move.declaration[4:]
              if block.count(original) != 1: raise RuntimeError(f"unexpected declaration count for {original}")
              generated.setdefault(move.destination, []).append(block.replace(original, move.implementation, 1))
              source = source[:start] + (move.wrapper or "") + source[end:]

          path.write_text(re.sub(r"\n{3,}", "\n\n", source).rstrip() + "\n", encoding="utf-8")
          for filename, blocks in generated.items():
              (path.parent / filename).write_text(prefix.rstrip() + "\n\n" + "\n\n".join(blocks) + "\n", encoding="utf-8")
          PY

          while IFS= read -r file; do
            lines=$(wc -l < "${file}")
            printf '%4d %s\n' "${lines}" "${file}"
            test "${lines}" -lt 800
          done < <(find app/src/main/java/com/ekkus/silentdisco/app -maxdepth 1 -type f -name 'MainViewModel*.kt' | sort)

          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy --component rustfmt
          rustup default "${RUST_VERSION}"
          cd rust
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          cd ..
          ./gradlew assembleDebug test lintDebug --stacktrace --console=plain

      - name: Commit Task 1
        run: |
          set -euo pipefail
          rm .github/workflows/ralph-oversized-refactor.yml
          rm -f docs/OVERSIZED_SOURCE_FILES_SPLIT_REFACTOR_TASK1_FAILURE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refactor MainViewModel into focused action modules"
          git push origin HEAD:master

      - name: Record Task 1 failure
        if: failure()
        run: |
          set -euo pipefail
          cp /tmp/task1.log /tmp/task1.saved 2>/dev/null || true
          git reset --hard "${GITHUB_SHA}"
          rm -f .github/workflows/ralph-oversized-refactor.yml
          if test -s /tmp/task1.saved; then
            {
              printf '# Task 1 MainViewModel refactor failure\n\n```text\n'
              tail -n 500 /tmp/task1.saved
              printf '\n```\n'
            } > docs/OVERSIZED_SOURCE_FILES_SPLIT_REFACTOR_TASK1_FAILURE.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record Task 1 refactor failure [skip ci]"
          git push origin HEAD:master
