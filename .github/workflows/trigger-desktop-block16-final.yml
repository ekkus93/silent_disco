name: Trigger Desktop Block 16 final validation

on:
  issue_comment:
    types:
      - created

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    if: github.event.issue.number == 45 && github.event.comment.body == '/run-block16-final'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Remove trigger before dispatch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/trigger-desktop-block16-final.yml
          git commit -m "Remove Desktop Block 16 validation trigger"
          git push origin HEAD:master

      - name: Dispatch final validation on cleaned master
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run finalize-desktop-block16-once.yml --ref master
