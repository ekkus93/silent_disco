name: Apply Desktop Block 19 decoder sender repair

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/desktop-block19-repair.yml

permissions:
  contents: write
  issues: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Patch decoder sender ownership
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("rust/silent-disco-core/src/audio/decoder.rs")
          text = path.read_text()
          call_old = """                run_decoder_worker(
                    opened,
                    sender,
                    config,
"""
          call_new = """                run_decoder_worker(
                    opened,
                    &sender,
                    config,
"""
          signature_old = """fn run_decoder_worker(
    mut opened: OpenedDecoder,
    sender: SyncSender<DecodedPcmChunk>,
"""
          signature_new = """fn run_decoder_worker(
    mut opened: OpenedDecoder,
    sender: &SyncSender<DecodedPcmChunk>,
"""
          inner_old = "let result = decode_stream(&mut opened, &sender, config, cancellation, statistics);"
          inner_new = "let result = decode_stream(&mut opened, sender, config, cancellation, statistics);"

          if call_old in text:
              text = text.replace(call_old, call_new, 1)
          if signature_old in text:
              text = text.replace(signature_old, signature_new, 1)
          if inner_old in text:
              text = text.replace(inner_old, inner_new, 1)

          if text.count("sender: &SyncSender<DecodedPcmChunk>") != 1:
              raise SystemExit("decoder sender signature repair did not apply exactly once")
          if text.count("                    &sender,\n                    config,") != 1:
              raise SystemExit("decoder spawn call repair did not apply exactly once")
          path.write_text(text)

          validator = Path(".github/workflows/desktop-block19.yml")
          validator.write_text(validator.read_text().rstrip() + "\n# retry after direct ownership repairs\n")
          PY
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          cargo fmt --manifest-path rust/Cargo.toml --all

      - name: Commit directly to master
        run: |
          set -euo pipefail
          git rm .github/workflows/desktop-block19-repair.yml
          git add .github/workflows/desktop-block19.yml rust/silent-disco-core/src/audio/decoder.rs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Repair Desktop Block 19 decoder sender ownership"
          remote_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          parent_sha="$(git rev-parse HEAD^)"
          test "${remote_sha}" = "${parent_sha}"
          git push origin HEAD:master
          echo "REPAIR_COMMIT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Publish success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 45 --repo "${GITHUB_REPOSITORY}" \
            --body "Desktop Block 19 decoder ownership repair ${REPAIR_COMMIT} committed directly to master; full validation was retriggered."

      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 45 --repo "${GITHUB_REPOSITORY}" \
            --body "Desktop Block 19 decoder ownership repair failed in Actions run ${GITHUB_RUN_ID}."

# activate decoder-only repair
