name: Apply Desktop Block 19 ownership repair

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/desktop-block19-repair.yml

permissions:
  contents: write
  issues: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply exact ownership edits
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          decoder = Path("rust/silent-disco-core/src/audio/decoder.rs")
          text = decoder.read_text()
          text = text.replace(
              """                run_decoder_worker(
                    opened,
                    sender,
                    config,
""",
              """                run_decoder_worker(
                    opened,
                    &sender,
                    config,
""",
              1,
          )
          text = text.replace(
              """fn run_decoder_worker(
    mut opened: OpenedDecoder,
    sender: SyncSender<DecodedPcmChunk>,
""",
              """fn run_decoder_worker(
    mut opened: OpenedDecoder,
    sender: &SyncSender<DecodedPcmChunk>,
""",
              1,
          )
          if text.count("sender: &SyncSender<DecodedPcmChunk>") != 1:
              raise SystemExit("decoder sender repair did not apply exactly once")
          decoder.write_text(text)

          source = Path("rust/silent-disco-core/src/audio/source.rs")
          text = source.read_text()
          text = text.replace(
              "fn map_io_error(error: io::Error, operation: &str) -> DecodeError {",
              "fn map_io_error(error: &io::Error, operation: &str) -> DecodeError {",
              1,
          )
          text = text.replace("map_io_error(error,", "map_io_error(&error,")
          if text.count("fn map_io_error(error: &io::Error") != 1:
              raise SystemExit("I/O error mapper repair did not apply")
          source.write_text(text)

          validator = Path(".github/workflows/desktop-block19.yml")
          validator.write_text(validator.read_text().rstrip() + "\n# retry after ownership repair commit\n")
          PY
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          cargo fmt --manifest-path rust/Cargo.toml --all

      - name: Commit repair directly to master
        run: |
          set -euo pipefail
          git rm .github/workflows/desktop-block19-repair.yml
          git add \
            .github/workflows/desktop-block19.yml \
            rust/silent-disco-core/src/audio/decoder.rs \
            rust/silent-disco-core/src/audio/source.rs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Repair Desktop Block 19 ownership signatures"
          remote_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          parent_sha="$(git rev-parse HEAD^)"
          test "${remote_sha}" = "${parent_sha}"
          git push origin HEAD:master
          echo "REPAIR_COMMIT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Publish repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 45 --repo "${GITHUB_REPOSITORY}" \
            --body "Desktop Block 19 ownership repair ${REPAIR_COMMIT} committed directly to master; full validation was retriggered."

      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 45 --repo "${GITHUB_REPOSITORY}" \
            --body "Desktop Block 19 ownership repair failed in Actions run ${GITHUB_RUN_ID}."

# activate minimal repair
