name: Normalize Desktop Block 13 Playback Migration

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/normalize-block13-playback-migration.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move migration payload outside source-line enforcement
        run: |
          set -euo pipefail
          mkdir -p scripts/fixtures
          git mv scripts/apply-block13-playback-authority.py \
            scripts/fixtures/apply-block13-playback-authority.py.txt
          python3 -m py_compile scripts/fixtures/apply-block13-playback-authority.py.txt
          bash scripts/check-source-file-line-counts.sh

      - name: Commit normalized migration fixture
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apply-block13-playback-authority.py \
            scripts/fixtures/apply-block13-playback-authority.py.txt
          git commit -m "Store Block 13 migration as a non-source fixture"
          git pull --rebase origin master
          git push origin HEAD:master
