name: Apply Block 26 Playback Queue Invalidation

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/apply-block13-targeted-transport.yml"

permissions:
  contents: write

concurrency:
  group: apply-block26-playback-queue-invalidation
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply exact stop queue patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object desktop/src-tauri/src/platform/host_transport.rs)" = "6f05fbddf56f8e3fdcfb9091b6911ee44a737d80"
          test "$(git hash-object desktop/src-tauri/src/platform/network/playback_control.rs)" = "f63060a22c66a268a6569cde9c05dbf921cbeabb"
          test "$(git hash-object desktop/src-tauri/src/platform/playback_streamer.rs)" = "fb5ed40a60f16e19a00817b65eb89ab3e9b7bca0"
          printf '%s' '' | base64 -d | gzip -dc > /tmp/block26_stop.diff
          git apply --check /tmp/block26_stop.diff
          git apply /tmp/block26_stop.diff
          python3 - <<'PY_CHECK'
          from pathlib import Path
          files = [
              Path('desktop/src-tauri/src/platform/host_transport.rs'),
              Path('desktop/src-tauri/src/platform/network/playback_control.rs'),
              Path('desktop/src-tauri/src/platform/playback_streamer.rs'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              if len(text.splitlines()) >= 800:
                  raise SystemExit(f'oversized source after patch: {path}')
              if any(line.rstrip() != line for line in text.splitlines()):
                  raise SystemExit(f'trailing whitespace: {path}')
          joined = '\n'.join(path.read_text(encoding='utf-8') for path in files)
          for token in [
              'invalidate_playback_queue_and_broadcast_terminal',
              'playback_generation',
              'next_current_broadcast_frame',
              'stale_playback_generation_is_drained_before_terminal_frame',
          ]:
              if token not in joined:
                  raise SystemExit(f'missing queue invalidation invariant: {token}')
          print('Block 26 pending queue invalidation source invariants verified')
          PY_CHECK
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            desktop/src-tauri/src/platform/host_transport.rs \
            desktop/src-tauri/src/platform/network/playback_control.rs \
            desktop/src-tauri/src/platform/playback_streamer.rs
          git commit -m "Clear pending playback frames on stop"
          git push origin HEAD:master
