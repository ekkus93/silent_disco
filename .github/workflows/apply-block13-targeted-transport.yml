name: Apply Block 26 Playback Failure Fix

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/apply-block13-targeted-transport.yml"

permissions:
  contents: write

concurrency:
  group: apply-block26-playback-failure-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply exact Block 26 patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object desktop/src-tauri/src/platform/playback_streamer.rs)" = "9f2c538cb1b04f8868a014ddc6d104cc71bdc2a1"
          test "$(git hash-object desktop/src-tauri/src/platform/host_transport.rs)" = "427e041fb11b2e5004be5b338677710d884d3bd2"
          test "$(git hash-object desktop/src-tauri/src/platform/network/playback_control.rs)" = "44cd9133ce9b5c787f82ee12d0241fec51077b87"
          test "$(git hash-object desktop/src-tauri/src/platform/start_playback_tests/lifecycle_tests.rs)" = "be6ee5703247ae763778ff690eaa5898cd5ab12b"
          test "$(git hash-object desktop/src-tauri/src/platform/host_transport_tests.rs)" = "b56f8ebaccc74f225663760981807167febb0e9f"
          test "$(git hash-object desktop/src-tauri/src/platform/start_playback_tests/streaming_tests.rs)" = "282a6d575ee1ac7cad34e688c754492f7ac6f700"
          printf '%s' '' | base64 -d | gzip -dc > /tmp/block26.diff
          git apply --check /tmp/block26.diff
          git apply /tmp/block26.diff
          python3 - <<'PY_CHECK'
          from pathlib import Path
          files = [
              Path('desktop/src-tauri/src/platform/playback_streamer.rs'),
              Path('desktop/src-tauri/src/platform/host_transport.rs'),
              Path('desktop/src-tauri/src/platform/network/playback_control.rs'),
              Path('desktop/src-tauri/src/platform/start_playback_tests/lifecycle_tests.rs'),
              Path('desktop/src-tauri/src/platform/host_transport_tests.rs'),
              Path('desktop/src-tauri/src/platform/start_playback_tests/streaming_tests.rs'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              if len(text.splitlines()) >= 800:
                  raise SystemExit(f'oversized source after patch: {path}')
              if any(line.rstrip() != line for line in text.splitlines()):
                  raise SystemExit(f'trailing whitespace: {path}')
          pump = files[0].read_text(encoding='utf-8')
          required = [
              'let mut streaming_error: Option<DesktopErrorDto> = None;',
              'if let Err(error) = network.broadcast_playback_frame(frame)',
              'let now = network.transport_now()?;',
              '.with_appended_cleanup(packetizer_result.err())',
          ]
          for token in required:
              if token not in pump:
                  raise SystemExit(f'missing pump invariant: {token}')
          if 'drop(network.broadcast_playback_frame(frame));' in pump:
              raise SystemExit('silent playback broadcast failure still present')
          joined = '\n'.join(path.read_text(encoding='utf-8') for path in files)
          for test in [
              'pause_stops_future_presentation_progression_until_resume',
              'a_transport_worker_failure_mid_stream_is_reported_by_the_playback_pump',
              'a_full_broadcast_queue_is_a_visible_resource_limit_failure',
          ]:
              if test not in joined:
                  raise SystemExit(f'missing regression test: {test}')
          print('Block 26 source invariants verified')
          PY_CHECK
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            desktop/src-tauri/src/platform/playback_streamer.rs \
            desktop/src-tauri/src/platform/host_transport.rs \
            desktop/src-tauri/src/platform/network/playback_control.rs \
            desktop/src-tauri/src/platform/start_playback_tests/lifecycle_tests.rs \
            desktop/src-tauri/src/platform/host_transport_tests.rs \
            desktop/src-tauri/src/platform/start_playback_tests/streaming_tests.rs
          git commit -m "Surface desktop playback transport failures"
          git push origin HEAD:master
