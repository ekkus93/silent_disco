          git diff --check

      - name: Commit audited TODO to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SILENT_DISCO_TAURI_DESKTOP_HOST_TODO.md .github/workflows/apply-block13-targeted-transport.yml
          git commit -m "Reconcile desktop host TODO audit"

          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "push failed after $attempt attempts" >&2
              exit 1
            fi
            git fetch origin master
            git rebase origin/master
            actual="$(git hash-object docs/SILENT_DISCO_TAURI_DESKTOP_HOST_TODO.md)"
            test "$actual" = "b06f9255727beb3910dff6b2a1438ab5cb7d2f0b"
          done
