name: Apply Block 7 Storage Inspection

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/apply-block13-targeted-transport.yml"

permissions:
  contents: write

concurrency:
  group: apply-block7-storage-inspection
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pinned Rust formatter
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt

      - name: Apply audited Block 7 source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import base64
          import zlib
          from pathlib import Path
          payload = """"""
          patch = zlib.decompress(base64.b64decode(payload))
          Path("/tmp/block7.patch").write_bytes(patch)
          PY2
          git apply --check /tmp/block7.patch
          git apply /tmp/block7.patch
          (cd rust && cargo +1.97.1 fmt --all)
          cargo +1.97.1 fmt --manifest-path desktop/src-tauri/Cargo.toml
          git diff --check

      - name: Commit Block 7 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/silent-disco-core/src/storage desktop/src-tauri/src desktop/src/core desktop/src/App.tsx desktop/src/screens/StorageInspectionScreen.tsx desktop/src/screens/StorageInspectionScreen.test.tsx
          git commit -m "Expose bounded desktop storage inspection"
          git push origin HEAD:master
