name: Refresh Desktop Cargo Lockfile

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/apply-block13-targeted-transport.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Refresh exact transitive lock entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('desktop/src-tauri/Cargo.lock')
          text = path.read_text(encoding='utf-8')
          old = '''[[package]]
          name = "num-integer"
          version = "0.1.46"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "7969661fd2958a5cb096e56c8e1ad0444ac2bbcd0061bd28660485a44879858f"
          '''
          new = '''[[package]]
          name = "num-integer"
          version = "0.1.47"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "7ce2d95d4b3734dc35aa2f45e1aa22cd416814592a4f9d9205e11affd5b8e10b"
          '''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one num-integer 0.1.46 lock entry')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
      - name: Commit lockfile refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src-tauri/Cargo.lock
          git commit -m "Refresh desktop Cargo lockfile"
          git push origin HEAD:master
