name: Apply Block 34 Monitor Failure Visibility

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/apply-block13-targeted-transport.yml"

permissions:
  contents: write

concurrency:
  group: apply-block34-monitor-failure-visibility
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply exact Block 34 monitor patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object desktop/src-tauri/src/platform/monitor.rs)" = "e012336b5976f6498308023753888a208d629dfd"
          test "$(git hash-object desktop/src-tauri/src/platform/monitor_pump.rs)" = "d094c865ccca4f0d0b21e042c2969d09b626e6d3"
          test "$(git hash-object desktop/src-tauri/src/platform/monitor_tests.rs)" = "018bb453758443932608506205864ff4c2b9d047"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          monitor = "desktop/src-tauri/src/platform/monitor.rs"
          replace_once(monitor, "use std::sync::{Arc, Mutex};", "use std::sync::{Arc, Mutex, OnceLock};")
          replace_once(
              monitor,
              '''struct ActiveMonitorStream {
              output: Box<dyn DesktopAudioOutputStream>,
              pump: MonitorPlaybackPump,
          }

          impl ActiveMonitorStream {
              fn stop(mut self) {
                  self.output.stop();
                  self.pump.stop();
              }
          }
          ''',
              '''struct ActiveMonitorStream {
              output: Box<dyn DesktopAudioOutputStream>,
              pump: MonitorPlaybackPump,
              runtime_failure: Arc<OnceLock<String>>,
          }

          impl ActiveMonitorStream {
              fn failure_reason(&self) -> Option<String> {
                  self.runtime_failure.get().cloned()
              }

              fn stop(mut self) -> Option<String> {
                  let runtime_failure = self.failure_reason();
                  self.output.stop();
                  let pump_failure = self.pump.stop().err();
                  match (runtime_failure, pump_failure) {
                      (Some(runtime), Some(pump)) => {
                          Some(format!("{runtime}; monitor cleanup failed: {pump}"))
                      }
                      (Some(runtime), None) => Some(runtime),
                      (None, Some(pump)) => Some(pump),
                      (None, None) => None,
                  }
              }
          }
          ''',
          )
          replace_once(
              monitor,
              '''        let mut state = self.state.lock().ok()?;
                  state.enabled = enabled;
                  if !enabled {
                      if let Some(active) = state.active.take() {
                          active.stop();
                      }
                      state.failure_reason = None;
                  }
          ''',
              '''        let mut state = self.state.lock().ok()?;
                  state.enabled = enabled;
                  if !enabled {
                      state.failure_reason = state.active.take().and_then(ActiveMonitorStream::stop);
                  }
          ''',
          )
          replace_once(
              monitor,
              '''        Some(MonitorStatus {
                      enabled: state.enabled,
                      active: state.active.is_some(),
                      device_name: state
                          .active
                          .as_ref()
                          .and_then(|active| active.output.device_name()),
                      failure_reason: state.failure_reason.clone(),
                  })
          ''',
              '''        let runtime_failure = state
                      .active
                      .as_ref()
                      .and_then(ActiveMonitorStream::failure_reason);
                  Some(MonitorStatus {
                      enabled: state.enabled,
                      active: state.active.is_some() && runtime_failure.is_none(),
                      device_name: state
                          .active
                          .as_ref()
                          .and_then(|active| active.output.device_name()),
                      failure_reason: runtime_failure.or_else(|| state.failure_reason.clone()),
                  })
          ''',
          )
          replace_once(
              monitor,
              '''        let mut state = self.state.lock().ok()?;
                  if let Some(active) = state.active.take() {
                      active.stop();
                  }
                  state.failure_reason = None;
                  if !state.enabled {
                      return None;
                  }
          ''',
              '''        let mut state = self.state.lock().ok()?;
                  if let Some(active) = state.active.take()
                      && let Some(failure) = active.stop()
                  {
                      state.failure_reason = Some(failure);
                      return None;
                  }
                  state.failure_reason = None;
                  if !state.enabled {
                      return None;
                  }
          ''',
          )
          replace_once(
              monitor,
              '''        if let Some(active) = state.active.take() {
                      active.stop();
                  }
          ''',
              '''        if let Some(active) = state.active.take() {
                      state.failure_reason = active.stop();
                  }
          ''',
          )
          replace_once(
              monitor,
              '''        let on_error = Arc::new(move |error: String| {
                      let _ = error;
                  });
          ''',
              '''        let runtime_failure = Arc::new(OnceLock::new());
                  let runtime_failure_for_callback = Arc::clone(&runtime_failure);
                  let on_error = Arc::new(move |error: String| {
                      // Audio callbacks cannot lock monitor state. Retain the first runtime
                      // device failure in a write-once cell so status readers can surface it
                      // without affecting host transmission. Later callback failures cannot
                      // erase the first actionable cause.
                      if runtime_failure_for_callback
                          .set(format!("local monitor audio device failed: {error}"))
                          .is_err()
                      {
                          // The first callback failure is authoritative and remains visible;
                          // later callbacks cannot replace it with less useful noise.
                      }
                  });
          ''',
          )
          replace_once(
              monitor,
              '''        let mut output = match backend.build_output(request, audio_source, Arc::clone(&on_error)) {
                      Ok(output) => output,
                      Err(error) => {
                          pump.stop();
                          return Err(error);
                      }
                  };
                  if let Err(error) = output.play() {
                      output.stop();
                      pump.stop();
                      return Err(error);
                  }
                  Ok((
                      ActiveMonitorStream { output, pump },
                      tap_sender,
                  ))
          ''',
              '''        let mut output = match backend.build_output(request, audio_source, Arc::clone(&on_error)) {
                      Ok(output) => output,
                      Err(error) => {
                          return Err(match pump.stop() {
                              Ok(()) => error,
                              Err(cleanup) => format!("{error}; monitor cleanup failed: {cleanup}"),
                          });
                      }
                  };
                  if let Err(error) = output.play() {
                      output.stop();
                      return Err(match pump.stop() {
                          Ok(()) => error,
                          Err(cleanup) => format!("{error}; monitor cleanup failed: {cleanup}"),
                      });
                  }
                  Ok((
                      ActiveMonitorStream {
                          output,
                          pump,
                          runtime_failure,
                      },
                      tap_sender,
                  ))
          ''',
          )

          pump = "desktop/src-tauri/src/platform/monitor_pump.rs"
          replace_once(
              pump,
              '''    pub(super) fn stop(mut self) {
                  self.stop.store(true, Ordering::Release);
                  self.wake.notify_all();
                  if let Some(worker) = self.worker.take() {
                      drop(worker.join());
                  }
              }
          ''',
              '''    pub(super) fn stop(mut self) -> Result<(), String> {
                  self.stop.store(true, Ordering::Release);
                  self.wake.notify_all();
                  if let Some(worker) = self.worker.take() {
                      worker
                          .join()
                          .map_err(|_| "local monitor pump thread panicked during shutdown".to_owned())?;
                  }
                  Ok(())
              }
          ''',
          )

          tests = "desktop/src-tauri/src/platform/monitor_tests.rs"
          replace_once(
              tests,
              '''    std::thread::sleep(Duration::from_millis(100));
              network.monitor.on_stream_stopped();
              let status = network.monitor.status().expect("monitor status");
              assert!(!status.active);
              let snapshot = handle.current_snapshot().expect("snapshot");
              assert_eq!(snapshot.lifecycle_state, LifecycleState::Hosting);
              assert!(snapshot.failure.is_none());
          ''',
              '''    let deadline = std::time::Instant::now() + Duration::from_secs(2);
              let failed_status = loop {
                  let status = network.monitor.status().expect("monitor status");
                  if status.failure_reason.is_some() {
                      break status;
                  }
                  assert!(
                      std::time::Instant::now() < deadline,
                      "monitor runtime failure was never surfaced"
                  );
                  std::thread::sleep(Duration::from_millis(10));
              };
              assert!(
                  !failed_status.active,
                  "a monitor with a runtime device failure must not remain logically active"
              );
              assert!(
                  failed_status
                      .failure_reason
                      .as_deref()
                      .is_some_and(|failure| failure.contains("fake: device disappeared")),
                  "unexpected monitor failure: {:?}",
                  failed_status.failure_reason
              );

              network.monitor.on_stream_stopped();
              let stopped_status = network.monitor.status().expect("monitor status after stop");
              assert!(!stopped_status.active);
              assert!(
                  stopped_status
                      .failure_reason
                      .as_deref()
                      .is_some_and(|failure| failure.contains("fake: device disappeared")),
                  "runtime device failure was erased during teardown: {:?}",
                  stopped_status.failure_reason
              );
              let snapshot = handle.current_snapshot().expect("snapshot");
              assert_eq!(snapshot.lifecycle_state, LifecycleState::Hosting);
              assert!(snapshot.failure.is_none());
          ''',
          )

          todo = Path("docs/SILENT_DISCO_TAURI_DESKTOP_HOST_TODO.md")
          text = todo.read_text(encoding="utf-8")
          replacements = {
              "- [ ] **Block 34 — Implement local desktop monitor playback**": "- [x] **Block 34 — Implement local desktop monitor playback**",
              "- [ ] **34.3 Add failure-path tests for:**": "- [x] **34.3 Add failure-path tests for:**",
              "  - [ ] physical monitor device disappears mid-stream,": "  - [x] physical monitor device disappears mid-stream,",
              "  - [ ] host transmit continues or stops exactly according to policy,": "  - [x] host transmit continues or stops exactly according to policy,",
              "  - [ ] user-visible failure state matches policy.": "  - [x] user-visible failure state matches policy.",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"TODO: expected one match for {old!r}, found {count}")
              text = text.replace(old, new)
          todo.write_text(text, encoding="utf-8")
          PY

          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path("desktop/src-tauri/src/platform/monitor.rs"),
              Path("desktop/src-tauri/src/platform/monitor_pump.rs"),
              Path("desktop/src-tauri/src/platform/monitor_tests.rs"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if len(text.splitlines()) >= 800:
                  raise SystemExit(f"oversized source after patch: {path}")
              if any(line.rstrip() != line for line in text.splitlines()):
                  raise SystemExit(f"trailing whitespace: {path}")
          monitor = paths[0].read_text(encoding="utf-8")
          pump = paths[1].read_text(encoding="utf-8")
          tests = paths[2].read_text(encoding="utf-8")
          for token in [
              "runtime_failure_for_callback",
              "active: state.active.is_some() && runtime_failure.is_none()",
              "monitor cleanup failed",
          ]:
              if token not in monitor:
                  raise SystemExit(f"missing monitor invariant: {token}")
          if "let _ = error;" in monitor:
              raise SystemExit("runtime monitor error is still discarded")
          if "drop(worker.join())" in pump:
              raise SystemExit("monitor pump join result is still discarded")
          if "local monitor pump thread panicked during shutdown" not in pump:
              raise SystemExit("missing monitor pump panic visibility")
          if "runtime device failure was erased during teardown" not in tests:
              raise SystemExit("missing strengthened runtime-failure test")
          print("Block 34 source invariants verified")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            desktop/src-tauri/src/platform/monitor.rs \
            desktop/src-tauri/src/platform/monitor_pump.rs \
            desktop/src-tauri/src/platform/monitor_tests.rs \
            docs/SILENT_DISCO_TAURI_DESKTOP_HOST_TODO.md
          git commit -m "Surface local monitor runtime failures"
          git push origin HEAD:master
