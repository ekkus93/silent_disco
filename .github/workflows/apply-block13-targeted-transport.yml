              if not re.match(r"^- \[[ x~]\] ", line):
                  raise SystemExit(f"line {index + 1} is not a checkbox: {line!r}")
              lines[index] = line[:3] + state + line[4:]
          for start, end, replacement in sorted(manifest["replace"], reverse=True):
              lines[start:end] = replacement.splitlines(keepends=True)
          output = "".join(lines).encode("utf-8")
          after = hashlib.sha1(b"blob " + str(len(output)).encode() + b"\0" + output).hexdigest()
