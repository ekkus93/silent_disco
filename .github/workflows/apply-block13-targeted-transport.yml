name: Reconcile Blocks 6 and 7 TODO

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/apply-block13-targeted-transport.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Mark verified Block 6 and Block 7 assertions done
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/SILENT_DISCO_TAURI_DESKTOP_HOST_TODO.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '- [ ] first process acquires;': '- [x] first process acquires;',
              '- [ ] second process fails visibly;': '- [x] second process fails visibly;',
              '- [ ] lock releases after normal shutdown;': '- [x] lock releases after normal shutdown;',
              '- [ ] abnormal process termination recovery follows selected library semantics;': '- [x] abnormal process termination recovery follows selected library semantics;',
              '- [ ] separate profiles can open concurrently.': '- [x] separate profiles can open concurrently.',
              '- [ ] display real success or structured failure.': '- [x] display real success or structured failure.',
              '- [ ] database metadata;': '- [x] database metadata;',
              '- [ ] validated settings;': '- [x] validated settings;',
              '- [ ] trusted-device summaries;': '- [x] trusted-device summaries;',
              '- [ ] recent session summaries;': '- [x] recent session summaries;',
              '- [ ] P2 store metadata when applicable.': '- [x] P2 store metadata when applicable.',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)

          old_acceptance = ('**Acceptance:** Partially met. The real Rust-owned storage inspection/migration path is implemented and tested, '
                            'but the requested Tauri inspection commands/UI surface is not wired, so the desktop shell does not yet expose the result.')
          new_acceptance = ('**Acceptance:** Met. The active desktop profile exposes bounded read-only database metadata, validated settings, '
                            'trusted-device summaries, deterministic recent-session summaries, and the explicit current P2-store applicability state '
                            'through a typed Tauri command and Storage screen, all backed by the already-open Rust `DatabaseWorker` rather than a second SQL path. '
                            'Structured backend failures remain visible in the UI instead of becoming empty success. Exact-SHA Desktop CI run `31553428990` '
                            'passed frontend quality, strict Rust Clippy/tests/check, committed-lockfile checks, and Linux AppImage/`.deb` bundle smoke.')
          if text.count(old_acceptance) != 1:
              raise SystemExit('expected one old Block 7 acceptance paragraph')
          text = text.replace(old_acceptance, new_acceptance)

          marker = '**Acceptance:** Two desktop processes cannot unknowingly mutate the same profile.'
          evidence = (marker + '\n\n**Completion evidence:** `desktop/src-tauri/tests/profile_lock_multiprocess.rs` now covers child-process acquisition, '
                      'visible contention, normal release, kernel lock recovery after forced child termination, and concurrent ownership of separate profiles. '
                      'Exact-SHA Desktop CI run `31553428990` passed strict Rust Clippy and the complete backend test suite.')
          if text.count(marker) != 1:
              raise SystemExit('expected one Block 6 acceptance marker')
          text = text.replace(marker, evidence)

          done = len(re.findall(r'^- \[x\] ', text, re.MULTILINE))
          open_ = len(re.findall(r'^- \[ \] ', text, re.MULTILINE))
          partial = len(re.findall(r'^- \[~\] ', text, re.MULTILINE))
          if (done, open_, partial) != (903, 146, 0):
              raise SystemExit(f'unexpected counts: done={done} open={open_} partial={partial}')
          path.write_text(text, encoding='utf-8')
          print(f'verified TODO counts: done={done} open={open_} partial={partial}')
          PY
          git diff --check
      - name: Commit reconciled TODO
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SILENT_DISCO_TAURI_DESKTOP_HOST_TODO.md
          git commit -m "Mark verified desktop Blocks 6 and 7 complete"
          git push origin HEAD:master
