name: Apply Block 13 Targeted Transport

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/apply-block13-targeted-transport.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted Block 13 delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/SILENT_DISCO_TAURI_DESKTOP_HOST_TODO.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "- [ ] **13.8 Record generated-binding provenance.**",
              "- [x] **13.8 Record generated-binding provenance.**",
          )
          text = text.replace(
              "  - [ ] generated from Rust request/response/error DTOs,",
              "  - [x] generated from Rust request/response/error DTOs,",
          )
          text = text.replace(
              "  - [ ] exact generated file checked in,",
              "  - [x] exact generated file checked in,",
          )
          text = text.replace(
              "  - [ ] CI verifies regeneration produces no diff.",
              "  - [x] CI verifies regeneration produces no diff.",
          )
          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SILENT_DISCO_TAURI_DESKTOP_HOST_TODO.md
          if git diff --cached --quiet; then
            echo "No Block 13 TODO delta to commit"
          else
            git commit -m "Record generated Block 13 host API"
            git push origin HEAD:master
          fi
