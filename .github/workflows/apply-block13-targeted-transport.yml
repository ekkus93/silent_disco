name: Apply Audited Desktop TODO One-Shot

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/apply-block13-targeted-transport.yml"

permissions:
  contents: write

concurrency:
  group: apply-audited-desktop-todo
  cancel-in-progress: false

jobs:
