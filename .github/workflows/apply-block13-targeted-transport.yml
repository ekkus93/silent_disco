          done = len(re.findall(r"^- \[x\] ", text, flags=re.MULTILINE))
          open_ = len(re.findall(r"^- \[ \] ", text, flags=re.MULTILINE))
          partial = len(re.findall(r"^- \[~\] ", text, flags=re.MULTILINE))
