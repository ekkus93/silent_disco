name: Run Block 13 Targeted Transport

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/run-block13-targeted-transport.yml"

permissions:
  contents: write

concurrency:
  group: run-block13-targeted-transport
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply targeted transport implementation
        run: |
          set -euo pipefail
          python3 scripts/apply-block13-targeted-transport.py
          git diff --check

      - name: Run targeted transport tests
        run: ./gradlew testDebugUnitTest --tests com.ekkus.silentdisco.core.transport.TargetedTcpTransportTest --stacktrace --console=plain

      - name: Commit targeted transport source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/test
          git diff --cached --quiet && {
            echo "Targeted transport transformation produced no source changes." >&2
            exit 1
          }
          git commit -m "Add exact-listener control delivery"
          git push origin HEAD:master
