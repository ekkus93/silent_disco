name: Desktop CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "desktop/**"
      - "rust/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    branches:
      - master
    paths:
      - "desktop/**"
      - "rust/**"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.16.0"
  RUST_VERSION: "1.97.1"

jobs:
  frontend:
    name: Desktop frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux dependencies for Rust binding generator
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Generate exact npm lockfile when missing
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package-lock.json ]]; then
            npm install --package-lock-only --ignore-scripts
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Create Rust binding frontend placeholder
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop/dist
          printf '<!doctype html><title>Silent Disco binding CI placeholder</title>\n' > desktop/dist/index.html

      - name: Verify Rust-derived TypeScript bindings
        run: npm run bindings:check

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

      - name: Require committed npm lockfile
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain -- desktop/package-lock.json)"
          if [[ -n "${status}" ]]; then
            printf '%s\n' "${status}"
            echo "desktop/package-lock.json must be committed exactly as generated." >&2
            exit 1
          fi

      - name: Upload generated npm lockfile and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-frontend-diagnostics
          path: |
            desktop/package-lock.json
            desktop/src/core/generated/desktop-bindings.ts
            desktop/dist/
          if-no-files-found: warn
          retention-days: 3

  rust:
    name: Desktop Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy --component rustfmt
          rustup default "${RUST_VERSION}"

      - name: Generate exact Cargo lockfile when missing
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f Cargo.lock ]]; then
            cargo generate-lockfile
          fi

      - name: Check Rust formatting
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: Create Rust-only frontend placeholder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop/dist
          printf '<!doctype html><title>Silent Disco Rust CI placeholder</title>\n' > desktop/dist/index.html

      - name: Run strict Clippy
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee ../../desktop-rust-clippy.log

      - name: Run desktop backend tests
        working-directory: desktop/src-tauri
        run: cargo test --locked --all-features

      - name: Check desktop backend
        working-directory: desktop/src-tauri
        run: cargo check --locked --all-features

      - name: Require committed Cargo lockfile
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain -- desktop/src-tauri/Cargo.lock)"
          if [[ -n "${status}" ]]; then
            printf '%s\n' "${status}"
            echo "desktop/src-tauri/Cargo.lock must be committed exactly as generated." >&2
            exit 1
          fi

      - name: Upload generated Cargo lockfile and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-rust-diagnostics
          path: |
            desktop/src-tauri/Cargo.lock
            desktop-rust-clippy.log
          if-no-files-found: warn
          retention-days: 3

  linux-bundle:
    name: Linux desktop bundle smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      - name: Install Linux Tauri bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            dbus-x11 \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget \
            xauth \
            xvfb

      - name: Generate exact lockfiles when missing
        shell: bash
        run: |
          set -euo pipefail
          cd desktop
          if [[ ! -f package-lock.json ]]; then
            npm install --package-lock-only --ignore-scripts
          fi
          cd src-tauri
          if [[ ! -f Cargo.lock ]]; then
            cargo generate-lockfile
          fi

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Linux bundles
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          combined_log="../desktop-tauri-build.log"
          : > "${combined_log}"
          for attempt in 1 2 3; do
            attempt_log="$(mktemp)"
            printf '=== Tauri bundle attempt %d/3 ===\n' "${attempt}" | tee -a "${combined_log}"
            set +e
            npm run tauri build 2>&1 | tee "${attempt_log}" | tee -a "${combined_log}"
            status="${PIPESTATUS[0]}"
            set -e
            if [[ "${status}" -eq 0 ]]; then
              rm -f "${attempt_log}"
              exit 0
            fi
            if ! grep -Fq 'Peer disconnected' "${attempt_log}"; then
              rm -f "${attempt_log}"
              exit "${status}"
            fi
            rm -f "${attempt_log}"
            if [[ "${attempt}" -eq 3 ]]; then
              echo "Tauri bundler still reports a peer disconnect after 3 attempts." >&2
              exit "${status}"
            fi
            sleep "$((attempt * 10))"
          done

      - name: Verify Linux bundle payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 desktop/scripts/verify-linux-bundles.py \
            --bundle-dir desktop/src-tauri/target/release/bundle \
            --tauri-config desktop/src-tauri/tauri.conf.json \
            --cargo-manifest desktop/src-tauri/Cargo.toml

      - name: Exercise Linux package lifecycle
        shell: bash
        run: |
          set -euo pipefail
          bash desktop/scripts/smoke-linux-package-lifecycle.sh \
            desktop/src-tauri/target/release/bundle \
            com.ekkus.silentdisco.desktop \
            silent-disco-desktop

      - name: Require committed lockfiles
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain -- desktop/package-lock.json desktop/src-tauri/Cargo.lock)"
          if [[ -n "${status}" ]]; then
            printf '%s\n' "${status}"
            echo "Desktop lockfiles must be committed exactly as generated." >&2
            exit 1
          fi

      - name: Upload Linux bundles and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-bundle
          path: |
            desktop-tauri-build.log
            desktop/package-lock.json
            desktop/src-tauri/Cargo.lock
            desktop/src-tauri/target/release/bundle/
          if-no-files-found: warn
          retention-days: 3
