name: Final oversized refactor validation

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/ralph-oversized-refactor-final.yml"

permissions:
  contents: write

concurrency:
  group: ralph-oversized-refactor-final-master
  cancel-in-progress: true

env:
  RUST_VERSION: "1.97.1"
  TODO_PATH: "docs/OVERSIZED_SOURCE_FILES_SPLIT_REFACTOR_TODO.md"

jobs:
  final-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Validate all refactors and produce completion record
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/final-refactor.log) 2>&1
          trap 'status=$?; echo "FAILED_COMMAND=${BASH_COMMAND}"; echo "EXIT_STATUS=${status}"; exit ${status}' ERR

          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy --component rustfmt
          rustup default "${RUST_VERSION}"

          cd rust
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          cd ..
          ./gradlew assembleDebug test lintDebug --stacktrace --console=plain
          git checkout -- rust/Cargo.lock

          python3 - <<'PY'
          from pathlib import Path

          groups = [
              (
                  "Task 1 — MainViewModel",
                  "5bac13879e223841d8625c713b56af574667e0de",
                  sorted(Path("app/src/main/java/com/ekkus/silentdisco/app").glob("MainViewModel*.kt")),
              ),
              (
                  "Task 2 — Storage worker",
                  "7dd779d23a4c411462a796c63693d21913c4e0c0",
                  sorted(Path("rust/silent-disco-core/src/storage/worker").glob("*.rs")),
              ),
              (
                  "Task 3 — Protocol codec",
                  "7be020c4e4e9fd2103698b0d84aee6511098bda8",
                  sorted(Path("rust/silent-disco-core/src/protocol/codec").glob("*.rs")),
              ),
              (
                  "Task 4 — Actor state reducer",
                  "edf5db368af48c42581611a2f684357e4d966308",
                  sorted(Path("rust/silent-disco-core/src/runtime/actor_runtime/state").glob("*.rs")),
              ),
              (
                  "Task 5 — Android database ABI",
                  "e43f750e402b707c8029bbdd96654e8174240242",
                  sorted(Path("rust/silent-disco-ffi/src/android_database_abi").glob("*.rs")),
              ),
          ]

          original_paths = [
              Path("rust/silent-disco-core/src/storage/worker.rs"),
              Path("rust/silent-disco-core/src/protocol/codec.rs"),
              Path("rust/silent-disco-core/src/runtime/actor_runtime/state.rs"),
              Path("rust/silent-disco-ffi/src/android_database_abi.rs"),
          ]
          for path in original_paths:
              if path.exists():
                  raise SystemExit(f"monolithic source path still exists: {path}")

          record = [
              "",
              "---",
              "",
              "# Ralph Loop completion record",
              "",
              "Status: **Implementation complete and fully validated.**",
              "",
              "The five oversized source-file refactors were implemented as five separate commits on `master`.",
              "Before each implementation commit, Rust formatting, strict Clippy with warnings denied, all Rust tests, Android debug assembly, Android unit tests, and Android lint passed.",
              "The same complete validation matrix passed once more after all five commits were combined.",
              "",
              "## Final line counts",
              "",
          ]

          total_files = 0
          for title, commit, files in groups:
              if not files:
                  raise SystemExit(f"no files found for {title}")
              record.extend([f"### {title}", "", f"Implementation commit: `{commit}`", ""])
              for path in files:
                  lines = len(path.read_text(encoding="utf-8").splitlines())
                  if lines >= 800:
                      raise SystemExit(f"line-count target failed: {path} has {lines} lines")
                  record.append(f"- `{path.as_posix()}` — **{lines} lines**")
                  total_files += 1
              record.append("")

          record.extend([
              "## Verified acceptance summary",
              "",
              f"- [x] All {total_files} resulting source files are below 800 physical lines.",
              "- [x] Each original oversized file was handled as its own independently validated task and implementation commit.",
              "- [x] Public `MainViewModel` UI actions remain member methods; large implementations were moved into focused action modules.",
              "- [x] Storage worker queueing, shutdown, serialization, and explicit error behavior remain covered by the Rust test suite.",
              "- [x] Protocol canonical vectors, malformed-input rejection, CRC handling, and decoder diagnostics remain covered by the Rust test suite.",
              "- [x] Actor transactional reducer behavior and public actor integration flows remain covered by the Rust test suite.",
              "- [x] Android database registry, cache, import, and JNI-facing behavior remain covered by Rust and Android validation.",
              "- [x] No wildcard-import lint suppression was added; strict Clippy passed with warnings denied.",
              "- [x] No dependency change or generated `Cargo.lock` change was included in the refactor commits.",
              "- [x] Temporary workflows, transformers, and failure reports were removed after use.",
              "",
          ])

          todo_path = Path("docs/OVERSIZED_SOURCE_FILES_SPLIT_REFACTOR_TODO.md")
          todo = todo_path.read_text(encoding="utf-8")
          marker = "# Ralph Loop completion record"
          if marker in todo:
              todo = todo[: todo.index(marker)].rstrip("\n- \n")
          todo_path.write_text(todo.rstrip() + "\n" + "\n".join(record), encoding="utf-8")
          PY

      - name: Commit final completion record
        run: |
          set -euo pipefail
          rm .github/workflows/ralph-oversized-refactor-final.yml
          rm -f docs/OVERSIZED_SOURCE_FILES_SPLIT_REFACTOR_FINAL_FAILURE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Record completion of oversized source refactor loop"
          git push origin HEAD:master

      - name: Record final validation failure
        if: failure()
        run: |
          set -euo pipefail
          cp /tmp/final-refactor.log /tmp/final-refactor.saved 2>/dev/null || true
          git reset --hard "${GITHUB_SHA}"
          rm -f .github/workflows/ralph-oversized-refactor-final.yml
          if test -s /tmp/final-refactor.saved; then
            {
              printf '# Final oversized refactor validation failure\n\n```text\n'
              tail -n 500 /tmp/final-refactor.saved
              printf '\n```\n'
            } > docs/OVERSIZED_SOURCE_FILES_SPLIT_REFACTOR_FINAL_FAILURE.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record final oversized refactor validation failure [skip ci]"
          git push origin HEAD:master
