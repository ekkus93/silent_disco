name: Observable guarded Desktop Block 17 implementation

on:
  issue_comment:
    types:
      - created

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: observable-guarded-desktop-audio-source
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.1"
  NODE_VERSION: "22.16.0"
  BLOCK17_VALIDATED_INPUT: 7948e62a6526a84c3b4fceacc7971acd9c8e9bbb
  BLOCK17_VALIDATION_RUN: "30576293784"

jobs:
  block18-start:
    if: github.event.issue.number == 45 && github.event.comment.body == '/run-desktop-block18'
    runs-on: ubuntu-latest
    steps:
      - name: Publish guarded run URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 45 --repo "${GITHUB_REPOSITORY}" \
            --body "Desktop Block 18 Ralph Loop started: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} at event commit ${GITHUB_SHA}."

  block18:
    if: github.event.issue.number == 45 && github.event.comment.body == '/run-desktop-block18'
    needs: block18-start
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Capture exact input
        run: echo "BLOCK18_INPUT_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy --component rustfmt
          rustup default "${RUST_VERSION}"

      - name: Install Android SDK, FFmpeg, time, and Linux Tauri packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            ffmpeg \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            time \
            wget

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify the completed Block 17 validation record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BLOCK17_VALIDATION_RUN}" --jq '.head_sha')"
          test "${run_sha}" = "${BLOCK17_VALIDATED_INPUT}"
          validate_result="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BLOCK17_VALIDATION_RUN}/jobs?filter=latest" \
            --jq '.jobs[] | select(.name == "validate") | .conclusion')"
          test "${validate_result}" = success

      - name: Finalize validated Desktop Block 17 when still pending
        id: block17
        run: |
          set -euo pipefail
          unchecked="$(python3 - <<'PY'
          from pathlib import Path
          text = Path("docs/SILENT_DISCO_TAURI_DESKTOP_HOST_TODO.md").read_text()
          start = text.index("## Block 17 — Implement atomic source staging")
          end = text.index("## Block 18 — Resolve the decoder decision gate", start)
          print(text[start:end].count("- [ ]"))
          PY
          )"

          if [[ "${unchecked}" == "0" ]]; then
            grep -F "## 2026-07-30 — Desktop Block 17 atomic source staging complete" memory.md
            echo "committed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${unchecked}" != "19" ]]; then
            echo "unexpected pending Block 17 task count: ${unchecked}" >&2
            exit 1
          fi

          python3 scripts/apply-desktop-block17.py
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all
          cd desktop
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run format
          cd src-tauri
          cargo generate-lockfile
          cd ../..
          bash scripts/check-source-file-line-counts.sh

          python3 - <<'PY'
          from pathlib import Path
          import os

          todo = Path("docs/SILENT_DISCO_TAURI_DESKTOP_HOST_TODO.md")
          text = todo.read_text()
          start = text.index("## Block 17 — Implement atomic source staging")
          end = text.index("## Block 18 — Resolve the decoder decision gate", start)
          block = text[start:end]
          if block.count("- [ ]") != 19:
              raise SystemExit("Block 17 checklist changed during finalization")
          block = block.replace("- [ ]", "- [x]")
          evidence = (
              "**Completion evidence:** Atomic, content-addressed source staging; bounded progress; "
              "explicit cancellation; verified reuse; strict owned-temp startup cleanup; frontend "
              f"integration; and the complete regression matrix passed in GitHub Actions run "
              f"`{os.environ['BLOCK17_VALIDATION_RUN']}` from validated input commit "
              f"`{os.environ['BLOCK17_VALIDATED_INPUT']}`. Native file-dialog interaction was not "
              "performed by this CI run.\n\n"
          )
          marker = "**Acceptance:** The core receives a stable app-owned source path with no destructive or silent recovery."
          if block.count(marker) != 1:
              raise SystemExit("Block 17 acceptance marker mismatch")
          todo.write_text(text[:start] + block.replace(marker, evidence + marker) + text[end:])

          memory = Path("memory.md")
          existing = memory.read_text()
          heading = "## 2026-07-30 — Desktop Block 17 atomic source staging complete"
          if heading in existing:
              raise SystemExit("Block 17 completion entry already exists")
          entry = f'''\n\n{heading}

- Validated input commit: `{os.environ['BLOCK17_VALIDATED_INPUT']}`.
- Guarded validation run: `{os.environ['BLOCK17_VALIDATION_RUN']}`.
- Source selection copies the inspected file into the active profile's `sources/` directory through an owned temporary file, fixed 64 KiB buffers, streaming SHA-256, length/signature verification, file and directory synchronization, and no-clobber atomic publication.
- Stable source IDs and filenames are content-addressed. Existing staged content is reused only after full regular-file, length, and hash verification; mismatches and collisions fail visibly without overwriting data.
- Staging supports bounded 10 Hz progress events, explicit cancellation, profile-close cancellation/join, and deterministic cleanup that preserves both primary and cleanup failures.
- Startup removes only strict, provably owned incomplete regular temporary files. Unrelated files, symbolic links, and non-file entries are never silently deleted.
- Tests cover success, cancellation, source failure during copy, destination write failure, hash mismatch, collision, verified reuse, incomplete-temp cleanup, cleanup refusal, original preservation, progress throttling, and cancellation control.
- Validation passed source-size enforcement; shared Rust format/strict Clippy/tests; Android builds, ABI packaging, unit tests, lint, and instrumentation; generated desktop bindings, format/lint/typecheck/tests/build; desktop Rust strict gates; exact lockfiles; and Linux Tauri bundle creation. Native file-dialog interaction on a physical desktop session remains unclaimed.
'''
          memory.write_text(existing.rstrip() + entry)
          PY

          git rm -r --ignore-unmatch scripts/block17-payload
          git rm --ignore-unmatch scripts/apply-desktop-block17.py
          git rm --ignore-unmatch scripts/finalize-desktop-block17.trigger
          git rm --ignore-unmatch .github/workflows/desktop-block17-finalize-validated.yml
          git rm --ignore-unmatch .github/workflows/finalize-desktop-block17-push.yml
          git rm --ignore-unmatch .github/workflows/desktop-block17-workflow-run-finalize.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Complete Desktop Block 17 atomic source staging"

          remote_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          parent_sha="$(git rev-parse HEAD^)"
          test "${remote_sha}" = "${parent_sha}"
          git push origin HEAD:master
          echo "committed=true" >> "${GITHUB_OUTPUT}"

      - name: Run executable decoder decision spike
        run: bash scripts/run-desktop-block18-spike.sh

      - name: Enforce tracked source-size invariant
        run: bash scripts/check-source-file-line-counts.sh

      - name: Run shared Rust strict gates
        working-directory: rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features

      - name: Verify generated desktop bindings and frontend
        working-directory: desktop
        run: |
          mkdir -p dist
          printf '<!doctype html><title>Silent Disco Block 18 validation</title>\n' > dist/index.html
          npm run bindings:check
          npm run format:check
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Run desktop Rust strict gates
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
          cargo check --all-features

      - name: Build Linux desktop bundles
        working-directory: desktop
        run: npm run tauri build

      - name: Build Android variants and test APK
        run: |
          ./gradlew \
            assembleDebug \
            assemblePocDebug \
            assembleRelease \
            assembleDebugAndroidTest \
            --stacktrace \
            --console=plain

      - name: Verify packaged Rust ABIs
        run: |
          set -euo pipefail
          apks=(
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/pocDebug/app-pocDebug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          )
          abis=(armeabi-v7a arm64-v8a x86 x86_64)
          for apk in "${apks[@]}"; do
            test -f "${apk}"
            for abi in "${abis[@]}"; do
              unzip -Z1 "${apk}" "lib/${abi}/libsilent_disco_ffi.so" \
                | grep -Fx "lib/${abi}/libsilent_disco_ffi.so"
            done
          done

      - name: Run Android unit tests and lint
        run: ./gradlew test lintDebug --stacktrace --console=plain

      - name: Run Android instrumentation suite
        run: |
          ./gradlew pixel2api29DebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=software \
            --stacktrace \
            --console=plain

      - name: Require reproducible existing lockfiles
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            rust/Cargo.lock \
            desktop/package-lock.json \
            desktop/src-tauri/Cargo.lock
          test -f tools/decoder-spike/Cargo.lock

      - name: Record Block 18 decision and completion evidence
        env:
          BLOCK18_RUN: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          results_path = Path("docs/measurements/DESKTOP_BLOCK18_DECODER_SPIKE_RESULTS.json")
          results = json.loads(results_path.read_text())
          if results["candidate"]["version"] != "0.6.0":
              raise SystemExit("unexpected decoder candidate version")
          if results["decision"]["ownership"] != "shared Rust streaming decoder":
              raise SystemExit("unexpected decoder ownership decision")

          todo = Path("docs/SILENT_DISCO_TAURI_DESKTOP_HOST_TODO.md")
          text = todo.read_text()
          start = text.index("## Block 18 — Resolve the decoder decision gate")
          end = text.index("## Block 19 — Implement bounded streaming decode", start)
          block = text[start:end]
          unchecked = block.count("- [ ]")
          if unchecked != 23:
              raise SystemExit(f"expected 23 pending Block 18 decisions, found {unchecked}")
          block = block.replace("- [ ]", "- [x]")
          evidence = (
              "**Completion evidence:** Symphonia `0.6.0` with minimal WAV/PCM, FLAC, MP3, and ID3 "
              "features was compiled and measured against deterministic valid, corrupt, truncated, "
              "oversized-metadata, and cancellation fixtures. The shared Rust streaming decoder path "
              f"was selected in guarded Actions run `{os.environ['BLOCK18_RUN']}` from Block 18 input "
              f"`{os.environ['BLOCK18_INPUT_SHA']}`. Measurements are recorded in "
              "`docs/measurements/DESKTOP_BLOCK18_DECODER_SPIKE_RESULTS.md`; CI-host measurements are "
              "not universal performance limits.\n\n"
          )
          marker = "**Acceptance:** One explicit decoder path is selected with executable evidence."
          if block.count(marker) != 1:
              raise SystemExit("Block 18 acceptance marker mismatch")
          todo.write_text(text[:start] + block.replace(marker, evidence + marker) + text[end:])

          shared = Path("docs/SILENT_DISCO_RUST_CORE_MIGRATION_TODO.md")
          shared_text = shared.read_text()
          shared_marker = "**Acceptance:** One documented production decoder ownership model exists with performance/device evidence."
          decision_note = (
              "**Desktop Block 18 coordination:** Path B (shared Rust decoding) is selected. The "
              "desktop Symphonia spike and decision record are complete, but shared Block 23 remains "
              "open until Android bridge overhead, mobile format parity, iOS file-access constraints, "
              "and physical-device evidence are recorded and the temporary platform path is removed.\n\n"
          )
          if decision_note.strip() in shared_text:
              raise SystemExit("shared Block 23 coordination note already exists")
          if shared_text.count(shared_marker) != 1:
              raise SystemExit("shared Block 23 acceptance marker mismatch")
          shared.write_text(shared_text.replace(shared_marker, decision_note + shared_marker))

          memory = Path("memory.md")
          existing = memory.read_text()
          heading = "## 2026-07-30 — Desktop Block 18 decoder decision complete"
          if heading in existing:
              raise SystemExit("Block 18 memory entry already exists")
          cases = results["cases"]
          entry = f'''\n\n{heading}

- Block 18 input commit: `{os.environ['BLOCK18_INPUT_SHA']}`.
- Guarded Actions run: `{os.environ['BLOCK18_RUN']}`.
- Selected decoder: `symphonia = 0.6.0`, default features disabled, features `wav`, `pcm`, `flac`, `mp3`, `id3v1`, and `id3v2`; license `MPL-2.0`.
- Selected ownership: shared Rust streaming decoder (shared Block 23 Path B), with no automatic platform, HTML, Web Audio, TypeScript, or FFmpeg fallback.
- Initial formats: WAV/PCM, native FLAC, and MP3. Block 19 will convert source-native planar buffers incrementally into bounded 48 kHz stereo PCM16 little-endian chunks.
- Valid fixture realtime factors: WAV `{cases['wav']['realtime_factor']:.1f}x`, FLAC `{cases['flac']['realtime_factor']:.1f}x`, MP3 `{cases['mp3']['realtime_factor']:.1f}x` on this CI host.
- Peak RSS: WAV `{cases['wav']['peak_rss_kib'] / 1024:.1f}` MiB, FLAC `{cases['flac']['peak_rss_kib'] / 1024:.1f}` MiB, MP3 `{cases['mp3']['peak_rss_kib'] / 1024:.1f}` MiB, 2 MiB metadata MP3 `{cases['metadata']['peak_rss_kib'] / 1024:.1f}` MiB.
- Corrupt and truncated fixtures failed visibly; cooperative cancellation stopped at a decoder packet boundary. These measurements are environment-specific evidence, not product-wide limits.
- Shared Block 23 remains open for Android bridge overhead, physical mobile evidence, iOS file-access constraints, and removal of the temporary platform decoder path.
'''
          memory.write_text(existing.rstrip() + entry)
          PY

      - name: Commit Block 18 and remove the temporary workflow
        id: commit
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          current_sha="$(git rev-parse HEAD)"
          test "${remote_sha}" = "${current_sha}"

          git rm .github/workflows/desktop-block17-observable.yml
          git add -A
          git diff --cached --check
          bash scripts/check-source-file-line-counts.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Complete Desktop Block 18 decoder decision"
          commit_sha="$(git rev-parse HEAD)"
          echo "commit_sha=${commit_sha}" >> "${GITHUB_OUTPUT}"
          git push origin HEAD:master

      - name: Publish success
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          gh issue comment 45 --repo "${GITHUB_REPOSITORY}" \
            --body "Desktop Block 18 passed the full guarded matrix and was committed at ${COMMIT_SHA}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."

  block18-failure:
    if: always() && github.event.issue.number == 45 && github.event.comment.body == '/run-desktop-block18' && needs.block18.result != 'success'
    needs:
      - block18-start
      - block18
    runs-on: ubuntu-latest
    steps:
      - name: Publish failure
        env:
          GH_TOKEN: ${{ github.token }}
          BLOCK18_RESULT: ${{ needs.block18.result }}
        run: |
          gh issue comment 45 --repo "${GITHUB_REPOSITORY}" \
            --body "Desktop Block 18 did not complete: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Result=${BLOCK18_RESULT}. Inspect the first failed gate; Block 18 was not marked complete."
