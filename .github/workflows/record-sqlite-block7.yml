name: Record SQLite Block 7

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  record:
    if: github.event.pull_request.head.ref == 'docs/rust-sqlite-block7-record'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: docs/rust-sqlite-block7-record
          fetch-depth: 0

      - name: Apply guarded Block 7 record
        run: |
          python .github/scripts/record_sqlite_block7.py
          git diff --check

      - name: Commit Block 7 record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record Rust SQLite worker Block 7"
          git push origin HEAD:docs/rust-sqlite-block7-record
