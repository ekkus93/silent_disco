name: Run Block 13 Rust Admission Routing

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/run-block13-rust-admission-routing.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: run-block13-rust-admission-routing
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt

      - name: Apply Rust admission routing
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-block13-rust-admission.py
          cd rust
          cargo +1.97.1 fmt --all
          cd ..
          git diff --check

      - name: Validate Rust workspace
        shell: bash
        run: |
          set -o pipefail
          cd rust
          {
            cargo +1.97.1 fmt --all -- --check
            cargo +1.97.1 clippy --workspace --all-targets --all-features -- -D warnings
            cargo +1.97.1 test --workspace --all-features
          } 2>&1 | tee "${RUNNER_TEMP}/block13-rust-admission.log"

      - name: Publish failure excerpt
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/block13-rust-admission.log"
          excerpt="$(tail -n 180 "${log}" 2>/dev/null || true)"
          body_file="${RUNNER_TEMP}/issue-body.md"
          {
            echo '<!-- maintained by run-block13-rust-admission-routing.yml -->'
            echo '# Desktop Block 13 Rust Admission Failure'
            echo
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo "- **Run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```text'
            printf '%s\n' "${excerpt}"
            echo '```'
          } > "${body_file}"
          jq -n --arg body "$(cat "${body_file}")" '{body: $body}' > "${RUNNER_TEMP}/issue.json"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/44" \
            --input "${RUNNER_TEMP}/issue.json" >/dev/null

      - name: Commit validated Rust admission routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/silent-disco-core/src/runtime/actor_runtime/state/commands.rs \
            rust/silent-disco-ffi/tests/host_admission.rs
          git commit -m "Route Rust host admission commands"
          for attempt in 1 2 3; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              exit 0
            fi
            printf 'Push attempt %s raced another master update; retrying.\n' "${attempt}" >&2
          done
          exit 1
