name: Repository branch cleanup

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Clean temporary repository branches'
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Delete temporary remote branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | sort \
              | grep -E '^(agent|docs|feature|audit)/' || true
          )
          printf 'Deleting %s temporary branches\n' "${#branches[@]}"
          for branch in "${branches[@]}"; do
            printf 'Deleting %s\n' "$branch"
            git push origin --delete "$branch"
          done
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          remaining="$(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -v '^master$' | grep -v '^HEAD$' || true)"
          if [ -n "$remaining" ]; then
            printf 'Unexpected non-master branches remain:\n%s\n' "$remaining" >&2
            exit 1
          fi

      - name: Remove temporary audit material and cleanup workflow
        run: |
          rm -rf .repository-audit
          rm .github/workflows/repository-branch-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove temporary repository cleanup material"
          git push origin HEAD:master
