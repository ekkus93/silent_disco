name: SQLite worker diagnostics

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  diagnostics:
    if: github.event.pull_request.head.ref == 'feature/rust-sqlite-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/rust-sqlite-worker

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Apply guarded patches in the diagnostic workspace
        run: python .github/scripts/bootstrap_sqlite_worker.py

      - name: Generate lockfile and format
        run: |
          cd rust
          cargo generate-lockfile
          cargo fmt --all

      - name: Run strict diagnostics
        id: strict
        shell: bash
        run: |
          set -o pipefail
          cd rust
          {
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            cargo test --workspace --all-features
          } 2>&1 | tee ../sqlite-worker-diagnostics.log

      - name: Upload strict diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-worker-strict-diagnostics
          path: sqlite-worker-diagnostics.log
          if-no-files-found: error
          retention-days: 1
