name: Temporary PR38 Desktop Clippy Repair

on:
  push:
    branches:
      - chatgpt/fix-rust-ci-30332312110

permissions:
  contents: write

jobs:
  repair-desktop-rust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-rust-ci-30332312110
          fetch-depth: 0

      - name: Install pinned formatter
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1

      - name: Apply structural desktop Clippy fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def edit(path: str, pattern: str, replacement: str, label: str) -> None:
              target = Path(path)
              text = target.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"{label}: expected one structural match in {path}, found {count}")
              target.write_text(updated)

          edit(
              "desktop/src-tauri/src/platform/paths.rs",
              r"    if let Some\(parent\) = canonical_parent \{\n        if !canonical\.starts_with\(parent\) \{\n            return Err\(ProfilePathError::DirectoryEscapedTrustedRoot\(label\)\);\n        \}\n    \}",
              "    if let Some(parent) = canonical_parent\n        && !canonical.starts_with(parent)\n    {\n        return Err(ProfilePathError::DirectoryEscapedTrustedRoot(label));\n    }",
              "trusted-root containment",
          )

          edit(
              "desktop/src-tauri/src/platform/paths.rs",
              r"        fn drop\(&mut self\) \{\n            if let Err\(error\) = fs::remove_dir_all\(&self\.0\) \{\n                if error\.kind\(\) != std::io::ErrorKind::NotFound \{\n                    panic!\(\"failed to remove test directory: \{error\}\"\);\n                \}\n            \}\n        \}",
              "        fn drop(&mut self) {\n            if let Err(error) = fs::remove_dir_all(&self.0) {\n                assert_eq!(\n                    error.kind(),\n                    std::io::ErrorKind::NotFound,\n                    \"failed to remove test directory: {error}\"\n                );\n            }\n        }",
              "paths test cleanup",
          )

          edit(
              "desktop/src-tauri/src/platform/profile_lock.rs",
              r"            \.field\(\"lock_path\", &self\.lock_path\)\n            \.field\(\"held\", &self\.file\.is_some\(\)\)\n            \.finish\(\)",
              "            .field(\"lock_path\", &self.lock_path)\n            .field(\"held\", &self.file.is_some())\n            .field(\"release_attempted\", &self.release_attempted)\n            .finish()",
              "profile lease debug fields",
          )

          edit(
              "desktop/src-tauri/src/platform/profile_lock.rs",
              r"        if !self\.release_attempted && !std::thread::panicking\(\) \{\n            panic!\(\n                \"ProfileLease for '\{\}' was dropped without explicit release; fallback unlock result: \{unlock_result:\?\}\",\n                self\.profile_id\n            \);\n        \}",
              "        assert!(\n            self.release_attempted || std::thread::panicking(),\n            \"ProfileLease for '{}' was dropped without explicit release; fallback unlock result: {unlock_result:?}\",\n            self.profile_id\n        );",
              "explicit profile release assertion",
          )

          edit(
              "desktop/src-tauri/src/platform/profile_lock.rs",
              r"        fn drop\(&mut self\) \{\n            if let Err\(error\) = fs::remove_dir_all\(&self\.0\) \{\n                if error\.kind\(\) != std::io::ErrorKind::NotFound \{\n                    panic!\(\"failed to remove test directory: \{error\}\"\);\n                \}\n            \}\n        \}",
              "        fn drop(&mut self) {\n            if let Err(error) = fs::remove_dir_all(&self.0) {\n                assert_eq!(\n                    error.kind(),\n                    std::io::ErrorKind::NotFound,\n                    \"failed to remove test directory: {error}\"\n                );\n            }\n        }",
              "profile lock test cleanup",
          )

          edit(
              "desktop/src-tauri/src/platform/profile_metadata.rs",
              r"impl fmt::Display for ProfileMetadataError \{\n    fn fmt\(&self, formatter: &mut fmt::Formatter<'_>\) -> fmt::Result \{",
              "impl fmt::Display for ProfileMetadataError {\n    #[allow(\n        clippy::too_many_lines,\n        reason = \"the exhaustive formatter keeps every metadata failure variant explicit\"\n    )]\n    fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {",
              "metadata formatter rationale",
          )

          edit(
              "desktop/src-tauri/src/platform/profile_metadata.rs",
              r"        fn drop\(&mut self\) \{\n            if let Err\(error\) = fs::remove_dir_all\(&self\.0\) \{\n                if error\.kind\(\) != std::io::ErrorKind::NotFound \{\n                    panic!\(\"failed to remove test directory: \{error\}\"\);\n                \}\n            \}\n        \}",
              "        fn drop(&mut self) {\n            if let Err(error) = fs::remove_dir_all(&self.0) {\n                assert_eq!(\n                    error.kind(),\n                    std::io::ErrorKind::NotFound,\n                    \"failed to remove test directory: {error}\"\n                );\n            }\n        }",
              "metadata test cleanup",
          )

          edit(
              "desktop/src-tauri/src/platform/storage_inspection.rs",
              r"/// last\. It never opens SQLite directly and never falls back to an in-memory or",
              "/// last. It never opens `SQLite` directly and never falls back to an in-memory or",
              "SQLite documentation markup",
          )

          edit(
              "desktop/src-tauri/src/platform/storage_inspection.rs",
              r"        fn drop\(&mut self\) \{\n            if let Err\(error\) = fs::remove_dir_all\(&self\.0\) \{\n                if error\.kind\(\) != std::io::ErrorKind::NotFound && !std::thread::panicking\(\) \{\n                    panic!\(\"failed to remove storage-inspection test directory: \{error\}\"\);\n                \}\n            \}\n        \}",
              "        fn drop(&mut self) {\n            if let Err(error) = fs::remove_dir_all(&self.0) {\n                assert!(\n                    error.kind() == std::io::ErrorKind::NotFound || std::thread::panicking(),\n                    \"failed to remove storage-inspection test directory: {error}\"\n                );\n            }\n        }",
              "storage inspection test cleanup",
          )

          checks = {
              "desktop/src-tauri/src/platform/paths.rs": [
                  "&& !canonical.starts_with(parent)",
                  "assert_eq!(",
              ],
              "desktop/src-tauri/src/platform/profile_lock.rs": [
                  '.field("release_attempted", &self.release_attempted)',
                  "self.release_attempted || std::thread::panicking()",
              ],
              "desktop/src-tauri/src/platform/profile_metadata.rs": [
                  "the exhaustive formatter keeps every metadata failure variant explicit",
              ],
              "desktop/src-tauri/src/platform/storage_inspection.rs": [
                  "opens `SQLite` directly",
                  "error.kind() == std::io::ErrorKind::NotFound || std::thread::panicking()",
              ],
          }
          for path, markers in checks.items():
              text = Path(path).read_text()
              for marker in markers:
                  if marker not in text:
                      raise SystemExit(f"postcondition missing in {path}: {marker}")
          PY
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all -- --check

      - name: Commit formatted repair and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-pr38-desktop-clippy-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            desktop/src-tauri/src/platform/paths.rs \
            desktop/src-tauri/src/platform/profile_lock.rs \
            desktop/src-tauri/src/platform/profile_metadata.rs \
            desktop/src-tauri/src/platform/storage_inspection.rs
          git commit -m "Fix desktop Rust Clippy findings"
          git push origin HEAD:chatgpt/fix-rust-ci-30332312110
