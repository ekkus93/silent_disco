name: One-time connected tests on Android test device

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: one-time-connected-tests-on-atd
  cancel-in-progress: false

jobs:
  connected:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install emulator libraries and enable KVM
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libgl1 libx11-6 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxi6 libxtst6
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Run every connected Android instrumentation test
        id: connected
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            pwd | tee connected-atd-working-directory.txt
            adb devices -l | tee connected-atd-adb-devices.txt
            set -o pipefail
            ./gradlew connectedDebugAndroidTest --stacktrace --console=plain \
              2>&1 | tee connected-atd-tests.log

      - name: Capture ATD diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p connected-atd-diagnostics
          adb devices -l > connected-atd-diagnostics/adb-devices-after.txt 2>&1 || true
          ps auxww > connected-atd-diagnostics/processes.txt
          find "$HOME/.android" -maxdepth 4 -type f -print \
            > connected-atd-diagnostics/android-home-files.txt 2>/dev/null || true
          for file in connected-atd-working-directory.txt connected-atd-adb-devices.txt connected-atd-tests.log; do
            cp "$file" connected-atd-diagnostics/ 2>/dev/null || true
          done
          while IFS= read -r file; do
            case "$file" in
              *.ini|*.log|*.txt)
                safe="$(printf '%s' "$file" | tr '/ ' '__')"
                tail -n 3000 "$file" > "connected-atd-diagnostics/${safe}" 2>/dev/null || true
                ;;
            esac
          done < connected-atd-diagnostics/android-home-files.txt

      - name: Record result and remove one-time workflow
        if: always()
        shell: bash
        env:
          CONNECTED: ${{ steps.connected.outcome }}
        run: |
          set -euo pipefail
          git fetch origin master
          remote_head="$(git rev-parse origin/master)"
          failed=0
          if [ "${CONNECTED}" != "success" ] || [ "${remote_head}" != "${GITHUB_SHA}" ]; then
            failed=1
          fi

          rm -f .github/workflows/master-connected-atd-once.yml
          rm -rf .validation

          if [ "${failed}" -ne 0 ]; then
            mkdir -p .validation/master-connected-atd
            {
              printf 'run_id=%s\n' "${GITHUB_RUN_ID}"
              printf 'tested_sha=%s\n' "${GITHUB_SHA}"
              printf 'connected=%s\n' "${CONNECTED}"
              printf 'remote_head=%s\n' "${remote_head}"
            } > .validation/master-connected-atd/result.txt
            cp -R connected-atd-diagnostics/. .validation/master-connected-atd/ 2>/dev/null || true
            if [ -d app/build/outputs/androidTest-results ]; then
              tar -czf .validation/master-connected-atd/android-test-results.tar.gz \
                app/build/outputs/androidTest-results
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f .validation/master-connected-atd 2>/dev/null || true
          if [ "${failed}" -eq 0 ]; then
            git commit -m "Complete all lint and automated tests on master"
          else
            git commit -m "Record Android test device diagnostics"
          fi
          git push origin HEAD:master
          exit "${failed}"
