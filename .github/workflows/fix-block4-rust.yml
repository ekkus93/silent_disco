name: Fix Block 4 Rust formatting

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'ekkus93/silent_disco'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1

      - name: Apply guarded compiler and documentation fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          enums_path = Path('rust/silent-disco-core/src/domain/enums.rs')
          enums = enums_path.read_text()
          old_signature = 'fn try_from(value: u16) -> Result<Self, Self::Error> {'
          if enums.count(old_signature) != 1:
              raise SystemExit('expected exactly one ambiguous TryFrom signature')
          enums = enums.replace(
              old_signature,
              'fn try_from(value: u16) -> Result<Self, EnumDecodeError> {',
          )
          enums_path.write_text(enums)

          error_path = Path('rust/silent-disco-core/src/error.rs')
          error = error_path.read_text()
          old_doc = '/// Stable transfer record for future UniFFI and persistence conversions.'
          new_doc = '/// Stable transfer record for future `UniFFI` and persistence conversions.'
          if error.count(old_doc) != 1:
              raise SystemExit('expected exactly one UniFFI documentation line')
          error_path.write_text(error.replace(old_doc, new_doc))
          PY

          cd rust
          cargo fmt --all
          cd ..
          rm .github/workflows/fix-block4-rust.yml
          git diff --check

      - name: Commit exact fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/silent-disco-core/src/ .github/workflows/fix-block4-rust.yml
          git commit -m "Fix Rust domain formatting and compiler ambiguity"
          git push origin HEAD:master
