name: One-time validation artifact cleanup

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Remove temporary validation material
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            .validation \
            connected-atd-adb-devices.txt \
            connected-atd-diagnostics \
            connected-atd-results \
            connected-atd-working-directory.txt \
            connected-default-adb-devices.txt \
            connected-default-diagnostics \
            connected-default-working-directory.txt \
            host-architecture.txt \
            linux-connected-host.txt
          rm -f .github/workflows/cleanup-validation-artifacts-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary validation artifacts"
          git push origin HEAD:master
