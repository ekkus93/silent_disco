name: Temporary Desktop Cargo Lock PR38

on:
  push:
    branches:
      - chatgpt/fix-rust-ci-30332312110

permissions:
  contents: write

jobs:
  normalize-cargo-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-rust-ci-30332312110
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1

      - name: Normalize desktop Cargo metadata
        run: |
          cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml

      - name: Commit exact Cargo lockfile
        run: |
          if git diff --quiet -- desktop/src-tauri/Cargo.lock desktop/src-tauri/Cargo.toml desktop/src-tauri/src; then
            echo "Desktop Cargo metadata is already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src-tauri/Cargo.lock desktop/src-tauri/Cargo.toml desktop/src-tauri/src
          git commit -m "Normalize desktop Cargo metadata"
          git push origin HEAD:chatgpt/fix-rust-ci-30332312110
