name: Fix Desktop Block 16 app-state test once

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/fix-block16-app-state-test-once.yml"

permissions:
  contents: write

concurrency:
  group: fix-desktop-block16-app-state-test-once
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update authoritative startup snapshot assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("desktop/src-tauri/src/app_state.rs")
          text = path.read_text()
          old = '''        assert_eq!(response.snapshot.revision, "0");
                  assert_eq!(state.current_snapshot().expect("snapshot").revision, "0");
          '''
          new = '''        assert_eq!(response.snapshot.revision, "1");
                  assert!(response.snapshot.capabilities.audio_source_selection_available);
                  assert!(response.snapshot.capabilities.secure_store_available);
                  assert!(!response.snapshot.capabilities.audio_output_available);
                  assert_eq!(state.current_snapshot().expect("snapshot").revision, "1");
          '''
          if text.count(old) != 1:
              raise SystemExit("expected app-state assertion block was not found exactly once")
          path.write_text(text.replace(old, new))
          PY

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src-tauri/src/app_state.rs
          git rm .github/workflows/fix-block16-app-state-test-once.yml
          git commit -m "Align app-state test with capability publication"
          git push origin HEAD:master
