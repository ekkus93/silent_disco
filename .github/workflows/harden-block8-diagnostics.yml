name: Harden Block 8 diagnostics

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.ref == 'agent/rust-storage-block8'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Block 8 branch
        uses: actions/checkout@v4
        with:
          ref: agent/rust-storage-block8
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Apply guarded diagnostic hardening
        run: python .github/scripts/harden_block8_diagnostics.py

      - name: Format and validate Rust
        shell: bash
        run: |
          set -o pipefail
          cd rust
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee ../block8-diagnostic-hardening.log
          cargo test --workspace --all-features 2>&1 | tee -a ../block8-diagnostic-hardening.log

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block8-diagnostic-hardening
          path: block8-diagnostic-hardening.log
          if-no-files-found: warn
          retention-days: 1

      - name: Verify patch hygiene
        run: git diff --check

      - name: Commit validated diagnostic hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bound and paginate diagnostic storage results"
          git push origin HEAD:agent/rust-storage-block8
