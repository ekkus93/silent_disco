name: Validate Desktop Block 22 shared transport

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: desktop-block22-shared
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.1"
  TRACKING_ISSUE: "45"

jobs:
  validate:
    if: >-
      github.event.issue.number == 45 &&
      github.event.comment.body == '/run-desktop-block22-shared'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Capture exact input and announce
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "BLOCK22_SHARED_INPUT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Desktop Block 22 shared-transport validation started in Actions run $GITHUB_RUN_ID against direct-master input $(git rev-parse HEAD). No branch or PR is involved."

      - name: Apply shared transport candidate
        run: python3 .github/apply-block22-shared.py

      - name: Install desktop native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget

      - name: Install pinned Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_VERSION"

      - name: Format candidate
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all

      - name: Run focused shared transport and actor tests
        run: |
          cargo test --manifest-path rust/Cargo.toml -p silent-disco-core pending_control_peer_receives_hello_before_datagram_authorization -- --nocapture
          cargo test --manifest-path rust/Cargo.toml -p silent-disco-core transport -- --nocapture
          cargo test --manifest-path rust/Cargo.toml -p silent-disco-core actor -- --nocapture

      - name: Run strict shared Rust gates
        working-directory: rust
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features

      - name: Run desktop backend compatibility gates
        working-directory: desktop/src-tauri
        run: |
          mkdir -p ../dist
          printf '<!doctype html><title>Silent Disco Block 22 shared validation</title>\n' > ../dist/index.html
          cargo test platform::network_tests -- --nocapture
          cargo clippy --all-targets --all-features -- -D warnings
          cargo check --all-features

      - name: Enforce source-size invariant
        run: bash scripts/check-source-file-line-counts.sh

      - name: Commit validated shared transport directly to master
        run: |
          set -euo pipefail
          git rm .github/workflows/desktop-block22-shared.yml .github/apply-block22-shared.py
          git add \
            rust/silent-disco-core/src/transport/boundary.rs \
            rust/silent-disco-core/src/transport/socket/host.rs \
            rust/silent-disco-core/src/transport/virtual_transport.rs \
            rust/silent-disco-core/src/transport/virtual_fault.rs \
            rust/silent-disco-core/src/transport/tests.rs \
            rust/silent-disco-core/src/runtime/actor_runtime/state/transport.rs \
            desktop/src-tauri/src/platform/network_tests.rs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Add pre-approval control handshake (Desktop Block 22)"
          remote_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test "$remote_sha" = "$(git rev-parse HEAD^)"
          git push origin HEAD:master
          echo "BLOCK22_SHARED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Desktop Block 22 shared transport slice passed in Actions run $GITHUB_RUN_ID and committed $BLOCK22_SHARED_COMMIT directly to master. Pre-approval TCP Hello, strict UDP authorization, disconnect cleanup, full Rust gates, desktop compatibility, and source-size checks passed."

      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Desktop Block 22 shared-transport validation failed in Actions run $GITHUB_RUN_ID against $BLOCK22_SHARED_INPUT. Continue directly on master from the first failed gate."
