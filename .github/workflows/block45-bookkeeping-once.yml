name: Apply Block 45 bookkeeping once

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/block45-bookkeeping-once.yml"

permissions:
  contents: write

jobs:
  apply-bookkeeping:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out exact updater commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Apply verified bookkeeping patch and remove updater
        shell: bash
        run: |
          set -euo pipefail

          expected_parent="9368ff6f350afac6d3bc587d3820c76c4f00df41"
          expected_todo_before="3e207e794fe0a30c0195ba4ab36777caeaf7d5ee"
          expected_memory_before="2b39ba483ed2078665391232970145192cbfc1be"
          expected_todo_after="9a7f2aed3cba7e438e50952541cc32e75773249b"
          expected_memory_after="1413432f4de50cba889e0ac303ce8e996fb005a8"
          expected_patch_sha256="b79ec62a514c104a15a26922bb274fe34415b9f3f5da0dd2e96e44bdc7944d97"

          test "$(git rev-parse HEAD^)" = "${expected_parent}"
          test "$(git hash-object docs/SILENT_DISCO_TAURI_DESKTOP_HOST_TODO.md)" = "${expected_todo_before}"
          test "$(git hash-object memory.md)" = "${expected_memory_before}"

          cat > /tmp/block45-bookkeeping.patch.gz.b64 <<'B64'
[... ELLIPSIZATION ...]
B64
          base64 --decode /tmp/block45-bookkeeping.patch.gz.b64 > /tmp/block45-bookkeeping.patch.gz
          gzip --decompress --stdout /tmp/block45-bookkeeping.patch.gz > /tmp/block45-bookkeeping.patch
          printf '%s  %s\n' "${expected_patch_sha256}" /tmp/block45-bookkeeping.patch | sha256sum --check --strict

          git apply --check /tmp/block45-bookkeeping.patch
          git apply /tmp/block45-bookkeeping.patch

          test "$(git hash-object docs/SILENT_DISCO_TAURI_DESKTOP_HOST_TODO.md)" = "${expected_todo_after}"
          test "$(git hash-object memory.md)" = "${expected_memory_after}"
          git diff --check

          git rm .github/workflows/block45-bookkeeping-once.yml
          git config user.name "silent-disco-bookkeeping"
          git config user.email "actions@users.noreply.github.com"
          git add docs/SILENT_DISCO_TAURI_DESKTOP_HOST_TODO.md memory.md
          git commit -m "Refresh desktop host TODO through Block 45"
          git push origin HEAD:master
