name: One-time repaired connected test action

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: one-time-repaired-connected-test-action
  cancel-in-progress: false

jobs:
  connected:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install emulator host libraries and enable KVM
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libgl1 libx11-6 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxi6 libxtst6
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          ldconfig -p | grep 'libpulse.so.0'

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Run every connected Android instrumentation test
        id: connected
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -wipe-data -noaudio -no-boot-anim -no-metrics -camera-back none
          script: |
            set -o pipefail
            adb devices -l | tee connected-action-adb-devices.txt
            ./gradlew connectedDebugAndroidTest --stacktrace --console=plain \
              2>&1 | tee connected-action-tests.log

      - name: Record result and remove one-time workflow
        if: always()
        shell: bash
        env:
          CONNECTED: ${{ steps.connected.outcome }}
        run: |
          set -euo pipefail
          git fetch origin master
          remote_head="$(git rev-parse origin/master)"
          failed=0
          if [ "${CONNECTED}" != "success" ] || [ "${remote_head}" != "${GITHUB_SHA}" ]; then
            failed=1
          fi

          rm -f .github/workflows/master-connected-action-run-once.yml
          rm -rf .validation

          if [ "${failed}" -ne 0 ]; then
            mkdir -p .validation/master-connected-action-run
            {
              printf 'run_id=%s\n' "${GITHUB_RUN_ID}"
              printf 'tested_sha=%s\n' "${GITHUB_SHA}"
              printf 'connected=%s\n' "${CONNECTED}"
              printf 'remote_head=%s\n' "${remote_head}"
            } > .validation/master-connected-action-run/result.txt
            if [ -f connected-action-tests.log ]; then
              tail -n 8000 connected-action-tests.log \
                > .validation/master-connected-action-run/connected-tests.log
            fi
            cp connected-action-adb-devices.txt .validation/master-connected-action-run/ 2>/dev/null || true
            if [ -d app/build/outputs/androidTest-results ]; then
              tar -czf .validation/master-connected-action-run/android-test-results.tar.gz \
                app/build/outputs/androidTest-results
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f .validation/master-connected-action-run 2>/dev/null || true
          if [ "${failed}" -eq 0 ]; then
            git commit -m "Complete all automated tests on master"
          else
            git commit -m "Record repaired emulator action failure"
          fi
          git push origin HEAD:master
          exit "${failed}"
