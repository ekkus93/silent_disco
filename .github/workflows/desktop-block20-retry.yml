name: Retry Desktop Block 20 candidate

on:
  push:
    branches: [master]
    paths: [.github/workflows/desktop-block20-retry.yml]

permissions:
  contents: write
  issues: write

concurrency:
  group: desktop-block20-candidate
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.1"
  TRACKING_ISSUE: "45"
  PAYLOAD_SHA256: "8df02204f749d9f1c290583a1196f00776e67a1cf4a871f345d368140af43070"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Capture input and publish start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "BLOCK20_INPUT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          gh issue comment "${TRACKING_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
            --body "Desktop Block 20 strict candidate retry started in Actions run ${GITHUB_RUN_ID} against direct-master input $(git rev-parse HEAD). No branch or PR is involved."

      - name: Materialize and repair candidate
        run: |
          set -euo pipefail
          cat .github/desktop-block20-source/part-*.b64 | base64 --decode > /tmp/block20.tar.gz
          echo "${PAYLOAD_SHA256}  /tmp/block20.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/block20.tar.gz
          mv rust/silent-disco-core/src/transport/virtual.rs \
            rust/silent-disco-core/src/transport/virtual_transport.rs
          sed -i \
            -e 's/^mod virtual;$/mod virtual_transport;/' \
            -e 's/^pub use virtual::{/pub use virtual_transport::{/' \
            rust/silent-disco-core/src/transport/mod.rs
          python3 .github/desktop-block20-base-repair.py
          python3 .github/desktop-block20-lint-repair.py
          grep -Fqx 'pub mod transport;' rust/silent-disco-core/src/lib.rs

      - name: Install pinned Rust
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy --component rustfmt
          rustup default "${RUST_VERSION}"

      - name: Run focused strict gates
        run: |
          set -o pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all 2>&1 | tee /tmp/block20-format.log
          bash scripts/check-source-file-line-counts.sh 2>&1 | tee /tmp/block20-lines.log
          cargo clippy --manifest-path rust/Cargo.toml -p silent-disco-core \
            --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/block20-clippy.log
          cargo test --manifest-path rust/Cargo.toml -p silent-disco-core \
            transport -- --nocapture 2>&1 | tee /tmp/block20-tests.log

      - name: Publish candidate directly to master
        run: |
          set -euo pipefail
          git rm .github/workflows/desktop-block20.yml
          git rm .github/workflows/desktop-block20-retry.yml
          git rm -r .github/desktop-block20-source
          git rm .github/desktop-block20-base-repair.py
          git rm .github/desktop-block20-lint-repair.py
          git add rust/silent-disco-core/src/lib.rs rust/silent-disco-core/src/transport
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Implement shared transport runtime candidate (Desktop Block 20)"
          remote_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test "${remote_sha}" = "$(git rev-parse HEAD^)"
          git push origin HEAD:master
          echo "BLOCK20_CANDIDATE=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Publish success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${TRACKING_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
            --body "Desktop Block 20 focused strict gates passed in Actions run ${GITHUB_RUN_ID}. Candidate ${BLOCK20_CANDIDATE} was committed directly to master and all temporary candidate machinery was removed."

      - name: Publish compact failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Desktop Block 20 strict candidate retry failed in Actions run ${GITHUB_RUN_ID} against ${BLOCK20_INPUT}. No source candidate was committed."
            echo
            echo '```text'
            tail -120 /tmp/block20-format.log 2>/dev/null || true
            tail -120 /tmp/block20-lines.log 2>/dev/null || true
            tail -160 /tmp/block20-clippy.log 2>/dev/null || true
            tail -160 /tmp/block20-tests.log 2>/dev/null || true
            echo '```'
          } > /tmp/block20-failure.md
          gh issue comment "${TRACKING_ISSUE}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/block20-failure.md
