name: One-shot Desktop CI cleanup

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/one-shot-desktop-ci-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact Desktop CI fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          mdns = Path("desktop/src-tauri/src/platform/mdns.rs")
          text = mdns.read_text()
          replacements = {
              '            properties.get("sessionId").map(mdns_sd::TxtProperty::val_str),\n':
              '            properties\n                .get("sessionId")\n                .map(mdns_sd::TxtProperty::val_str),\n',
              '            properties.get("syncPort").map(mdns_sd::TxtProperty::val_str),\n':
              '            properties\n                .get("syncPort")\n                .map(mdns_sd::TxtProperty::val_str),\n',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one mDNS match, found {count}: {old!r}")
              text = text.replace(old, new)
          mdns.write_text(text)

          probe = Path("desktop/src-tauri/src/bin/performance_probe.rs")
          text = probe.read_text()
          old = '        let listener = factory.connect_listener(config, Arc::clone(clock))?;\n'
          new = (
              '        let listener_clock = Arc::clone(clock);\n'
              '        let listener = factory.connect_listener(config, listener_clock)?;\n'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one performance-probe match, found {count}")
          probe.write_text(text.replace(old, new))
          PY

          git diff --check
          git diff -- desktop/src-tauri/src/platform/mdns.rs desktop/src-tauri/src/bin/performance_probe.rs

      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-desktop-ci-fix.yml
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add desktop/src-tauri/src/platform/mdns.rs desktop/src-tauri/src/bin/performance_probe.rs
          git commit -m "Fix remaining Desktop CI compile and format errors"
          git push origin HEAD:master
