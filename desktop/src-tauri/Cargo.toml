[package]
name = "silent-disco-desktop"
version = "0.1.0"
description = "Silent Disco desktop host"
edition = "2024"
license = "MIT"
rust-version = "1.97.1"

[lib]
name = "silent_disco_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.6.2"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
silent-disco-core = { path = "../../rust/silent-disco-core" }
tauri = "=2.11.2"
tauri-plugin-dialog = "=2.7.2"
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "warn"
