[package]
name = "silent-disco-desktop"
version = "0.1.0"
description = "Silent Disco desktop host"
edition = "2024"
license = "MIT"
rust-version = "1.97.1"

[lib]
name = "silent_disco_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
base64 = "=0.22.1"
cpal = "=0.18.1"
getrandom = "=0.3.4"
keyring = "=4.1.5"
netdev = "=0.45.0"
p256 = { version = "=0.13.2", features = ["ecdsa", "pkcs8"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
silent-disco-core = { path = "../../rust/silent-disco-core" }
tauri = { version = "=2.11.2", features = [] }
tauri-plugin-dialog = "=2.7.2"
ts-rs = { version = "=12.0.1", features = ["serde-compat", "no-serde-warnings"] }
mdns-sd = "=0.20.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "warn"
